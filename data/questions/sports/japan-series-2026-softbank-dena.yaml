id: japan-series-2026-softbank-dena
domain: sports
title: 2026 Japan Series - Fukuoka SoftBank Hawks vs Yokohama DeNA BayStars
question: >-
  Who will win the 2026 Japan Series between the Fukuoka SoftBank Hawks and
  the Yokohama DeNA BayStars, and in how many games?
question_type: multiple_choice
options:
  - "SoftBank in 4"
  - "SoftBank in 5"
  - "SoftBank in 6"
  - "SoftBank in 7"
  - "DeNA in 4"
  - "DeNA in 5"
  - "DeNA in 6"
  - "DeNA in 7"
resolution_criteria: >-
  Resolves to the team that wins four games in the best-of-seven SMBC Japan
  Series 2026 (starting 24 October 2026) combined with the number of decided
  games needed, per NPB official results. If a tied game occurs, count games
  won by the champion plus games won by the opponent.
context_summary: >-
  The 2026 Japan Series opens on 24 October at Yokohama Stadium. It is the
  third meeting of these franchises, following 2017 (SoftBank in six) and
  2024, when DeNA lost the first two games at home and then won four straight
  to take their first title in 26 years. SoftBank are the defending champions
  after beating Hanshin 4-1 in 2025, and they won the Pacific League with a
  dominant 91-49-3 record (.650), 11.5 games clear. Under a new rule, that
  margin gave them a two-win advantage in the Climax Series final stage, and
  they then beat Nippon-Ham 6-4, 6-2 and 6-2. Yokohama DeNA finished only
  third in the Central League (71-69-3) but are unbeaten in the postseason.
  They won 2-1 and 4-1 at Yomiuri in the first stage, then swept the
  pennant-winning Hanshin Tigers at Koshien 2-0, 1-0, 4-0 and 8-5, overcoming
  Hanshin's one-win advantage, for six straight road wins. Neither team has
  lost a postseason game. Game 1 starters are Yutaro Ishida for DeNA (5-8,
  2.91 ERA) and Naoyuki Uwasawa for SoftBank (10-4, 2.39 ERA), with Livan
  Moinelo, who was hit hard in the final stage, pushed to Game 2. DeNA's ace
  Katsuki Azuma (16 wins, 1.98 ERA) is lined up for Game 2. Key bats include
  Kensuke Kondo (.300/30 HR/100 RBI) for SoftBank and Shugo Maki (29 HR, 103
  RBI) for DeNA. Games 1-2 are in Yokohama, Games 3-5 at Fukuoka's Mizuho
  PayPay Dome, and Games 6-7 back in Yokohama.
