event_date: 2026-10-28
outcome_summary: >-
  The SoftBank Hawks swept the BayStars 4-0 to win back-to-back Japan Series
  titles. It was their 13th overall, tying Seibu for the most by a Pacific
  League club, and they finished the postseason a perfect 7-0, a first in
  Japan Series history. Despite the sweep, the series was tight: Games 1, 2
  and 3 all went to extra innings, the first time three straight Japan Series
  games had done so. In Game 2, SoftBank tied it in the ninth and Kawamura,
  who had one career home run, hit the winner. In Game 3 they tied it with
  two out in the ninth on Makihara's hit, and Tomoya Masaki won it with a
  walk-off home run. In Game 4 on 28 October at the Mizuho PayPay Dome, DeNA
  led early on a Keita Sano two-run homer before catcher Yudai Yamamoto, traded
  from DeNA in May, drove in three runs, including a game-tying two-run
  triple, in a 4-2 comeback win. Closer Sugiyama got the save. Masaki was
  named series MVP (.348, 2 HR).
resolved_answer: "SoftBank in 4"
