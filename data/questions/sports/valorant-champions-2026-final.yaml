event_date: 2026-10-18
outcome_summary: >-
  LOUD beat Team Vitality 3-1 to win VALORANT Champions Shanghai 2026,
  becoming the first organisation to win two Champions titles (the first was
  in 2022). Map scores: Summit 13-11 to LOUD, who came back from a 9-3
  halftime deficit; Lotus 13-8 to Vitality (Derke top-fragged); Sunset 13-5
  to LOUD (tkzin 26 kills); Haven 13-10 to LOUD after a 6-6 half, with LOUD
  winning six of the first seven rounds after the break. erde was named
  tournament MVP and had the best series rating (1.13, 66 kills). tkzin led
  the final with 77 kills. LOUD's two map picks, Summit and Sunset, both
  turned into wins. At the event Riot also revealed a new Duelist agent,
  Hush.
resolved_answer: "LOUD 3-1"
