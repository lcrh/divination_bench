title: VALORANT Champions Shanghai 2026 grand final - LOUD vs Team Vitality
question: >-
  What will be the series score of the VALORANT Champions 2026 grand final
  between LOUD and Team Vitality (best of five) in Shanghai on 18 October
  2026?
question_type: multiple_choice
options:
  - "LOUD 3-0"
  - "LOUD 3-1"
  - "LOUD 3-2"
  - "Team Vitality 3-0"
  - "Team Vitality 3-1"
  - "Team Vitality 3-2"
resolution_criteria: >-
  Resolves to the final map score of the best-of-five grand final of VALORANT
  Champions 2026 (Mercedes-Benz Arena, Shanghai, 18 October 2026), per Riot
  Games / VCT official results.
context_summary: >-
  VALORANT Champions 2026, the year-end world championship of Riot's VCT
  circuit, ends on 18 October at the Mercedes-Benz Arena in Shanghai with a
  best-of-five grand final between LOUD (Brazil, Americas) and Team Vitality
  (EMEA). A new international champion is guaranteed. LOUD, who won
  Champions in 2022 with a different roster, field one of the youngest
  squads in the event: lukxo, DaviH, Darker, erde and tkzin, several of whom
  only just turned 18. None of them has played an international final
  before. lukxo and erde have posted playoff ratings of about 1.36 and 1.34.
  In the playoffs LOUD swept Paper Rex, beat NRG 2-1 and then beat Vitality
  2-1 in the upper-bracket final on 16 October, reversing a 2-0 loss to
  Vitality in the group stage on 30 September (that series included a 19-17
  overtime map on Summit). Vitality had a poor 2026 season, at one point
  losing to tier-3 opposition, but peaked in Shanghai. Rookie Sayonara has
  been their best player, alongside experienced international winners Derke
  and Chronicle, plus Jamppi and PROFEK. Vitality reached the final by
  beating 100 Thieves 3-1 in the lower-bracket final on 17 October, so they
  play on back-to-back days. Bookmakers priced LOUD at about 1.68 and Vitality
  at 2.09 (roughly 55/45 after removing the margin), with over 4.5 maps at
  2.57. On 12 October, before the semifinals, Polymarket's thinly traded title
  market had LOUD at 37% and Vitality at 27%.
