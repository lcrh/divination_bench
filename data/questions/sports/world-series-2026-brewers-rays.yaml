event_date: 2026-10-28
outcome_summary: >-
  The Milwaukee Brewers won the 2026 World Series 4-1, clinching their first
  championship in franchise history with a 4-1 win in Game 5 at Tropicana
  Field on 28 October. Game scores: G1 Brewers 3-2 (Misiorowski's first pitch
  was 103.5 mph, a World Series record); G2 Brewers 5-4 after the Rays scored
  four runs in the first inning; G3 Brewers 10-1, with an eight-run fifth
  inning and seven straight hits; G4 Rays 4-3 in 12 innings, when pinch hitter
  Ben Williamson hit a walk-off single after Cooper Pratt's 12th-inning home
  run had put Milwaukee ahead, ending the Brewers' eight-game postseason
  winning streak; G5 Brewers 4-1, with Misiorowski winning his second game of
  the series and Trevor Megill getting a two-inning save. Catcher William
  Contreras was named World Series MVP after hitting .381 with four RBIs,
  throwing out four base stealers and going 10-for-13 on automated ball-strike
  (ABS) challenges. Jackson Chourio tied Babe Ruth's record of 10 hits in the
  first four games of a World Series. Milwaukee went 11-2 in the postseason.
resolved_answer: >-
  The Brewers beat the Rays 4-1, winning Game 5 4-1 on 28 October for their
  first title; the Rays' only win was a 12-inning walk-off in Game 4, and
  William Contreras was named MVP.
