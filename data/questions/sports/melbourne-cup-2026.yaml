id: melbourne-cup-2026
domain: sports
title: Winner of the 2026 Melbourne Cup at Flemington
question: >-
  Which horse will win the 2026 Lexus Melbourne Cup (3200 m, Flemington, 3
  November 2026), and how will the race unfold?
question_type: open
resolution_criteria: >-
  Resolves to the horse officially placed first in the 2026 Melbourne Cup
  (Race 7, Flemington, 3 November 2026), per Racing Victoria / Racing
  Australia. Open-ended predictions are judged on the winner and also on
  placings, trainer and jockey, and race shape.
context_summary: >-
  The 166th Melbourne Cup, a Group 1 two-mile handicap worth A$10.2 million,
  is run at Flemington at 3pm on Tuesday 3 November with a full field of 24.
  It is an open year with no standout stayer, and favourites have not won the
  race in 12 years. Ciaron Maher saddles a record seven runners, including
  Point Of Law (3yo colt, 53kg, barrier 9, Ethan Brown), Royal Supremacy,
  Zahrann, Juja Kibo, Middle Earth, Mr Monaco and Shockletz. Point Of Law, bought
  from King Charles III in July, makes only his sixth career start
  after a romping win in the Group 3 Geelong Cup on his Australian debut.
  Joseph O'Brien brings five Irish runners, including topweight Sons And
  Lovers (57.5kg) and Trustyourinstinct (57kg, barrier 18, James McDonald).
  There are British raiders from George Boughey, Roger Varian (Enfjaar) and
  Harry Charlton (Wine Dark Sea). Defending local hopes include 2024 winner
  Knight's Choice and Chris Waller's Asterix and Soul Of Spain. Defiantly and
  Japan's Stinger Glass were ruled out. The late market was dominated by a
  plunge on Boughey's Hopewell Rock (54.5kg, barrier 15, Zac Lloyd), a Goodwood
  winner over 2816 m and a narrow Ebor runner-up who has never raced at 3200
  m. Owner JP McManus reportedly bet A$1 million on him. By race morning
  Hopewell Rock was favourite at about $6.50-$7, with Point Of Law easing to
  $8-$8.50 and Trustyourinstinct around $9. Rain was forecast to turn the track
  from Good 4 to soft.
