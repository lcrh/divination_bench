event_date: 2026-11-03
outcome_summary: >-
  Point Of Law (GB), the three-year-old colt formerly owned by King Charles
  III, won the 2026 Melbourne Cup on his sixth career start in 3:21.88 on a
  soft track. He was trained by Ciaron Maher, ridden by Ethan Brown (his
  first Cup) and carried 53kg. He firmed back into favouritism just before
  the jump. Stablemate Royal Supremacy went all out for the lead and stretched
  the margin to as much as 20 lengths by the 1000 m mark. Point Of Law came
  from mid-pack and ran him down about 150 m out, then raced clear. Zahrann
  was second, 3 3/4 lengths back, and Juja Kibo third, so Maher became the
  first trainer in 166 editions to train the trifecta. He also had five of
  the first six home. Joseph O'Brien's best finisher was topweight Sons And
  Lovers in fourth. Point Of Law became the third Northern Hemisphere
  three-year-old to win, after Rekindling (2017) and Cross Counter (2018). It
  was Maher's second Melbourne Cup win, after Gold Trip in 2022.
resolved_answer: "Point Of Law (trainer Ciaron Maher, jockey Ethan Brown), ahead of Zahrann and Juja Kibo - a Maher trifecta"
