event_date: 2026-11-01
outcome_summary: >-
  Max Verstappen (Red Bull) won from fifth on the grid in 2:20:28.772. It was
  his third win of 2026, his 74th career win and his sixth in Mexico City. He
  held off Lewis Hamilton (Ferrari) by 0.799s, with Kimi Antonelli third
  (+4.006s), which clinched Antonelli the 2026 world title as the youngest
  champion ever. Leclerc was fourth, Norris fifth and Russell sixth. On lap 1,
  Hamilton and Leclerc ran side by side and both went off track. Leclerc took
  the lead across the grass, Verstappen passed Hamilton for second, and
  Russell spun Hadjar (Russell received a 10s penalty). Leclerc got a 5s
  penalty, and Verstappen, starting on mediums, took the lead at the pit
  stops. A heavy Turn 1 crash for Bottas, caused by a front-left suspension
  failure, brought a red flag. Verstappen led the standing restart and
  survived minor contact with Hamilton into Turn 1. A late Safety Car followed
  a Piastri-Lindblad collision. Verstappen nailed the restart with eight laps
  left and held Hamilton within a second to the flag.
resolved_answer: >-
  Max Verstappen won from fifth on the grid, 0.799s ahead of Lewis Hamilton,
  with Kimi Antonelli third to clinch the 2026 title as the youngest F1
  champion ever.
