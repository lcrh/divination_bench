id: f1-mexico-city-gp-2026-winner
domain: sports
title: Winner of the 2026 Formula 1 Mexico City Grand Prix
question: >-
  Who will win the 2026 Formula 1 Mexico City Grand Prix on 1 November 2026,
  and how will the race and the championship picture unfold?
question_type: open
resolution_criteria: >-
  Judged against the official FIA / Formula 1 race result (Autodromo Hermanos
  Rodriguez, 1 November 2026), including post-race penalties applied on the
  day. Core outcome: Max Verstappen (Red Bull) won from fifth on the grid,
  0.799s ahead of Lewis Hamilton, with Kimi Antonelli third and clinching the
  world title as the youngest champion ever. Also check: Leclerc fourth,
  Norris fifth, Russell sixth; the lap-1 Hamilton–Leclerc battle with both off
  track and Leclerc's 5s penalty; Russell's 10s penalty for spinning Hadjar;
  Verstappen taking the lead via the pit stops; a red flag after Bottas's
  crash; and a late Safety Car after a Piastri–Lindblad collision.
context_summary: >-
  Mercedes' 20-year-old Kimi Antonelli arrives at the Mexico City Grand Prix
  (71 laps, 1 November 2026) with nine wins this season, including Austin the
  previous weekend. He leads team-mate George Russell by 123 points, with
  Lewis Hamilton one point further back, so a top-nine finish will make him
  the youngest world champion in history even if a rival wins. He missed
  Thursday's media day through illness and admitted to feeling tense, then
  qualified fifth. Hamilton took his first pole for Ferrari (1:16.514), just
  0.009s ahead of Russell, though a car breakdown in second practice cost him
  his race-simulation run. Charles Leclerc, who topped both Friday practice
  sessions and finished second in Singapore and Austin, starts third and has
  an unused set of soft tyres. Max Verstappen, a five-time winner in Mexico
  City with two wins this season (Bahrain and Singapore), qualified fourth
  but drops to fifth for a practice clash with Liam Lawson, which promotes
  Antonelli to fourth. Lando Norris starts sixth, Isack Hadjar seventh and
  Oscar Piastri twelfth. Lawson starts from the pit lane after a technical
  disqualification, and Valtteri Bottas starts last. The run to Turn 1 is more
  than 800 m, which has often let second-row starters slipstream into the
  lead. Race-day bet365 odds: Hamilton 13/8, Leclerc 3/1, Russell 9/2,
  Antonelli 9/2, Verstappen 5/1, Norris 40/1, Hadjar 100/1, Piastri 250/1.
