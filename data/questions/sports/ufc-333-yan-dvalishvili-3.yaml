id: ufc-333-yan-dvalishvili-3
domain: sports
title: UFC 333 - Petr Yan vs Merab Dvalishvili trilogy for the bantamweight title
question: >-
  What will happen in the Petr Yan vs Merab Dvalishvili trilogy bout for the
  UFC bantamweight title at UFC 333 in Abu Dhabi on 24 October 2026?
question_type: open
resolution_criteria: >-
  Judged against the official UFC 333 result. Core outcome: Petr Yan retained
  the title by unanimous decision, 48-47 on all three scorecards. Also check
  the fight's shape: Dvalishvili won the first two rounds on all cards and
  the first half of round 3; a Yan body kick in round 3 turned the fight and
  Yan took rounds 3, 4 and 5 on every card, winning the trilogy 2-1. The bout
  was called a Fight of the Year contender.
context_summary: >-
  UFC 333 at Etihad Arena on Yas Island, Abu Dhabi (24 October 2026) has two
  title fights. In the co-main event, men's bantamweight champion Petr Yan
  (20-5) defends against Merab Dvalishvili (21-5) in a rubber match. Their
  first fight, in March 2023, went to Dvalishvili with a relentlessly
  wrestling-heavy performance that still holds the UFC record for takedown
  attempts. Dvalishvili went on to win the title, which Yan had previously
  held, and defended it repeatedly, fighting four title fights in 2025. Yan
  then won the rematch by unanimous decision at UFC 323 on 6 December 2025,
  an exceptional technical display of shutting down a wrestler that included
  damaging body kicks. Yan is on a four-fight win streak, all by unanimous
  decision. Statistically, Yan lands 5.16 significant strikes per minute to
  Dvalishvili's 4.42, while Dvalishvili averages 5.97 takedowns per 15
  minutes to Yan's 1.70. Previews raised health questions on both sides:
  Dvalishvili's weight cut and badly damaged nose, and a back procedure for
  Yan, though Dvalishvili comes in after a long rest. Odds: Yan about -150 to
  -158 and Dvalishvili +120 to +125 (FanDuel/BetMGM). Most analysts expect
  the fight to go the full 25 minutes. Several picked Yan by decision, while
  BetMGM's writer picked Dvalishvili by decision. Alexander Volkanovski vs
  Movsar Evloev for the featherweight title headlines the card.
