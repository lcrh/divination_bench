event_date: 2026-10-24
outcome_summary: >-
  Petr Yan retained the title by unanimous decision, 48-47 on all three
  scorecards, in what was called a Fight of the Year contender. Dvalishvili
  clearly won the first two rounds on all three cards and the first half of
  the third. A Yan body kick in round 3 turned the fight, and from then on it
  was entirely Yan's: he took rounds 3, 4 and 5 on every card. Yan said his
  coach told him going into the fifth that it was 2-2 and whoever won the
  round would win the fight. It was the 20th trilogy in UFC history, and Yan
  won the series 2-1. In the main event, Alexander Volkanovski retained the
  featherweight title with a second-round TKO of the previously unbeaten
  Movsar Evloev.
resolved_answer: >-
  Petr Yan retained the title by unanimous decision (48-47 on all three
  cards), coming back after losing the first two rounds to take rounds 3-5,
  and won the trilogy 2-1.
