event_date: 2026-10-25
outcome_summary: >-
  Real Madrid won 2-1 at the Spotify Camp Nou (attendance 62,055), ending
  Barcelona's 100% league start and cutting the gap at the top to three
  points. Kylian Mbappe scored both Madrid goals. In the 41st minute, Gerard
  Martin's clearance struck Mbappe and went in after a cross from Yan
  Diomande. Raphinha equalised in the 61st minute with a snapshot from Pedri's
  pass that Andriy Lunin got a hand to. Lunin then made a big save from a
  Martin header, and Lamine Yamal clipped a shot just wide in the 78th
  minute. In the 87th minute, after skill from Jude Bellingham, Eduardo
  Camavinga cut the ball back and Mbappe slotted in the winner. Jose Mourinho
  celebrated with a knee slide, and Madrid players clashed with Barcelona
  fans. The referee was Juan Martinez Munuera.
resolved_answer: "Real Madrid win"
