id: el-clasico-barcelona-real-madrid-2026-10
domain: sports
title: El Clasico, 25 October 2026 - Barcelona vs Real Madrid at Camp Nou
question: >-
  What will be the result of the La Liga match between FC Barcelona and Real
  Madrid at the Spotify Camp Nou on 25 October 2026?
question_type: multiple_choice
options: ["Barcelona win", "Draw", "Real Madrid win"]
resolution_criteria: >-
  Resolves to the full-time (90 minutes plus stoppage time) result of the La
  Liga match FC Barcelona vs Real Madrid played on 25 October 2026, per the
  official La Liga match report.
context_summary: >-
  Hansi Flick's Barcelona, the back-to-back La Liga champions, host Real
  Madrid on Sunday 25 October at the Spotify Camp Nou. Barcelona have won all
  nine league games, scoring 39 goals, and a win would make them the first
  team in one of Europe's top five leagues to start a season with ten
  straight victories. They lead Madrid by six points. However, Barcelona lost
  their first match of the season on Tuesday, 4-2 at Paris Saint-Germain in
  the Champions League, where Flick rested players with the Clasico in mind.
  Barcelona are missing Dani Olmo (adductor, injured against PSG), Jules
  Kounde (ankle), Eric Garcia, Andreas Christensen and Roony Bardghji. Real
  Madrid, back under Jose Mourinho since the summer, have won four in a row,
  including a thrashing of RB Leipzig in midweek, and are starting to look
  like a coherent team. They have lost six of the last seven Clasicos, though.
  Vinicius Jr is suspended (serving the second game of a four-match ban), and
  Rodrygo and Raul Asencio are injured. Kylian Mbappe, Jude Bellingham, Arda
  Guler and Federico Valverde lead the visitors. DraftKings priced Barcelona
  at -165, the draw at +475 and Real Madrid at +300. Opta's model gave
  Barcelona 54.4%, the draw 19.5% and Real Madrid 26.1%. ESPN's writers mostly
  predicted Barcelona wins such as 3-1 or 4-2.
