id: nyc-marathon-2026-men
domain: sports
title: Men's winner of the 2026 TCS New York City Marathon
question: >-
  Who will win the men's elite race at the 2026 TCS New York City Marathon on
  1 November 2026, and how will the race be decided?
question_type: open
resolution_criteria: >-
  Judged against the official 2026 TCS New York City Marathon results (1
  November 2026). Core outcome: Andreas Almgren (Sweden) won on his marathon
  debut in 2:06:01, the third-fastest time in race history and the first
  European-born men's win since 1996. Also check: Yemaneberhan Crippa second
  (2:06:14, 13 seconds back) and Kamohelo Mofolo third (PB 2:06:26), pipping
  defending champion Benson Kipruto (2:06:27) on the line; halfway in
  1:04:01 after repeated Talbi surges; Kipruto's 4:38 23rd mile cutting the
  lead group to four; and Almgren pulling away from Crippa in Central Park.
context_summary: >-
  The 2026 TCS New York City Marathon on Sunday 1 November marks the 50th
  anniversary of the five-borough course. It is the final World Marathon
  Major of the year and a hilly, championship-style race usually run without
  pacemakers. None of the five men who broke 2:02 this year is entered, so
  there is no overwhelming favourite. Defending champion Benson Kipruto
  (Kenya, 35, PB 2:02:16) is a four-time major winner who was third in Boston
  in April in 2:02:50. However, he was only eighth in a half marathon in
  Bogota in July, and no man has defended the NYC title since 2013. The big
  storyline is Sweden's Andreas Almgren (31), a former 800 m runner (1:45
  PB). He makes his marathon debut in the form of his life after winning the
  European 10,000 m title in a championship record 27:23.44 and the World
  Half Marathon title on 20 September in a European record 58:06. History is
  against him: no European-born man has won NYC since 1996, and no debutant
  has won since 2010. Other contenders include Deresa Geleta (Ethiopia,
  2:02:38), CyBrian Kotut (2:03:22), two-time NYC champion Geoffrey Kamworor,
  2024 winner Abdi Nageeye, Americans Zouhair Talbi (2:03:45 in Boston) and
  Conner Mantz (2:04:43), Italy's Yemaneberhan Crippa (2:05:18, Paris winner
  earlier in the year) and Edward Cheserek. On Kalshi's thinly traded market,
  Almgren was favourite at 34%, Kipruto 28% and Sam Chelanga 6%.
