event_date: 2026-11-01
outcome_summary: >-
  Andreas Almgren won on his marathon debut in 2:06:01, the third-fastest
  time in New York race history. He became the first European-born men's
  winner since 1996. The large lead pack passed 10 km in 30:52 and halfway in
  1:04:01, after Zouhair Talbi made repeated surges, including on the
  Queensboro Bridge after 25 km, that were all covered. Kipruto's 4:38 mile 23
  broke the race down to four men: Almgren, Crippa, Kipruto and Talbi.
  Almgren looked untroubled and led marginally at 40 km. Talbi dropped first,
  then Kipruto. Almgren eased away from Yemaneberhan Crippa in Central Park to
  win by 13 seconds (Crippa 2:06:14). Lesotho's Kamohelo Mofolo finished fast
  for third in a PB of 2:06:26, pipping defending champion Kipruto (2:06:27)
  on the line. In the women's race, Sheila Chepkirui won in 2:24:36.
resolved_answer: >-
  Andreas Almgren (Sweden) won on his marathon debut in 2:06:01, pulling away
  from Yemaneberhan Crippa (2:06:14) in Central Park, with Kamohelo Mofolo
  third just ahead of defending champion Benson Kipruto.
