id: collins-word-of-the-year-2026
domain: culture
title: Collins Dictionary's Word of the Year 2026
question: >-
  What will Collins Dictionary name as its Word of the Year 2026, and what does
  that word mean?
question_type: open
options: null
resolution_criteria: >-
  Judged on whether the answer names the exact word Collins chose for 2026 and
  gives its meaning. An exact match with a correct definition scores highest. A
  closely related form or a word with the same meaning earns partial credit, as
  does naming a word that appeared on Collins' 2026 shortlist. Extra precision:
  the word's origin and the main themes of the shortlist.
context_summary: >-
  Every November Collins Dictionary (HarperCollins) announces a Word of the Year
  plus a shortlist of "new and notable" words. Its lexicographers pick them by
  monitoring the 24bn-word Collins Corpus, which includes social media. Recent
  winners: "vibe coding" (2025), "brat" (2024), "AI" (2023), "permacrisis"
  (2022), "NFT" (2021). The 2025 shortlist included "clanker", "aura farming",
  "glaze", "broligarchy", "biohacking", "HENRY", "coolcation", "taskmasking" and
  "micro-retirement". The 2026 choice was expected in early November 2026.
context_sources:
  - url: https://www.theguardian.com/technology/2025/nov/06/vibe-coding-collins-dictionary-word-of-the-year-2025
    title: "'Vibe coding' beats 'clanker' to be Collins dictionary's word of the year"
    publisher: The Guardian (PA Media)
    published_date: 2025-11-06
    excerpt: "Lexicographers at Collins monitor the 24bn-word Collins Corpus, which draws from a range of media sources, including social media, to create the annual list of new and notable words... Other words on the list include 'biohacking'... 'clanker'... 'glaze'... 'aura farming'... 'broligarchy'."
event_date: 2026-11-03
outcome_summary: >-
  On 3 November 2026 Collins named "mogging" its Word of the Year 2026. Collins
  defines it as outperforming or outshining someone or something, making them
  look inferior in appearance, confidence or status. It is believed to be a
  shortening of "AMOG" ("alpha male of the group"). The word began around 2016
  as a noun in bodybuilding culture, became a verb, spread through the
  manosphere, and by 2026 was widespread, mostly ironic Gen Z / Gen Alpha
  slang. The shortlist (framed
  as "one big mogging contest") was: carspreading, Manchesterism, firewave,
  hydration break, ghost job, friendslop, fricy, bixie and P(doom).
resolved_answer: >-
  "Mogging", meaning to outperform or outshine someone or something so that
  they look inferior (in appearance, confidence or status). It is slang
  probably derived from "AMOG" (alpha male of the group).
outcome_sources:
  - url: https://blog.collinsdictionary.com/language-lovers/collins-word-of-the-year-2026-a-year-of-being-outdone/
    title: "Collins' Word of the Year 2026: a year of being outdone"
    publisher: Collins Dictionary Language Blog
    published_date: 2026-11-03
    excerpt: "Mogging, Collins' Word of the Year 2026, is defined as outperforming or outshining someone or something else, which might involve making them look inferior in terms of appearance, confidence or status... Believed to be a shortening of AMOG ('alpha male of the group'), it started life around 2016 as a noun in bodybuilding culture."
  - url: https://www.theguardian.com/uk-news/2026/nov/03/mogging-crowned-collins-word-of-the-year
    title: "'Mogging' crowned Collins English dictionary word of the year"
    publisher: The Guardian
    published_date: 2026-11-03
    excerpt: "Mogging – meaning to outperform or outshine someone or something – has been named Collins's word of the year 2026... In transport, the shortlist features 'carspreading'... Political terminology was dominated by 'Manchesterism'."
notes: >-
  The word "mogging" itself predates 2026. What is new is its selection, which
  was first made public on 3 Nov 2026. Dictionary.com had named "maxxing" (a
  related manosphere-derived slang form) its 2026 Word of the Year on 25 Oct
  2026, before this event. It is left out of the context summary because it is
  a strong hint, but forecasters could legitimately have known it. "Maxxing" or
  "looksmaxxing" answers should get little credit. Other dictionaries (Oxford,
  Cambridge, Merriam-Webster) had not announced their 2026 words as of 7 Nov
  2026.
