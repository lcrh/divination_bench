notes: >-
  No real-money prediction market or bookmaker odds found; the only "market"
  was a free jouepredict.fr poll that closed on 5 October with too few
  participants to show a share, so market is omitted. Soft spots: Jaenada
  was the most-cited favourite (franceinfo afterwards: "Il était le
  favori"), so a well-informed forecaster had an edge, though pre-event
  previews split between Jaenada, Prudhomme and Haenel. The Le Figaro page
  returned 403 to direct fetch; its excerpt comes from the retrieved search
  result text. The Lire Magazine piece is truncated in the retrieved
  version, so only its standfirst is quoted. Earlier reports (franceinfo, Le
  Parisien, Sept 2026) gave the proclamation date as 4 November; all later
  sources and the Académie confirm 3 November. The Académie page misspells
  the title as "L'inconnu du quai de Javel"; the 20 Minutes source wrongly
  dates the Orélien withdrawal to 2025. The Orélien withdrawal (25 Sep) is
  just after the models' 22 Sep cutoff, so it is new information to them.
