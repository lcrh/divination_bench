event_date: 2026-11-03
outcome_summary: >-
  On Tuesday 3 November 2026 at Drouant, the Académie Goncourt awarded the
  124th Prix Goncourt to Philippe Jaenada (62) for "L'inconnue du quai de
  Javel" (Flammarion) in the first round of voting, by six votes to three
  for Sylvain Prudhomme ("De l'autre côté du lac", Minuit). Yannick Haenel
  and Clémentine Mélois received no votes. Jury president Philippe Claudel
  said the book "rend visible une femme qui a été invisibilisée". Jaenada
  succeeds Laurent Mauvignier (2025, "La Maison vide"). The Prix Renaudot,
  announced at the same time, went to François-Henri Désérable for "Le
  Palais" (Gallimard).
resolved_answer: >-
  Philippe Jaenada won for "L'inconnue du quai de Javel" in the first round,
  6 votes to 3 for Sylvain Prudhomme.
