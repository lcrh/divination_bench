id: prix-goncourt-2026
domain: culture
title: Prix Goncourt 2026 proclamation
question: >-
  What will happen when the Académie Goncourt proclaims the 2026 Prix
  Goncourt at the Drouant restaurant in Paris on 3 November 2026: who will
  win, with which book, and how will the jury's vote go?
question_type: open
options: null
resolution_criteria: >-
  Judged against the Académie Goncourt's official proclamation on 3 November
  2026: the winning author and book, the round of voting and the vote split
  among the finalists. The Goncourt des lycéens, Goncourt des détenus and
  other Goncourt-branded prizes do not count.
context_summary: >-
  The Prix Goncourt, France's most prestigious literary prize (a symbolic
  10-euro cheque, but typically hundreds of thousands of extra sales), is
  proclaimed on 3 November 2026 at the Drouant restaurant in Paris. The jury
  has nine members since the death of Didier Decoin, chaired by Philippe
  Claudel, and also includes Christine Angot, Pierre Assouline, Tahar Ben
  Jelloun, Pascal Bruckner, Paule Constant, Françoise Chandernagor, Camille
  Laurens and Eric-Emmanuel Schmitt; with an odd number of jurors, the
  president's casting vote should not be needed. The 2026 season was shaken
  in late September when the Académie, in an unusual step, removed Thélyson
  Orélien's bestseller "C'était ça ou mourir" (Grasset) from its first list
  after plagiarism allegations and analyses suggesting the novel was largely
  AI-generated. On 27 October the Académie named four finalists, all
  published by houses in the Madrigall (Gallimard) group: Yannick Haenel,
  "La solitude des professeurs est infinie" (Gallimard), set amid the
  conditions of teaching in a collège; Philippe Jaenada, "L'inconnue du quai
  de Javel" (Flammarion), an archive-driven investigation of the unsolved
  1949 murder of a young woman in Paris; Clémentine Mélois, "Choses que je
  croyais perdues" (L'Arbalète/Gallimard); and Sylvain Prudhomme, "De
  l'autre côté du lac" (Minuit), a contemplative Alpine thriller about wild
  nature. Haenel, Jaenada and Prudhomme have all previously won major autumn
  prizes (Médicis/Interallié for Haenel, Femina for both Jaenada and
  Prudhomme). Anne Godard, seen as a favourite at the second stage, was
  eliminated. Previews saw no single clear favourite: Fnac's L'Éclaireur
  named Jaenada (the most-cited author) and the critically acclaimed
  Prudhomme as the two favourites, while Lire Magazine's two editors split,
  one backing Jaenada and the other Haenel.
