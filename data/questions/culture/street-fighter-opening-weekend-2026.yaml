id: street-fighter-opening-weekend-2026
domain: culture
title: How much will "Street Fighter" (2026) gross in its US opening weekend (16-18 October 2026)?
question: >-
  How much will Paramount/Legendary's "Street Fighter" gross at the domestic
  (US and Canada) box office over its opening three-day weekend of 16-18
  October 2026, including Thursday previews?
question_type: multiple_choice
options: ["Under $25M", "$25M-$30M", "$30M-$35M", "$35M-$40M", "$40M or more"]
resolution_criteria: >-
  Resolves to the bracket containing the final (actual, not estimated)
  Friday-Sunday 16-18 October 2026 domestic gross on The Numbers, with
  Thursday previews folded into Friday. Values exactly on a boundary go to
  the higher bracket. Brackets follow Polymarket's "Street Fighter Opening
  Weekend Box Office" market, with its top two brackets merged.
context_summary: >-
  "Street Fighter", the third film based on Capcom's fighting-game series,
  opens on Friday 16 October in about 3,500 North American theatres,
  including IMAX. Kitao Sakurai directed, Noah Centineo and Andrew Koji star,
  and the film is set in 1993 as two estranged fighters are recruited into a
  tournament. The PG-13 film cost $82 million, co-financed by Legendary and
  Capcom, with Paramount distributing. It moved to Paramount from Sony after
  Legendary's deal there expired. The franchise's record is mixed: the 1994
  Van Damme film grossed about $100M, while 2009's "The Legend of Chun-Li"
  made just $12.8M. Comparable 2026 releases include "Mortal Kombat II",
  which opened to $38.5M, and "Masters of the Universe" ($29.4M). Variety's
  14 October preview put the opening at $25-35M, comfortably ahead of
  Disney's "Whalefall" ($10-12M), Focus's "Sense and Sensibility" ($5-8M)
  and A24's buzzy Elizabeth Holmes documentary "You Can See Everything"
  ($7-8M from about 800 locations). Overseas, the film is projected at about
  $35M from 65 markets. October 2026 has been uneven at the box office:
  "Digger" and "The Social Reckoning" flopped, while "Verity" and "Other
  Mommy" were modest wins. On Polymarket the day before previews, traders
  split mainly between $25-30M (about 46%) and $30-35M (about 41%).
