    publisher: Variety
    published_date: 2026-10-14
    excerpt: "Paramount's video game adaptation 'Street Fighter' will lead over fellow newcomers, with opening weekend estimates of $25 million to $35 million from 3,500 North American theaters. ... Legendary and video game developer Capcom co-financed the film for $82 million."
event_date: 2026-10-18
outcome_summary: >-
  "Street Fighter" opened at No. 1 with $30,775,377 from 3,575 theatres, per
  The Numbers, so the $30M-$35M bracket. Sunday studio estimates had been
  $31M. The total included $4M in Thursday previews, then about $13M Friday
  (with previews), $10.8M Saturday and $7.2M Sunday. IMAX contributed $5.4M
  (18% of the domestic opening). With $20.1M from 65 overseas markets, its
  global start was $51.1M. Boxoffice Pro said the result was right in line
  with its forecasting panel: on par with "Masters of the Universe" ($29.4M)
  but under "Mortal Kombat II" ($38.5M). Reception was lukewarm, with 41% on
  Rotten Tomatoes, a 79% audience score and a B- CinemaScore. The big story
  of the weekend was "You Can See Everything", which took about $15M from
  just 855 screens, the second-highest non-fiction opening after
  "Fahrenheit 9/11". "Whalefall" disappointed with $8M.
resolved_answer: "$30M-$35M"
