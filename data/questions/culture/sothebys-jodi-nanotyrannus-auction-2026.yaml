id: sothebys-jodi-nanotyrannus-auction-2026
domain: culture
title: Sotheby's auction of "Jodi" the Nanotyrannus skeleton
question: >-
  On 27 October 2026 Sotheby's New York will sell "Jodi", a mounted
  Nanotyrannus skeleton, in a dedicated single-lot live auction with a
  pre-sale estimate of US$6-9 million. What will happen at the auction?
question_type: open
options: null
resolution_criteria: >-
  Judged on the result of the 27 October 2026 sale: whether Jodi sold, the
  final price including buyer's premium, how it compared with the estimate,
  how it compares with other dinosaur prices at auction, and details of the
  bidding (number of bidders, length, buyer). A prediction scores well if it
  gets the price band roughly right (below, within, modestly above, or many
  times above the estimate).
context_summary: >-
  Jodi is a 67-million-year-old mounted skeleton of Nanotyrannus, a small
  tyrannosaur. It is about 6.5 feet tall at the hip and 19.6 feet long, with
  around 190 bone elements and a virtually complete 53-bone skull holding
  about 35 teeth. Rancher Jodi Pierson found it in 2019 in Montana's Hell
  Creek Formation. It was excavated by commercial paleontologist Clayton
  Phipps, who also found the "Dueling Dinosaurs". For decades scientists
  argued over whether such skeletons were simply juvenile T. rex. A 2025
  Nature paper by Lindsay Zanno and James Napoli established Nanotyrannus as
  a distinct genus. Only three skeletons are known, and Jodi is the first to
  come to market since. The same skeleton was shown at Frieze Masters in
  London in 2023 as "Chomper", a supposed juvenile T. rex, with a US$20
  million asking price. Re-offered as a Nanotyrannus, it carries a much
  lower US$6-9 million estimate. Commentators said this reflected the
  T. rex's unmatched cultural cachet. The dinosaur market has been hot. In
  July 2026 Sotheby's sold "Gus" the T. rex for a record US$50.1 million,
  against a US$30 million high estimate. "Apex" the Stegosaurus made US$44.6
  million in 2024, and a juvenile Ceratosaurus made US$30.5 million in 2025,
  several times its estimate. Sotheby's gave Jodi a dedicated sale on 27
  October, with a public exhibition at the Breuer building from 13 October.
  Its science head, Cassandra Hatton, noted that some collectors want
  "something that looks vicious" but of a more manageable size.
