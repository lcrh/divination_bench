event_date: 2026-10-27
outcome_summary: >-
  Jodi sold on 27 October 2026 for US$47,255,000 (about $47.3 million) with
  fees. That is more than five times the US$9 million high estimate and
  nearly eight times the low estimate. Six bidders competed for about 12
  minutes before it went to an anonymous telephone bidder. It became the
  second most expensive dinosaur ever sold at auction, behind only "Gus" the
  T. rex (US$50.1 million, Sotheby's, July 2026), and ahead of Apex the
  Stegosaurus (US$44.6 million). The buyer had not been identified by 28
  October. The sale renewed debate over important fossils going into private
  hands.
resolved_answer: >-
  Jodi sold for about US$47.3 million ($47,255,000), more than five times its
  $6-9 million estimate, to an anonymous phone bidder after a 12-minute
  contest among six bidders. That made it the second most expensive dinosaur
  ever sold at auction, after Gus the T. rex.
