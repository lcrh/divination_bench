id: mcr-black-parade-20th-anniversary-charts-2026
domain: culture
title: My Chemical Romance's The Black Parade 20th-anniversary reissue on the UK and US album charts
question: >-
  My Chemical Romance reissued The Black Parade (20th Anniversary), an
  expanded deluxe edition of their 2006 album, on 23 October 2026. What will
  happen when its first week of sales is counted on the UK Official Albums
  Chart (announced 30 October 2026) and the US Billboard 200 (announced
  1 November 2026)?
question_type: open
options: null
resolution_criteria: >-
  Judged against the Official Charts Company and Billboard/Luminate results
  for the reissue's first tracking week. Core outcome: The Black Parade went
  to No. 1 in both countries, the band's first-ever No. 1 album in the UK and
  in the US. Precision details: in the US it jumped from No. 139 to No. 1 on
  the Billboard 200 dated 7 Nov 2026 with 78,000 equivalent album units
  (68,000 pure sales, 42,000 of them vinyl; 10,000 streaming units), ahead of
  Olivia Rodrigo at No. 2 (64,000). The 20-year wait is the longest ever for
  an album to reach No. 1, and the 139-1 jump is the largest leap to No. 1
  since 2021. In the UK it climbed 162-1 with 20,172 chart units, ahead of
  Fontaines D.C.'s Dopamine Chamber at No. 2. Predictions of a big top-10
  re-entry that stops short of No. 1 earn partial credit. Correct calls on
  one country only also earn partial credit.
context_summary: >-
  The Black Parade, My Chemical Romance's 2006 rock-opera concept album
  ("Welcome to the Black Parade", "Teenagers", "Famous Last Words"), is the
  band's most celebrated record. On first release it debuted and peaked at
  No. 2 in both the UK and the US. The band has never had a No. 1 album in
  either country. On 10 September 2026 the band announced The Black Parade
  (20th Anniversary) for release on 23 October via Reprise. It contains the
  original album plus six bonus tracks: three B-sides, including the
  previously unreleased "Someone Out There Loves You", and live recordings
  from a 2007 show at Maxwell's in Hoboken. It came in many physical variants:
  several 2LP colourways (some signed, some store-exclusive), a hologram 1LP,
  a 7,000-copy One Step vinyl pressing, CDs and cassettes. The release
  coincided with the band's long-running theatrical Black Parade stadium
  tour, which had been running since 2025 and was ending its US leg with five nights at the Hollywood Bowl (23 Oct to Halloween),
  followed by Asian dates in November. An earlier reissue showed the
  catalogue's pull: in July 2026 a 15th-anniversary deluxe edition of Danger
  Days (2010) reached No. 2 on the UK chart, a new peak for that album, held
  off only by the Rolling Stones. On the Billboard 200 dated 31 October, the
  week before the reissue counted, Olivia Rodrigo's you seem pretty sad for a
  girl so in love was No. 1 with 75,000 units, boosted by a Chappell Roan
  remix. Zach Bryan's new album was No. 2 with 65,500 units, almost all from
  streaming. Recent anniversary reissues had generally re-entered the top 10
  rather than reaching No. 1.
