notes: >-
  event_date is the UK announcement (30 Oct 2026), the first time any part of
  the outcome was public. The US result followed on 1 Nov. All context
  sources are dated on or before 25 Oct, before UK midweek chart updates
  could hint at the result. The 2006 US No. 2 peak, held off by the Hannah
  Montana soundtrack, is stated in Billboard's post-event coverage and is
  long-standing chart history rather than new information.
