notes: >-
  No market found. The 4 million figure is S-Game's own announcement (via its
  X account) and covers digital sales on all platforms; there is no official
  per-platform split. Sources disagree on the all-time Steam ranking (This
  Week in Video Games put the 723,876 day-one peak at 15th all-time; TweakTown
  put the 833,921 weekend peak in the top 10), so the judge should not lean on
  the exact all-time rank. The 88 Metacritic critic score was public before
  launch, so it is not really part of the outcome.
