id: phantom-blade-zero-launch-2026
domain: culture
title: How the launch of Chinese action game Phantom Blade Zero will go
question: >-
  Phantom Blade Zero, the first big-budget console and PC game from Beijing
  studio S-Game, launches digitally on PS5 and PC on 29 October 2026. How
  will its launch go over the first few days, in terms of sales, Steam
  player numbers and reception?
question_type: open
options: null
resolution_criteria: >-
  Judged on the game's commercial performance from 29 October to 1 November
  2026: total copies sold in the first 72 hours as announced by S-Game, the
  peak concurrent player count on Steam (per SteamDB), how that peak ranks
  against other 2026 releases and all-time Steam launches, and player and
  critic reception. A prediction scores well if it gets the scale right
  (a modest success of 1-2 million copies, a big hit of several million, or a
  Black Myth: Wukong-level phenomenon of ~10 million) and the order of
  magnitude of the Steam peak.
context_summary: >-
  Phantom Blade Zero is a "kungfupunk" wuxia action RPG from S-Game, a
  Beijing studio previously known for smaller, mobile-focused action games.
  It has been in full development since 2022. Sony has backed it heavily,
  reportedly through PlayStation's China Hero Project, with State of Play
  showcases and first-party-style marketing. It launches digitally on 29
  October 2026 on PS5 (a timed console exclusive) and PC, including Steam and
  Tencent's Chinese WeGame store. It was delayed by 50 days from 9 September
  to polish it. It has a publishing licence in mainland China and a
  simultaneous worldwide release, with regional pricing equivalent to about
  US$40 in China versus US$60 in the US. Hong Kong action star Donnie Yen
  worked on the motion capture. In August the analytics firm Alinea reported
  1.6 million Steam wishlists, the most of any 2026 game. Its Steam pre-sales
  were tracking at about 73% of Black Myth: Wukong's at the same point before
  launch. Wukong, also Chinese, sold 10 million copies in its first three
  days in 2024. Analysts warned that hype in China was "nowhere near" that
  for Wukong, and that demanding PC specs could hurt it. When the review
  embargo lifted it scored 88 on Metacritic. On 27 October Alinea estimated
  850,000 pre-launch copies sold on Steam and PS5 (about $43 million), mostly
  from China, Taiwan and Hong Kong. With WeGame, analyst Rhys Elliott said
  the total was "well past" 1 million, but said it "won't hit the highs" of
  Black Myth's sales. GTA 6 is due a few weeks later.
