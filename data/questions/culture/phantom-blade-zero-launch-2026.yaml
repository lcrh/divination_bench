event_date: 2026-11-01
outcome_summary: >-
  The launch was a major hit, though well short of Black Myth: Wukong. Steam
  concurrent players peaked at 723,876 within 24 hours of the 29 October
  launch (SteamDB), already the highest for any 2026 release. Over the
  weekend the peak rose to 833,921 on Sunday 1 November. That made it
  Steam's biggest launch of 2026 by a wide margin, ahead of Wardogs (428,666),
  Resident Evil Requiem (344,214) and Forza Horizon 6 (302,645). It ranked
  third among all Steam games at the time, behind only Counter-Strike 2 and
  Dota 2. On 1-2 November S-Game announced more than 4 million copies sold in
  the first 72 hours across PS5, Steam, Epic and WeGame, all digital. That was
  about 40% of Wukong's 10 million in three days. Reception was strong: 88 on
  Metacritic from critics (called the highest-rated Chinese game ever), 87-89%
  positive Steam user reviews, and Metacritic user scores of 88 (PC) and 93
  (PS5).
resolved_answer: >-
  A big hit: more than 4 million copies sold in 72 hours and a Steam peak of
  833,921 concurrent players on 1 November, the biggest Steam launch of 2026.
  That was about 40% of Black Myth: Wukong's 10 million first-weekend sales,
  with strong reviews (88 Metacritic).
