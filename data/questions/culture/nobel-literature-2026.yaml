id: nobel-literature-2026
domain: culture
title: Who will win the 2026 Nobel Prize in Literature?
question: >-
  Who will the Swedish Academy award the 2026 Nobel Prize in Literature to
  when it announces the laureate on 8 October 2026?
question_type: multiple_choice
options:
  - "Can Xue"
  - "Anne Carson"
  - "Gerald Murnane"
  - "Haruki Murakami"
  - "Thomas Pynchon"
  - "Someone else"
resolution_criteria: >-
  Resolves to the laureate named in the Swedish Academy's official
  announcement of 8 October 2026. If the laureate is not one of the five
  named writers, resolves to "Someone else".
context_summary: >-
  The Swedish Academy will announce the 2026 literature laureate at 1pm CEST
  on Thursday 8 October. The 2025 prize went to Hungary's László
  Krasznahorkai; recent winners include Han Kang, Jon Fosse, Annie Ernaux and
  Abdulrazak Gurnah. Nominations stay secret for 50 years, and the Academy
  has often wrong-footed the betting market. Bookmakers have two clear
  front-runners. Chinese experimental writer Can Xue (Deng Xiaohua, 73), a
  perennial favourite twice longlisted for the International Booker, leads at
  Betsson (decimal 5.00 on 6 October) and is joint favourite at Ladbrokes at
  10/1. Canadian poet, classicist and translator Anne Carson (76), known for
  hybrid works such as Autobiography of Red that rework Greek myth, is joint
  favourite at Ladbrokes (10/1) and second at Betsson (7.00). Next in the market
  are Australian Gerald Murnane (Betsson 8.00, Ladbrokes 16/1), Haruki
  Murakami (Ladbrokes 14/1), Thomas Pynchon (16/1), and at around 20/1
  Margaret Atwood, Cristina Rivera Garza, Enrique Vila-Matas, Jamaica
  Kincaid, Lídia Jorge, Lyudmila Ulitskaya and Michel Houellebecq. Amitav
  Ghosh and César Aira are well placed at Betsson. Betsson notes that recent
  winners have often come from its leading candidates (Krasznahorkai was
  second favourite in 2025), but long shots have won many times before.
