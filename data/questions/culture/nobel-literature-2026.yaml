event_date: 2026-10-08
outcome_summary: >-
  Anne Carson. On 8 October 2026 the Swedish Academy awarded the prize to the
  Canadian poet, essayist and translator Anne Carson, 76, "for her bold and
  inventive oeuvre that, in playful dialogue with the classical tradition,
  has created new forms for contemporary literature". Carson, born in Toronto
  and a classics scholar, is known for genre-blending works that fuse poetry,
  essay and translation of ancient Greek texts, notably Autobiography of Red
  (1998). She was a joint bookmaker favourite at Ladbrokes (10/1) and second
  favourite at Betsson. Can Xue, the other favourite, missed out again. The prize
  is worth SEK 12 million.
resolved_answer: "Anne Carson"
