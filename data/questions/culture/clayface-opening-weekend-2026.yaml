id: clayface-opening-weekend-2026
domain: culture
title: How much will DC's "Clayface" gross in its US opening weekend (23-25 October 2026)?
question: >-
  How much will Warner Bros./DC Studios' "Clayface" gross at the domestic
  (US and Canada) box office over its opening three-day weekend of 23-25
  October 2026, including Thursday previews?
question_type: multiple_choice
options: ["Under $22M", "$22M-$25M", "$25M-$28M", "$28M-$31M", "$31M or more"]
resolution_criteria: >-
  Resolves to the bracket containing the final (actual, not estimated)
  Friday-Sunday 23-25 October 2026 domestic gross on The Numbers, with
  Thursday previews folded into Friday as usual. Values exactly on a boundary
  go to the higher bracket. Brackets follow Polymarket's "Clayface Opening
  Weekend Box Office" market, with its top three brackets merged.
context_summary: >-
  "Clayface", an R-rated body-horror spin-off about the Batman villain, opens
  wide on Friday 23 October (with Thursday previews) in about 3,400 North
  American theatres. James Watkins directed from a screenplay by horror
  veteran Mike Flanagan, and Tom Rhys Harries stars. It cost about $40-44
  million, a fraction of DC's "Superman" (2025) and "Supergirl" (July 2026),
  which bombed with $126M worldwide against a $170M budget. It will be the
  first Warner Bros. film released under Skydance ownership. The studio
  needs a win after misfires such as "Practical Magic 2", "The End of Oak
  Street" and "Digger". Early reviews are positive (74% on Rotten Tomatoes
  from 56 reviews). With "Other Mommy" poorly received, Clayface is the main
  new horror option before Halloween. A week ago it was expected to top the
  box office easily, with Variety citing projections of $25-35M (rivals
  suggest $22-28M). TheWrap's 21 October projection is $25-30M. The
  surprise rival is A24's Elizabeth Holmes documentary "You Can See
  Everything". It opened to $15.6-15.8M from just 855 theatres, the biggest
  nonmusical documentary opening in 20 years, is expanding to about 2,600
  venues, and is tipped for $18-25M in its second weekend, possibly enough
  for No. 1. New wide releases "Wildwood" and "Wicker" are tracking at $6-8M
  each. Clayface targets $20-25M overseas from 76 markets. Before previews,
  Polymarket's most-traded brackets were $25-28M (about 33%), under $22M
  (about 29%) and $22-25M (about 22%).
context_sources:
  - url: https://variety.com/2026/film/box-office/you-can-see-everything-could-beat-clayface-box-office-1236917465/
    title: Will 'You Can See Everything' Beat DC's 'Clayface' at the Box Office?
    publisher: Variety
    published_date: 2026-10-21
    excerpt: "Just a week ago, 'Clayface' was expected to easily top the box office, with opening weekend projections of $25 million to $35 million from 3,400 North American theaters. (Rivals suggest a slightly softer debut around $22 million to $28 million)."
  - url: https://www.thewrap.com/creative-content/movies/clayface-box-office-opening-weekend-predictions/
    title: Clayface Aiming for $25 Million Box Office, but You Can See Everything Lingers
    publisher: TheWrap
    published_date: 2026-10-21
    excerpt: "Currently, 'Clayface' is projected for a $25-30 million opening weekend, which would be a solid start for this $40 million-budgeted body horror film. But 'You Can See Everything' is expected to blow past its $15.8 million opening with a second weekend of at least $18 million."
event_date: 2026-10-25
outcome_summary: >-
  "Clayface" opened at No. 1 with $24,002,731 from 3,458 theatres (about
  $6,941 per theatre), per The Numbers and Box Office Mojo, so the
  $22M-$25M bracket. That included $3.5M in Thursday previews; Friday
  (with previews) was about $10.6M, Saturday $7.8M and Sunday $5.6M.
  Overseas added about $19M for a $43M global start. Deadline's Thursday
  forecast was $20-25M, and Boxoffice Pro called the result slightly below
  its expectations, a modest start for a DC title but solid for mid-budget
  horror. Audience reception was strong: an A- CinemaScore, a 94% audience
  score and 75% with critics. A24's "You Can See
  Everything" was close behind in second with $19.5M, up about 25% in its
  second weekend after expanding to 2,655 theatres.
resolved_answer: "$22M-$25M"
