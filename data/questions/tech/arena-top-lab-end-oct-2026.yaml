event_date: 2026-10-31
outcome_summary: >-
  Google. On 28 October Google announced Gemini 4 Carbon, a stronger
  successor to Argon aimed at cybersecurity and long-horizon coding,
  initially available only to selected cyber defenders through its Fairwind
  Program. Carbon (High) appeared at #1 on the Arena text leaderboard
  published 28 October with about 1540 points from roughly 4,400 votes
  (style control off). Gemini 4 Argon (High) was second at about 1529 and
  Claude Opus 5.5 (High) third at about 1516, followed by Claude Fable 5.1
  (Max) and Claude Opus 5 (Max). Carbon held first place in every snapshot
  from 29 October through early November, so Google owned the top two models
  at the 31 October check. Carbon also debuted first on the Artificial
  Analysis Intelligence Index v5.0 (59, versus Opus 5.5 at 58 and GPT-6 Astra
  at 57). The Polymarket market resolved to Google.
resolved_answer: Google
