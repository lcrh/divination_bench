id: arena-top-lab-end-oct-2026
domain: tech
title: Which company will own the #1 model on Arena's Text leaderboard on 31 October 2026?
question: >-
  Which company will own the top-ranked model on the Arena (formerly LMArena)
  Text Arena overall leaderboard, with style control off, when it is checked
  at 12:00 PM ET on 31 October 2026?
question_type: multiple_choice
options: ["Google", "Anthropic", "OpenAI", "Meta", "Another company"]
resolution_criteria: >-
  Resolves to the company owning the model ranked #1 on arena.ai's Text Arena
  | Overall leaderboard (style control off, filtered for models) at 12:00 PM ET
  on 31 October 2026, as in the Polymarket market "Which company has the best
  AI model end of October?". Models marked AutoEval are excluded; ties are
  broken by Polymarket's rules.
context_summary: >-
  The frontier race on Arena's crowd-voted text leaderboard has been tight all
  autumn. Anthropic's Claude models held the top spots through the summer
  (Claude Opus 5 and Fable variants around 1505). After months on the
  sidelines of the frontier race, Google unveiled Gemini 4 Argon, the first
  model of its Gemini 4 generation, on 30 September with access limited to
  vetted partners, and made it broadly available on 13 October. Argon (High) went straight to #1 on the text
  board, but with only about 5,000 votes and a "Preliminary" label. In the
  early-to-mid October data it scored about 1524-1533, against roughly 1507-1516 for
  Claude Opus 5.5 (High), with Meta's Muse Wonder (Max) and other Claude
  models (Fable 5, Fable 5.1, Opus 4.6) close behind. The confidence
  intervals overlapped and Arena's rank spread for Argon was 1 to 3. On other
  boards, Anthropic's Claude Opus 5.5 and Fable 5.1 led Artificial Analysis,
  LiveBench and Arena WebDev, while OpenAI's GPT-6 Astra (released in early
  September) led Humanity's Last Exam but sat well down the text arena. Labs
  ship often, and first place on the board has typically changed hands every
  one to three months, usually after a flagship launch. Reports suggested
  Google was testing newer Gemini 4 checkpoints, and further releases from
  Anthropic, OpenAI or Meta were possible before the 31 October check. On 20
  October Polymarket priced Google at about 73% and Anthropic at about 25%.
