notes: >-
  event_date is the day the listing first became public (23 Sep 2026). Its
  identity was only confirmed on 19 Oct 2026. The OpenRouter listing page now
  shows the post-reveal text, and its "Released Sep 23, 2026" field is used as
  the published date. The context summary describes OpenRouter's stealth-model
  practice, which hints that the listing is an anonymous model. The real unknown
  is the maker and the final product name. The token counts differ by source:
  56.7T is OpenRouter-only, while MiniMax's 200T+ figure presumably covers all
  channels.
