event_date: 2026-10-31
outcome_summary: >-
  Xiaomi. MiMo-V2.6-Pro stayed the top Chinese model on Arena's text board
  (style control off) through the 31 October check. In the 22 October data it
  was 11th overall with 1491 (about 4,067 votes), 7.5 points ahead of
  Alibaba's Qwen3.8-Max (15th, 1484). Moonshot's best rated entry, Kimi K3
  (Max), was 25th at 1475. Kimi K3.1 Pro had still not appeared in Arena's
  published text data as of 28 October, and it did not displace Xiaomi. The
  late-October snapshot (style control off, published 28 October) had
  MiMo-V2.6-Pro at #12 with 1491.4, ahead of Qwen3.8-Max at #16 (1483.3), and
  it was also the best open-weight model on the board. With no K3.1 Pro score
  published, Polymarket's Xiaomi price rose from about 45% on 24 October to
  about 90% by 28-30 October, and the market resolved to Xiaomi.
resolved_answer: Xiaomi
