id: arena-top-chinese-lab-end-oct-2026
domain: tech
title: Which Chinese company will have the top-ranked Chinese model on Arena's Text leaderboard on 31 October 2026?
question: >-
  Among Chinese AI companies, whose model will rank highest on the Arena
  (formerly LMArena) Text Arena overall leaderboard, with style control off,
  when it is checked at 12:00 PM ET on 31 October 2026?
question_type: multiple_choice
options: ["Xiaomi", "Moonshot AI", "Alibaba", "Z.ai", "DeepSeek", "Another Chinese company"]
resolution_criteria: >-
  Resolves to the primarily Chinese company owning the highest-ranked model
  on arena.ai's Text Arena | Overall leaderboard (style control off, filtered
  for models) at 12:00 PM ET on 31 October 2026, as in the Polymarket market
  "Best Chinese AI Company end of October?". AutoEval models are excluded;
  ties follow Polymarket's rules (rank, then score).
context_summary: >-
  For most of 2026 Alibaba's Qwen models held the top Chinese spot on Arena's
  text leaderboard (style control off). The end-of-July and end-of-August
  Polymarket markets both resolved to Alibaba, with Qwen3.8-Max announced on
  3 August. On 22 September Xiaomi, better known for phones and EVs, released
  and open-sourced (MIT licence) MiMo-V2.6-Pro, a 1.02-trillion-parameter
  sparse MoE omnimodal model. It scored 46 on the Artificial Analysis
  Intelligence Index, the best open-weights result at the time, and it
  entered the late-September Arena board at about #9 (1491). That put it
  ahead of Qwen3.8-Max (about #15-17, 1480-1484), but on only about 4,000
  votes against Qwen's 20,000-30,000, so its score was less settled. Moonshot
  AI's Kimi K3 (Max) and Z.ai's GLM-5.3 (Max) sat in the mid-1470s, and
  DeepSeek's best model was lower still. Alibaba had talked up a Qwen 4
  flagship but had not dated it. On 23 October Moonshot launched Kimi K3.1
  Pro on its API (weights promised by 4 November). Artificial Analysis scored
  it 55, fourth overall and well above MiMo-V2.6-Pro, behind only Claude Opus
  5.5, Claude Sonnet 5.5 and Meta's Muse Wonder Full. K3.1 Pro had no Arena
  text score yet, and it was unclear whether it would be added and rated
  before the 31 October check. Polymarket moved sharply after the launch: on
  24 October Xiaomi was about 45% and Moonshot about 41%, with Alibaba near
  11%.
