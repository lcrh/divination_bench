id: tesla-roadster-sub-1s-0-60-demo-2026
domain: tech
title: Will Tesla demonstrate a sub-1-second 0-60 mph run at its October 2026 Roadster event?
question: >-
  At Tesla's next-generation Roadster unveiling on the evening of 15 October
  2026 (US Central time), will a Roadster physically present at the event
  perform a live, timed 0-60 mph run from a standing start in under 1.0
  seconds?
question_type: binary
options: ["Yes", "No"]
resolution_criteria: >-
  Resolves Yes if, during the 15 October 2026 event, any version of the
  Roadster (prototype included) performs a live, timed 0-60 mph acceleration
  run under its own power from a standing start, and the demonstrated time
  (shown on screen / instrumentation, or officially published by Tesla for
  that specific run) is below 1.0 seconds. Claims of future capability
  without a demonstrated run do not count. Otherwise resolves No. Mirrors the
  Polymarket market of the same name.
context_summary: >-
  Tesla is due to unveil the long-delayed second-generation Roadster at an
  outdoor event near SpaceX's McGregor test site in Texas on Thursday 15
  October, streamed on X at 7:55 pm Central. The car was first shown in 2017
  with claims of 0-60 mph in 1.9 seconds, a 250+ mph top speed, 620 miles of
  range and a $200,000 base price, with deliveries promised for 2020; it has
  slipped repeatedly since. The event itself was postponed from 1 October,
  officially because of high winds and because it "can only be held
  outdoors". Musk has long tied the car to a "SpaceX option package": in 2018
  he described roughly ten small cold-gas thrusters fed by a high-pressure
  composite tank, and in 2021 he cited a target of about 1.1 seconds for
  0-60 mph. He has said "the new Tesla Roadster can fly", called the reveal
  "a candidate for greatest product demo of all time", and teased that it
  "will be a BANGER, probably metaphorically, though some chance literally".
  Reports said the demo car would be unmanned with spectators kept hundreds
  of yards back, and the FAA issued temporary flight restrictions over the
  site. Tesla has not confirmed which features will be shown live; previews
  listed a measured 0-60 time, price and delivery date as the key things to
  watch, and some commentators expected a launch around 1.5 seconds at best.
  On Polymarket, a live timed sub-1-second 0-60 run was priced at about 20%
  shortly before the event.
