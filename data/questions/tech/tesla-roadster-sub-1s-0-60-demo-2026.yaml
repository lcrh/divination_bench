event_date: 2026-10-15
outcome_summary: >-
  Yes. At the roughly 25-minute event in McGregor, Texas, the Roadster
  repeatedly used a fan-suction system and cold-gas thrusters developed with
  SpaceX: it drove up a curved ramp and hung upside down, launched off and
  rolled upright in mid-air, leapt and barrel-rolled over a line of Tesla
  vehicles, and did a standing side flip. In a third live demo, a
  thruster-assisted 0-60 mph run was timed at 0.81 seconds (Tesla said 0.67
  s with rollout subtracted). Tesla announced three trims: Performance (0-60
  under 1.6 s, road-legal), Thrust (rear cold-gas thrusters, under 0.9 s,
  $250,000 reservation) and an invite-only Rocket (perimeter thrusters, under
  0.59 s, not approved for public roads). It claimed 230+ mph and 300+ miles
  of range, and Musk said production would start in 2028. No price was
  given. Reporters called it more of a stunt show than a product launch.
  Polymarket's "0-60 under 1 second" and "flies for 1s+" markets both
  resolved Yes.
resolved_answer: "Yes"
