event_date: 2026-10-05
outcome_summary: >-
  Optogenetics. On 5 October 2026 the Nobel Assembly awarded the prize
  jointly to Karl Deisseroth (HHMI and Stanford, USA, 54), Peter Hegemann
  (Humboldt University of Berlin, 71) and Georg Nagel (University of
  Würzburg, 73) "for their discoveries concerning light-gated ion channels
  and optogenetics". Each receives a third of SEK 12 million. Hegemann and
  Nagel discovered channelrhodopsin, a light-gated channel protein in the
  alga Chlamydomonas. Deisseroth put the gene into rat neurons, triggered
  nerve signals with blue light in 2005, and made it work in living mice by
  2007. The heavily tipped GLP-1 researchers missed out again. Gero
  Miesenböck and Ed Boyden, often named in optogenetics speculation, were
  left out, while Nagel was included. Clarivate noted that Deisseroth had
  been one of its Citation Laureates since 2019.
resolved_answer: "Optogenetics (e.g. Deisseroth, Hegemann)"
