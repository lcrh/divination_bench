id: nobel-medicine-2026-field
domain: science
title: Which discovery will the 2026 Nobel Prize in Physiology or Medicine honour?
question: >-
  For which line of research will the Nobel Assembly at Karolinska Institutet
  award the 2026 Nobel Prize in Physiology or Medicine, announced on 5
  October 2026, and to whom?
question_type: multiple_choice
options:
  - "GLP-1 hormone biology (e.g. Drucker, Holst, Mojsov)"
  - "Optogenetics (e.g. Deisseroth, Hegemann)"
  - "Optical coherence tomography (Fujimoto, Huang, Swanson)"
  - "Orexin and narcolepsy (Mignot, Yanagisawa)"
  - "Another discovery"
resolution_criteria: >-
  Resolves to the option matching the prize motivation in the official
  Nobel Assembly press release of 5 October 2026. The laureates named in each
  option are examples. The option resolves on the field even if the exact
  set of laureates differs. Judges may also credit correctly naming the
  laureates.
context_summary: >-
  The 2026 Nobel Prize in Physiology or Medicine will be announced in
  Stockholm on Monday 5 October, opening Nobel week. Nominations are secret
  for 50 years, so forecasters rely on precursor awards and citation data.
  The most-discussed candidate is the discovery of the gut hormone GLP-1, the
  basis of semaglutide-type drugs that have transformed diabetes and obesity
  treatment. Clarivate's 2026 Citation Laureates (17 September) named Daniel
  Drucker, Jens Juul Holst and Svetlana Mojsov. Lotte Bjerre Knudsen of Novo
  Nordisk is often mentioned as a fourth contender, and the death of pioneer
  Joel Habener in late 2025 narrowed the field. Optogenetics, which uses
  light-sensitive algal proteins to switch individual neurons on and off, has
  been called overdue for years. Names linked to it include Karl Deisseroth,
  Peter Hegemann, Gero Miesenböck, Georg Nagel and Ed Boyden. Clarivate's
  other medicine picks were optical coherence tomography (James Fujimoto,
  David Huang, Eric Swanson) and immune adhesion receptors (Timothy
  Springer). Emmanuel Mignot and Masashi Yanagisawa won the September 2026
  Lasker basic research award for orexin and narcolepsy. CAR-T cell therapy,
  the gut microbiome, and the 2025 Lasker winners (low-complexity protein
  domains; cystic fibrosis triple therapy) also feature in the speculation.
  The committee has often surprised forecasters, and the prize can go to up
  to three people.
