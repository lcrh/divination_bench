notes: >-
  No market field. I found no Polymarket, Kalshi or Manifold market. Clutch
  Predict, a play-money credits app, lists several resolved questions of the
  form "Will H3 launch MMX on 20 October?", with final crowd confidence of
  67-86%. Those figures have no as-of timestamps and are not real-money
  prices, so I did not include them. Soft spots: (1) The press kit's
  published_date comes from its filename (20261016), not from a date printed
  in the document. (2) The claim that no H3 launch had ever gone without a
  postponement comes from a single Japanese preview (Mynavi TECH+) and was
  not independently verified. (3) The launch was on 20 October JST but
  19 October UTC and in Europe and the Americas. Times are anchored to
  JST, the official JAXA date. event_date is 2026-10-20 JST, and the DLR
  outcome source is dated 19 October in CEST. (4) The reserved period was
  originally announced as running to 7 November and was later extended to
  9 November. The question uses the later date. The likely prior is high for
  launch success (7 of H3's 9 prior flights succeeded) but more uncertain for on-time
  launch.
