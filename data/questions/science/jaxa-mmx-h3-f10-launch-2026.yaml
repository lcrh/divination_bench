event_date: 2026-10-20
outcome_summary: >-
  H3 Flight No. 10 lifted off on schedule at 04:41:03 JST on 20 October 2026
  (19:41 UTC on 19 October) from the Yoshinobu Launch Complex at Tanegashima,
  with no postponement. JAXA reported that the rocket flew as planned. MMX
  separation was confirmed about 71 minutes 13 seconds after liftoff, and the
  spacecraft was injected into its predetermined orbit, a Mars transfer
  trajectory. Arrival at Mars is expected in August 2027. This was H3's third
  consecutive success since the December 2025 Flight No. 8 failure. The
  Idefix rover is due to land on Phobos around the turn of 2028/2029, and
  sample return is planned for 2031.
resolved_answer: >-
  Launched on the first attempt, exactly on time on 20 October JST; MMX
  separated about 71 minutes later onto its planned Mars transfer trajectory.
