id: jaxa-mmx-h3-f10-launch-2026
domain: science
title: JAXA Martian Moons eXploration (MMX) launch on H3 Flight No. 10
question: >-
  JAXA's Martian Moons eXploration (MMX) Phobos sample-return spacecraft is
  scheduled to launch on H3 Launch Vehicle Flight No. 10 from Tanegashima at
  04:41:03 JST on 20 October 2026, with a reserved launch period running to
  9 November 2026. What will happen with this launch: when will it fly, how
  will the rocket perform, and where will MMX end up?
question_type: open
options: null
resolution_criteria: >-
  Judged against JAXA's official launch-result announcements: the liftoff
  date and time (JST), any postponements, how the rocket performed, and
  whether and when MMX separated and was placed on its planned trajectory.
context_summary: >-
  MMX is JAXA's flagship planetary mission and its largest Solar System
  mission to date. The 4,480 kg spacecraft is meant to orbit Mars, land twice
  on the moon Phobos, deploy the French-German Idefix rover, and return at
  least 10 grams of Phobos material to Earth in 2031. In August, JAXA set the
  launch for 04:41:03 JST on 20 October 2026 (19:41 UTC on 19 October) aboard
  H3 Flight No. 10, from the Yoshinobu Launch Complex at Tanegashima. The
  launch has an instantaneous window and a reserved period running to
  9 November, the end of the 2026 Mars transfer opportunity. The rocket is
  the most powerful H3-24L variant: two LE-9 engines, four SRB-3 boosters,
  and a long fairing flying for the first time. It is also H3's first
  launch beyond Earth orbit. The flight plan uses full first-stage thrust
  without throttling, a coast of about an hour, a second upper-stage burn,
  and spacecraft separation over Africa about 71 minutes after liftoff.
  H3's record is mixed. Its March 2023 debut failed. Then on 22 December
  2025, Flight No. 8 lost the MICHIBIKI No. 5 navigation satellite when the
  second-stage engine's second burn failed to build up normally; the cause
  was later traced to a payload-adapter defect. H3 returned to flight with
  Flight No. 6 on 12 June 2026 and Flight No. 9 on 11 August 2026, both
  successful. A Japanese preview noted that no H3 launch had ever gone
  without a postponement, although the weather forecast for launch morning,
  as of 18 October, was clear.
