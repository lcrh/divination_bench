id: copernicus-september-2026-global-temperature
domain: science
title: Copernicus's verdict on global temperature in September 2026
question: >-
  After August 2026 tied July 2023 as the hottest month ever recorded, how
  will September 2026 compare? What will the Copernicus Climate Change
  Service (C3S) report for global average surface air temperature in
  September 2026: its rank among Septembers in the ERA5 record, and how far
  above the 1850-1900 pre-industrial level it was?
question_type: open
options: null
resolution_criteria: >-
  Judged against the C3S monthly climate bulletin for September 2026 (ERA5
  data). Check the rank of September 2026 among all Septembers, the anomaly
  above pre-industrial (1850-1900) and above 1991-2020, the margin to the
  record September, and whether extra-polar sea surface temperatures set a
  September record. A prediction scores well if it gets the rank and the
  pre-industrial anomaly to within about 0.05 C.
context_summary: >-
  A strong El Nino developed in the tropical Pacific in 2026. NOAA declared
  El Nino conditions on 11 June and gave a 63% chance that it would become
  "very strong" (more than 2.0 C above normal in the Nino 3.4 region).
  Australia's Bureau of Meteorology declared it a few days later. On
  10 September C3S reported that August 2026 had been the joint-warmest
  month ever recorded, tied with July 2023, at 16.96 C. That was 0.85 C
  above the 1991-2020 average and 1.65 C above pre-industrial, the first
  month above 1.5 C since November 2025. June to August 2026 tied 2024 as
  the warmest boreal summer on record. Extra-polar sea surface temperatures
  (60S-60N) were the highest on record for August at 21.07 C, and tropical
  Pacific SSTs were at record highs as El Nino continued to intensify. C3S
  said it could become one of the strongest El Nino events on record. The
  benchmark to beat was September 2023, which had broken the previous
  September record by an exceptional margin during the last strong El Nino
  and was about 0.93 C above the 1991-2020 average. Global temperatures
  usually lag El Nino by several months, so the biggest effects of the 2026
  event were expected in late 2026 and 2027. Western Europe had just had
  its warmest summer on record.
