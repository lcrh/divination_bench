market: null
notes: >-
  No market. Date soft spot: the Copernicus press-release page is dated
  14 October, but Yale Climate Connections said on 9 October that C3S had
  already rated September second-warmest, so the bulletin was public by
  then. event_date is 9 October, and all context sources are from
  10 September or earlier. The figure of about 0.93 C above 1991-2020 for
  September 2023 is restated from the outcome bulletin. It was well known
  before the event, but no dated pre-event page carrying it was retrieved.
  The 1.63 C anomaly is a C3S/ERA5 figure. NOAA and NASA use different
  baselines.
