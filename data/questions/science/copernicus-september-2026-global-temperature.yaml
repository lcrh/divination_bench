event_date: 2026-10-09
outcome_summary: >-
  C3S reported that September 2026 was the second-warmest September on
  record globally, behind September 2023. Global average surface air
  temperature was 16.27 C, 0.82 C above the 1991-2020 average and 0.11 C
  cooler than September 2023 (+0.93 C). It was 1.63 C above pre-industrial,
  the second month in a row above 1.5 C. The 12-month average (October 2025
  to September 2026) returned to 1.50 C above pre-industrial. Extra-polar
  SST set a September record of 21.05 C, well above 2023's 20.92 C, and
  Nino 3.4 SST reached an all-time monthly high. Western Europe had its
  joint-warmest September (tied with 2023), and Europe as a whole its
  third-warmest. NOAA and NASA also ranked the month second behind 2023;
  NOAA reported a record ocean surface anomaly for any month.
resolved_answer: >-
  Second-warmest September on record, behind 2023: 16.27 C globally, 1.63 C
  above pre-industrial (0.82 C above 1991-2020, 0.11 C below September
  2023), with record September sea surface temperatures.
