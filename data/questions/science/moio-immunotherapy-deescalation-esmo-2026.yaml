event_date: 2026-10-26
outcome_summary: >-
  MOIO failed. Enrolment had been halted in May 2026 after an unexpected
  overall-survival imbalance at the first interim analysis, with 340 of a
  planned 646 patients randomised (March 2022 to November 2025) at 36
  French centres. In the modified intention-to-treat population (308
  patients, median follow-up 18.6 months), median PFS was 25.0 months with
  standard dosing versus 21.9 months with 12-weekly dosing (HR 1.35, 95% CI
  roughly 0.90-2.0). Non-inferiority (margin 1.30) was not shown, although
  the prespecified futility boundary was not formally crossed either.
  Deaths were 19.9% with reduced-frequency dosing versus 10.5% with
  standard dosing (OS HR about 2.0, p=0.0286). Toxicity did not fall
  meaningfully: grade 3-4 immune-related adverse events were 9.5% versus
  10.5%, and serious adverse events 25.0% versus 26.3%. Subgroups
  suggested harm in urothelial and lung cancer and possibly no harm in
  kidney and head and neck cancer (hypothesis-generating only). Gravis
  said 12-weekly dosing is not recommended outside trials. A
  pharmacokinetic sub-study suggested drug levels can fall below the
  effective threshold.
resolved_answer: >-
  MOIO failed to show non-inferiority (PFS 21.9 vs 25.0 months, HR 1.35) and
  was stopped early after nearly twice as many deaths with 12-weekly dosing
  (19.9% vs 10.5%). Toxicity did not fall, so investigators advised against
  routine dose spacing.
