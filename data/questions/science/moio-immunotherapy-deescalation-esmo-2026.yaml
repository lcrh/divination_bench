id: moio-immunotherapy-deescalation-esmo-2026
domain: science
title: Results of the French MOIO trial of less-frequent immunotherapy
question: >-
  The French phase 3 MOIO trial tested whether patients responding to
  immune checkpoint inhibitors after six months could safely switch to the
  same dose every 12 weeks instead of the standard schedule. Its results
  are being presented in ESMO 2026's Presidential Symposium on 26 October
  2026. What will MOIO show about efficacy, survival and toxicity, and what
  will its investigators conclude?
question_type: open
options: null
resolution_criteria: >-
  Judged against the MOIO presentation (LBA10, ESMO 2026, 26 October) and
  contemporaneous reports. Check whether non-inferiority for
  progression-free survival was shown (and the hazard ratio and medians),
  what overall survival showed, whether the trial ran to completion or was
  stopped early, whether toxicity fell meaningfully with less frequent
  dosing, and the investigators' practice recommendation. A prediction
  scores well if it gets the direction (de-escalation supported or not),
  the overall-survival result, and the toxicity finding right.
context_summary: >-
  Immune checkpoint inhibitors such as anti-PD-1 and anti-PD-L1 antibodies
  are typically given every two to six weeks until progression or
  unacceptable toxicity, often for years. Because many responders keep
  responding for a long time, and the drugs occupy their targets for long
  after dosing, oncologists have wondered whether spacing doses out could
  cut costs, hospital visits and side effects without losing efficacy.
  MOIO (NCT05078047), sponsored by the French academic group Unicancer and
  coordinated by Dr Gwenaelle Gravis of Institut Paoli-Calmettes in
  Marseille, is the first randomised phase 3 test of this idea. It opened
  in March 2022. Adults with advanced or metastatic solid tumours (lung,
  kidney, head and neck, bladder, triple-negative breast, Merkel cell,
  liver, melanoma not in complete response and others) who had a partial
  or complete response after six months of standard immunotherapy were
  randomised 1:1. They either continued the standard schedule or received
  the same dose every three months. The primary endpoint is
  progression-free survival with a non-inferiority design, and the
  secondary endpoints include overall survival, quality of life, safety
  and cost-effectiveness. The planned enrolment was 646 patients, with
  interim futility analyses built in. ESMO selected the trial as late-breaking abstract
  LBA10 for its third Presidential Symposium in Madrid on 26 October 2026.
  Previewers described it as tackling a question "many clinicians will
  recognize from daily practice: can immune checkpoint inhibitor dosing
  frequency be safely reduced in responding patients?"
