market: null
notes: >-
  No market. Soft spot: the trial was halted in May 2026, and
  ClinicalTrials.gov showed it as "active, not recruiting". An attentive
  observer could have taken that as a warning sign before ESMO, but no
  public announcement of the halt or its reason was found before
  26 October. The Medscape page carries no explicit date, and its
  27 October date is an estimate. The Unicancer press release is undated
  in the text; its October 2026 upload path and ESMO timing suggest about
  26 October. The touchONCOLOGY preview misspells the acronym as "MIOIO".
  HR confidence intervals differ slightly between reports (0.90-2.00 vs
  0.90-2.04).
