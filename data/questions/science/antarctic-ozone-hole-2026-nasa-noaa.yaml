market: null
notes: >-
  No market. Most of the physical outcome was fixed by 13 October, and daily
  data were public on NASA Ozone Watch and CAMS before the 4 November
  release, so a forecaster with live access could have estimated the rank.
  The tested models only see the September and October context. Rankings
  differ between datasets: CAMS put its own six-hourly peak (27.44 million
  km2 on 20 September) third-highest in its record. Judge against the
  NASA/NOAA figures.
