id: antarctic-ozone-hole-2026-nasa-noaa
domain: science
title: NASA and NOAA's verdict on the 2026 Antarctic ozone hole
question: >-
  NASA and NOAA publish an annual assessment of the Antarctic ozone hole
  after the peak depletion season (7 September to 13 October). What will
  they report about the 2026 ozone hole: how large it was on average and at
  its peak, how it ranked among the years since monitoring began, and how
  deep the ozone loss was?
question_type: open
options: null
resolution_criteria: >-
  Judged against the joint NASA/NOAA 2026 ozone hole release. Check the
  seasonal mean area (7 Sep to 13 Oct) and its rank among the ~48 years of
  satellite monitoring, the date and size of the single-day maximum, the
  lowest ozone value over the South Pole (in Dobson units), and the
  agencies' overall framing (whether recovery under the Montreal Protocol is
  still described as on track). A prediction scores well if it gets the
  size class (small, average, or among the largest), the approximate rank,
  and the depth of ozone loss right.
context_summary: >-
  The Antarctic ozone hole forms every austral spring when sunlight returns
  to the cold polar stratosphere and chlorine and bromine from legacy
  chlorofluorocarbons destroy ozone on polar stratospheric clouds. Its size
  depends both on the declining level of ozone-depleting substances and on
  year-to-year weather, especially the strength and size of the polar
  vortex. The 2025 hole had been unusually small, which scientists cited as
  evidence of recovery under the 1987 Montreal Protocol. The largest holes
  on record occurred around 2000 and 2006; the 2006 hole spanned about
  29.6 million km2 at its peak. In 2026 the Copernicus Atmosphere Monitoring
  Service (CAMS) reported on 16 September that the hole had passed
  15 million km2, larger than Antarctica, by the end of August, slightly
  earlier than average. It then grew sharply in early September, reaching
  an estimated 25 million km2 on 12 September, about 5 million km2 above
  the average for that date, with forecasts pointing to further growth. The
  growth coincided with a sudden drop in stratospheric temperatures about
  20 km above the South Pole. CAMS noted, however, that other measures,
  the minimum ozone column inside the hole and the ozone mass deficit,
  stayed close to average. Germany's DLR, using Sentinel-5P data, put the
  area at up to 27 million km2 as of 20 September and said ozone levels
  inside the hole had not fallen to exceptionally low values. NASA and NOAA
  measure the hole by its mean area over 7 September to 13 October and
  rank each year against the record since 1979, alongside balloon
  measurements of ozone over the South Pole.
