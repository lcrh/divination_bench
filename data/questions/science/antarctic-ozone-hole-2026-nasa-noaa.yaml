event_date: 2026-11-04
outcome_summary: >-
  On 4 November 2026 NASA and NOAA reported that the 2026 ozone hole was
  the seventh-largest in 48 years of monitoring by seasonal mean area. From
  7 September to 13 October it averaged about 25 million km2 (9.6 million
  square miles). Its largest single-day extent was 27.1 million km2
  (10.5 million square miles) on 18 September, about 90% of the record set
  on 9 September 2000. NASA's Paul Newman said the hole grew "to proportions
  we haven't seen in a decade" because of an unusually large, powerful polar
  vortex after weak planetary-wave activity in August and September. The
  hole was not especially deep: balloon soundings found the lowest ozone
  over the South Pole was 105 Dobson units on 17 October, against a record
  low of 92 DU in October 2006. The agencies said it would have been
  1 to 2 million square miles larger with year-2000 levels of
  ozone-depleting substances, that Antarctic stratospheric chlorine has
  fallen by about a third, and that recovery remains on track for the 2070s.
resolved_answer: >-
  NASA and NOAA ranked the 2026 hole the seventh-largest in 48 years, with a
  seasonal mean of about 25 million km2 and a peak of 27.1 million km2 on
  18 September, caused by a strong polar vortex. It was not especially
  deep: the South Pole minimum was 105 DU, and recovery remains on track.
