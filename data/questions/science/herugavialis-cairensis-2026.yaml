id: herugavialis-cairensis-2026
domain: science
title: What is Herugavialis cairensis, and why was it given that name?
question: >-
  In October 2026 scientists announced a newly named animal, Herugavialis
  cairensis. What is it, and why was it given that name?
question_type: open
options: null
resolution_criteria: >-
  Judged on (1) what kind of organism it is: living or extinct, which animal
  group, roughly when and where it lived, and what fossil material it is based
  on; and (2) the reasoning behind the name. A top answer gets the animal group,
  the approximate age, the location and rock formation, and the explanation for
  "Heru". Credit is reduced for answers that get only the generic meaning of the
  Latin parts right. Extra precision: when the fossils were found and how they
  were previously classified, the methods behind the new classification, and
  where the paper was published.
context_summary: >-
  In early October 2026 a team of palaeontologists from the UK, Sweden, Germany
  and Egypt formally named Herugavialis cairensis in a peer-reviewed paper. The
  team included researchers from University College London, the Swedish Museum
  of Natural History and Mansoura University in Egypt. The UCL group led by
  Philip Mannion and Paul Burke had spent recent years using CT scans to
  re-examine historical crocodylian fossils, especially long-snouted forms
  whose classification was disputed. Other groups were also publishing on the
  evolution of these animals, including new fossils from Peru in 2025.
