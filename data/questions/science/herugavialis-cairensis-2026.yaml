notes: >-
  Taxonomically this is a new genus for an already-described species (Tomistoma
  cairense, 1927 becomes Herugavialis cairensis), though press coverage calls
  it a "new species". The name itself gives away "gavial" and "Cairo", so the
  question also asks why it was named that way: the Sphinx and Heru link cannot
  be guessed from the Latin. Nautilus published at 6:00 PM CDT on 6 Oct 2026
  (the embargo lift), so event_date is 6 Oct, while the paper's online date is
  7 Oct. The UCL press release (7 Oct) was seen only through search snippets
  because direct fetches timed out, so it is not cited.
