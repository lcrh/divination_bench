    excerpt: "The acquisition of a long and slender snout (longirostry) resulted in extremely similar morphology across crocodylians and, therefore, raised a conflict between morphological and molecular phylogenetic hypotheses involving the longirostrine living gharials, Gavialis gangeticus and Tomistoma schlegelii."
event_date: 2026-10-06
outcome_summary: >-
  Herugavialis cairensis is an extinct gavialoid crocodylian (a gavial: a
  long, thin-snouted, fish-eating crocodile) that lived about 45 million years
  ago, in the Middle Eocene (Lutetian), in the shallow sea then covering
  northern Egypt. It is known from a nearly complete skull of about 18 inches
  and other fossils collected in the 1920s at Gebel Mokattam east of Cairo, in
  the Mokattam Formation limestone. That is the same rock formation the Great
  Sphinx of Giza was carved from. The fossils were described in 1927 as
  Tomistoma cairense, a relative of the living false gharial. CT scanning showed
  differences such as telescoped, raised eye-socket rims, and phylogenetic
  analysis showed it is not close to Tomistoma, so it was given a new genus. The
  name honours the Egyptian god Heru (Horus), often linked to the Sphinx ("Horus
  of the Horizon"). The choice was made because the skull, like the Sphinx, is
  missing the tip of its nose/snout and comes from the same rock. "-gavialis"
  reflects its kinship with Gavialis, and "cairensis" refers to Cairo. The paper
  (Burke et al.) appeared in Royal Society Open Science on 7 October 2026, with
  embargoed coverage published the evening of 6 October US time.
resolved_answer: >-
  It is an extinct, roughly 45-million-year-old (Middle Eocene) gavial, a
  long-snouted fish-eating crocodile, from the Mokattam Formation near Cairo.
  The fossils were found in the 1920s and were previously classed as Tomistoma
  cairense. It was named after the god Heru (Horus) because it comes from the
  same rock as the Great Sphinx and, like the Sphinx, is missing the tip of its
  nose.
