id: ema-narsoplimab-reexamination-2026
domain: science
title: EMA's re-examination of narsoplimab (Yartemlea) for transplant-associated TMA
question: >-
  In June 2026 the European Medicines Agency's human medicines committee
  (CHMP) recommended refusing EU authorisation of Omeros' narsoplimab
  (Yartemlea) for thrombotic microangiopathy after stem cell transplant,
  and Omeros asked for a re-examination. What will the CHMP decide when the
  re-examination concludes in October 2026, and on what grounds?
question_type: open
options: null
resolution_criteria: >-
  Judged against the CHMP's re-examination outcome (October 2026 meeting
  highlights and the EMA's question-and-answer document). Check the
  decision (refusal confirmed, reversed to a positive opinion, or converted
  to a conditional or restricted approval), whether a conditional marketing
  authorisation was considered and why it was or wasn't granted, and the
  main scientific reasons given (for example single-arm design, concomitant
  therapies, external-control survival comparison, paediatric data). A
  prediction scores well if it gets the decision and at least the main
  evidential objection right.
context_summary: >-
  Haematopoietic stem cell transplant-associated thrombotic microangiopathy
  (TA-TMA) is a frequently fatal complication of bone marrow transplants.
  No treatment was approved for it in Europe. Narsoplimab, Omeros'
  monoclonal antibody against MASP-2 (the effector enzyme of the lectin
  complement pathway), was approved by the US FDA as Yartemlea in December
  2025 for adults and children aged two and older. It was the first
  approved therapy for TA-TMA, and US sales were growing quickly ($32.2m
  gross in Q2 2026). Omeros's European application, with orphan
  designation, relied on the same evidence as the FDA approval: a pivotal
  single-arm trial in 28 adults, survival comparisons with an external
  registry of untreated patients, and data from its compassionate-use
  programme. After an oral explanation in June 2026, at which Omeros
  appeared with four international transplant experts, the CHMP adopted a
  negative opinion on 25 June. Omeros said it was disappointed, given the
  lethality of the disease and the lack of any approved European
  treatment. It requested re-examination and asked for an Ad Hoc Expert
  Group (AHEG) of external haematology and transplant experts to review the
  case. In August it submitted grounds for re-examination, including
  patient-level data. CHMP re-examinations are carried out by new
  rapporteurs and can confirm or reverse the original opinion. Omeros noted
  in its filings that there was no guarantee of a reversal. The outcome was
  expected at the CHMP's 12-15 October 2026 meeting.
