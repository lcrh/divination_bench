event_date: 2026-10-15
outcome_summary: >-
  On 15 October 2026 the CHMP confirmed its refusal after re-examination
  (EMA meeting highlights and Q&A published 16 October). The EMA said the
  pivotal study had no placebo or active comparator and patients were
  taking other medicines, so benefits could not be attributed to
  Yartemlea. It also cited mid-study changes, how effectiveness was
  measured, and how the dose was chosen. Published studies of other
  treatments showed similar results. The external-control survival
  comparison could not reliably confirm an effect. Paediatric data were too
  limited to support dose, efficacy or safety, and the mechanism was not
  confirmed. Omeros floated switching to a conditional marketing
  authorisation, but the EMA said the criteria weren't met because benefit
  had not been demonstrated. An expert group was consulted. Omeros said the
  AHEG had recommended an external review of patient-level data that the
  CHMP did not provide to the experts, called itself "deeply disappointed",
  and said it would end its EU compassionate-use programme because of US
  demand.
resolved_answer: >-
  The CHMP confirmed its refusal on 15 October 2026. Efficacy was not shown
  because the 28-patient pivotal study was single-arm with confounding
  concomitant treatments and design problems, and external-control
  survival comparisons were unreliable. A conditional authorisation was
  also rejected because benefit had not been demonstrated.
