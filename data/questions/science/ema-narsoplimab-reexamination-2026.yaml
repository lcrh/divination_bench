notes: >-
  No market. The base rate is that CHMP re-examinations usually confirm the
  original negative opinion, so the "what" was the more predictable part
  and the grounds are where precision matters. The EMA EPAR page shows no
  explicit publication date; 16 October is used, matching the Q&A release
  noted in the meeting highlights. The claim that the 12-15 October meeting
  would conclude the re-examination is an inference from the standard CHMP
  timetable, not from a retrieved pre-event source. The 25 June date of the
  initial opinion comes from the EMA's EPAR page.
