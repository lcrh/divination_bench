notes: >-
  No market. The subject is American (Earhart, Purdue), but the site and
  part of the team are Kiribati. Departure date differs by source: Purdue's
  results release says 6 October, while Axios, BBC and Purdue's own
  pre-trip updates say 7 October local time. The "very likely" quote and
  the Phase 1-3 plan come from ALI material quoted in the Smithsonian
  outcome article. Smithsonian also gives the 17-person team size, which
  matches Purdue's roster. The steel-tube detail combines Purdue (about 30
  inches, found in the lagoon) with a UWF/Newswise account (about 3 feet,
  judged unrelated to the aircraft).
