event_date: 2026-10-18
outcome_summary: >-
  On 18 October 2026 (US time; 19 October on Nikumaroro) the expedition
  announced "no conclusive evidence" that Earhart's Electra was in the
  lagoon. The Taraia Object was likely a collection of large trees
  deposited on the peninsula's sandspit. Much of it had broken up and
  washed away, leaving one Y-shaped segment. Its reflective, metal-like
  appearance came from a carbonate veneer of concreted coral sand. A
  magnetometer anomaly west of the site turned out to be a roughly
  30-inch (about 3-foot) steel tube or pipe that the archaeologists judged
  not to be from the aircraft. Hydroprobing around the object found only
  coral rubble. The weather-extended trip spent seven days at Nikumaroro,
  four of them onshore. The team said it still believed the broader
  castaway hypothesis, would keep studying the artefacts it found, and
  Purdue pledged to continue the search.
resolved_answer: >-
  No sign of the Electra. The Taraia Object turned out to be a pile of large
  trees and debris whose shiny look came from a coral-sand carbonate
  coating. The team found only incidental artefacts, such as a steel tube,
  but said it still backed the castaway theory.
