id: earhart-taraia-object-expedition-2026
domain: science
title: What the Taraia Object expedition finds on Nikumaroro
question: >-
  An expedition led by the Archaeological Legacy Institute and Purdue
  University sailed from Tarawa, Kiribati, in October 2026 to investigate
  the "Taraia Object", an anomaly in the lagoon of Nikumaroro atoll that
  its backers believed was Amelia Earhart's lost Lockheed Electra. What
  will the expedition find, and what will it announce about the object?
question_type: open
options: null
resolution_criteria: >-
  Judged against the expedition's announcement of results (Purdue / ALI,
  18-19 October 2026) and contemporaneous reports. Check what the object
  was identified as, whether any aircraft wreckage or Earhart-linked
  evidence was confirmed, what other artefacts were recovered, and the
  team's stance on the castaway hypothesis and future searches. A
  prediction scores well if it gets the identification (aircraft or not,
  and if not, what) and the overall result (confirmation, inconclusive, or
  debunked) right.
context_summary: >-
  Amelia Earhart and navigator Fred Noonan vanished on 2 July 1937 while
  flying from Lae, New Guinea, to Howland Island in their Lockheed Electra
  10-E, a plane bought with Purdue Research Foundation money. The official
  view is that they ran out of fuel and crashed at sea near Howland. A
  rival "castaway" hypothesis, championed for decades by TIGHAR, holds that
  they landed on the reef at Nikumaroro (then Gardner Island), about 400
  miles away in what is now Kiribati. It cites 1930s-era artefacts, bones
  found in 1940, and radio bearings. Earlier searches came up empty: a
  2019 Robert Ballard expedition found nothing, and a 2024 sonar "plane"
  near Howland turned out to be rock. In 2020 an amateur researcher spotted
  a plane-shaped anomaly at the edge of Nikumaroro's lagoon by the Taraia
  Peninsula in satellite imagery. It was later found in aerial photos going
  back to 1938. The Archaeological Legacy Institute (ALI), led by Richard
  Pettigrew, together with Purdue, said it was "very likely" the Electra
  and planned a Phase 1 survey before possible excavation. The trip was
  postponed from November 2025 by Kiribati approvals and cyclone season.
  On 7 October 2026 a 17-person team, including three Kiribati
  representatives, left Tarawa on the Marin Mainiku for the 830-nautical-mile
  voyage with magnetometer and sonar gear, due to arrive around
  12-13 October. Pettigrew expected an identification within a couple of
  days of arrival and called finding the Electra "the discovery of a
  lifetime". TIGHAR's Ric Gillespie was sceptical, saying the object looked
  like a fallen tree.
