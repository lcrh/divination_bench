id: nobel-physics-2026
domain: science
title: Who will win the 2026 Nobel Prize in Physics, and for what?
question: >-
  Who will the Royal Swedish Academy of Sciences award the 2026 Nobel Prize in
  Physics to on 6 October 2026, and for what work?
question_type: open
resolution_criteria: >-
  Resolves to the laureate(s) and prize motivation in the official Royal
  Swedish Academy of Sciences press release of 6 October 2026. Predictions
  are judged on the field and discovery and on the people named.
context_summary: >-
  The physics prize will be announced at 11:45 CEST on Tuesday 6 October, the
  day after the medicine prize went to optogenetics. Nominations are secret,
  so forecasters work from precursor prizes, citation data and the
  committee's habit of rotating between subfields. Clarivate's 2026 Citation
  Laureates in physics were Chihaya Adachi, Stephen Forrest and Mark Thompson
  for ultra-efficient phosphorescent and TADF OLEDs, Nicola Spaldin for
  room-temperature magnetoelectric multiferroics, and Qikun Xue for observing
  the quantum anomalous Hall effect. Swedish radio's science producer tipped
  metamaterials and "invisibility cloak" pioneer John Pendry, possibly with
  David Smith. Others mentioned Federico Capasso (quantum cascade laser) and
  twistronics in magic-angle graphene (Pablo Jarillo-Herrero, Allan
  MacDonald, Rafi Bistritzer, Eva Andrei), though some think that is still a
  few years early. Physics World's Hamish Johnston argued condensed-matter
  and particle/nuclear physics were "due", and suggested the CERN ATHENA and
  ALPHA antihydrogen experiments (Jeffrey Hangst), or wavelets (Ingrid
  Daubechies and others). Quantum information (Peter Shor, Alexei Kitaev, John
  Preskill, Charles Bennett and Gilles Brassard), the Aharonov-Bohm effect
  and Berry phase (Yakir Aharonov, Michael Berry), the quantum spin Hall
  effect (Charles Kane, Eugene Mele) and exoplanet atmospheres (David
  Charbonneau, Sara Seager) are also perennial tips. A low-volume Polymarket
  market listed about two dozen such candidates. The prize can be split among
  up to three people.
