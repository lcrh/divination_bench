event_date: 2026-10-06
outcome_summary: >-
  Francis Halzen, alone. The prize went to Halzen (born 1944 in Tienen,
  Belgium; University of Wisconsin-Madison) "for decisive contributions to
  the IceCube Neutrino Observatory and the discovery of high-energy neutrinos
  of astrophysical origin". IceCube is a cubic kilometre of instrumented
  Antarctic ice about 2 km below the South Pole, run by a collaboration of
  roughly 450 people from 58 institutions. Halzen has been its principal
  investigator since the start. The detector found a diffuse flux of
  astrophysical neutrinos reaching petaelectronvolt energies and identified
  an active galaxy as a source, opening the field of neutrino astronomy. This
  is the first unshared physics prize since 1992. Halzen was not among the
  widely discussed favourites or Polymarket's listed candidates. Reached by
  phone in Italy, he said: "It was a huge surprise; I hadn't expected it at
  all." The prize is worth SEK 12 million.
resolved_answer: "Francis Halzen (sole laureate), for decisive contributions to the IceCube Neutrino Observatory and the discovery of high-energy astrophysical neutrinos"
