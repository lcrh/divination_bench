notes: >-
  No market included. Polymarket's Isaias market was about the landfall
  state (it resolved Florida). Kalshi's "Hurricane Isaias category" market
  appears to be about peak category, not landfall intensity: its Category 3+
  bracket resolved Yes, so it does not match this question. No pre-event
  prices for either market could be retrieved. Soft spots: (1) The NHC
  Category 3 upgrade update is headed "720 AM CDT" but its summary says "0820
  UTC", and the filename suggests 1218 UTC, so the exact time of the upgrade
  is slightly ambiguous. It is clearly on the morning of 9 October. (2) The
  Outage Pro page has no explicit publication date, so 2026-10-10 is the date
  of its peak reading. (3) WeatherNation's date is the page's "12 Oct 2026"
  stamp, which may be an update time. (4) CNBC calls the landfall "early on
  Saturday", but NHC gives 8:30 PM CDT Friday (0130 UTC Saturday). (5)
  Resolution uses the operational NHC landfall intensity. A later NHC
  Tropical Cyclone Report could revise it. (6) The AP landfall story could not
  be fetched (timeouts), so it is not cited.
