event_date: 2026-10-09
outcome_summary: >-
  Isaias made landfall near Destin, Florida (30.4N 86.5W, about 40 miles
  east of Pensacola) at about 8:30 PM CDT on 9 October 2026 (0130 UTC 10
  October). This was its first and only US landfall. NHC, using NWS Doppler
  radar data, gave maximum sustained winds of 105 mph (165 km/h), a Category
  2 hurricane, and an estimated minimum central pressure of 971 mb. Earlier
  that day it had peaked as a Category 3 with 120 mph winds and 959 mb, but it
  weakened slightly as it came ashore. Reported gusts reached 116 mph near
  Santa Rosa Sound, with sustained winds of 91 mph there, and 100 mph near
  Pensacola. Water levels reached about 5.6 ft above MHHW at Panama City
  Beach. Isaias weakened rapidly inland and became post-tropical over Alabama
  by 10 October. Four people died. Outages peaked at about 910,000 customers
  across eight states, including about 458,000 in Florida and 328,000 in
  Alabama, and about 670,000 were still without power at midday on 10
  October. Pensacola's airport was damaged and closed to commercial flights.
resolved_answer: >-
  Landfall near Destin, Florida at 8:30 PM CDT on 9 October as a Category 2
  (105 mph, 971 mb), weakened from a Category 3 peak; four deaths and about
  910,000 customers without power at the peak.
