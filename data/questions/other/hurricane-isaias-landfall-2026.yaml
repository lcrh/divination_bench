id: hurricane-isaias-landfall-2026
domain: other
title: Hurricane Isaias landfall on the US Gulf Coast
question: >-
  Hurricane Isaias, the first hurricane of the 2026 Atlantic season, is
  expected to make landfall on the northern US Gulf Coast on the evening of
  9 October 2026. Where and when will it make landfall, how strong will it
  be at landfall, and what will its impacts be?
question_type: open
options: null
resolution_criteria: >-
  Judged against the National Hurricane Center's landfall update (location,
  time, maximum sustained winds and category on the Saffir-Simpson scale,
  central pressure) and contemporary reports of surge, gusts, deaths and
  power outages. Landfall intensity is the operational NHC figure, not the
  storm's peak or any later reanalysis.
context_summary: >-
  Isaias became the first hurricane of the 2026 Atlantic season on the night
  of 7 October, the latest first Atlantic hurricane on record, in a season
  suppressed by a strong El Nino. Moving east-northeast and then north across
  the Gulf of Mexico, it prompted Hurricane Warnings from Ocean Springs,
  Mississippi, to the Bay/Gulf County line in Florida, mandatory evacuations
  in parts of the Florida Panhandle, states of emergency in Florida and
  Alabama, and offshore oil shut-ins. At 10 PM CDT on 8 October the NHC raised
  the intensity to 90 kt. It forecast a brief peak of 100 kt (115 mph, major
  hurricane) early Friday 9 October, followed by "some weakening before
  landfall" as southwesterly shear increased, with 85 kt forecast near the
  coast. Instead, Isaias strengthened overnight. At 7:20 AM CDT on 9 October,
  Hurricane Hunters found it had become a major hurricane with 120 mph winds
  and a 959 mb pressure. The 10 AM discussion noted that shear had increased
  to 30-40 kt, but because the shear was aligned with the storm's motion,
  hurricane models (HAFS-A, HAFS-B, HWRF) and SHIPS/LGEM suggested Isaias
  could stay a major hurricane up to landfall. The official forecast showed
  100 kt just offshore the western Florida Panhandle that evening. At 1 PM CDT
  on 9 October, the NHC still had 120 mph winds and 959 mb about 145 miles
  south of Pensacola. It said that "fluctuations in intensity are possible"
  but that Isaias was "expected to be at or near major hurricane strength
  when it makes landfall this evening". Storm surge of up to 6-9 ft was
  forecast from the Alabama/Florida border to Grayton Beach, Florida.
