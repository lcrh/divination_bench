id: bulin-47-trend-2026
domain: other
title: What was the viral "Bulin 47" trend of October 2026?
question: >-
  In October 2026 a "Bulin 47" trend swept TikTok, Instagram and YouTube Shorts
  worldwide. What was the Bulin 47 trend: what was the original video, and how
  did people take part?
question_type: open
options: null
resolution_criteria: >-
  Judged on how accurately the answer describes (1) the original viral clip:
  who was in it, where it was filmed, and what happened in it; and (2) the form
  the trend took, meaning how other people remade or reused it. A top answer
  gets both the content of the original clip and the main remake format right.
  Merely identifying Bulin 47 as a Dominican dembow artist earns little credit,
  since that was known beforehand. Extra precision: the other person in the
  clip, the location, the catchphrase or hook, who featured in the remakes,
  and the view counts.
context_summary: >-
  Bulin 47 is the stage name of Hancel Teodoro Vargas Reynoso, a Dominican
  dembow singer, songwriter and comedian born in Santo Domingo in 1989. He
  first became known for comedy videos and has been releasing dembow tracks
  since 2016. He is one of the best-known figures of the Dominican urban music
  scene and has collaborated with artists including Arcángel, Myke Towers and
  Tokischa. In October 2026 "Bulin 47" became one of
  the month's biggest viral trends across TikTok, Instagram Reels and YouTube
  Shorts.
context_sources:
  - url: https://www.diariolibre.com/revista/musica/2025/07/11/breyco-realiza-el-primer-dembow-de-arcangel-y-bulin-47/3180223
    title: Productor dominicano Breyco realiza el primer dembow de Arcángel y Bulin 47
    publisher: Diario Libre
    published_date: 2025-07-11
    excerpt: "...la estrella internacional Arcángel, quien une fuerzas con el carismático Bulin 47 en el sencillo titulado 'Lo Que Te Killa'... Bulin 47, uno de los exponentes más queridos del movimiento urbano dominicano."
event_date: 2026-10-02
outcome_summary: >-
  The trend grew out of a roughly 10-15-second, unplanned street freestyle
  filmed at night outside a restaurant in Spain, under red light, in early
  October 2026. One source dates the original TikTok post to 2 October.
  Colombian content creator and freestyler Kevin Wai walked up to Bulin 47
  (sunglasses, open pink shirt) with a portable speaker playing a dembow beat
  and started freestyling. Bulin, who was about to go into the restaurant,
  stopped, answered with his own rhymes and a distinctive shoulder dance,
  calling out "dame hombro" ("give me shoulder"). The clip spread on TikTok and
  Instagram. Early reports cited more than 50M views across platforms, with the
  original Instagram post reported at 65M to 94M+ views. It then became a meme
  format: first reposts, lip-syncs and shoulder-dance remakes, then a huge wave
  of AI-generated versions. These replaced Bulin's face or body with
  footballers (Messi, Cristiano Ronaldo, Neymar, Mbappé, Haaland), celebrities
  (including Egyptian actors such as Ahmed Helmy), politicians, pets and
  ordinary users' own photos, while keeping his moves and the audio. One
  tracker estimated about 384M views across platforms by 29 October, the
  biggest AI trend of the month. Bulin 47 then released a song based on the
  hook, reported as "Dame Hombro" (7 October) or "Hombritos".
resolved_answer: >-
  It was a short, spontaneous dembow freestyle filmed outside a restaurant in
  Spain in early October 2026: creator Kevin Wai approached Dominican artist
  Bulin 47 with a speaker, and Bulin answered with rhymes and a signature
  shoulder dance ("dame hombro"). It became a global meme, mostly through AI
  remakes putting footballers, celebrities, pets and users' own faces into the
  clip.
