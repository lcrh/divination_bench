notes: >-
  Bulin 47 the artist was well known before the window. Only the clip and trend
  are new, so the resolution criteria give little credit for describing the
  artist. The 2 Oct 2026 posting date comes from one AI-video-tool site
  (RapBlaze). Other sources only say "early October", and the MARCA story ran
  on 8 Oct. Sources disagree on the follow-up single's title ("Dame Hombro"
  per YupPop/RapBlaze, "Hombritos" per Extra.ec, 13 Oct 2026) and on view
  counts. Several outcome sources are commercial AI-meme-generator sites,
  backed up by MARCA and Nile FM.
