id: fomc-oct-2026-dissents
domain: economics
title: Fed October 2026 FOMC decision and dissents
question: >-
  At the Federal Reserve's FOMC meeting ending on 28 October 2026, what will
  the Committee decide on the federal funds target range, what will the vote
  be, and which voting members (if any) will dissent and in which direction?
question_type: open
resolution_criteria: >-
  Resolves to the decision, vote tally and named dissenters (with their
  preferred alternative) as recorded in the official FOMC statement released
  at 2:00 p.m. EDT on 28 October 2026.
context_summary: >-
  The Federal Reserve under Chair Kevin Warsh raised the federal funds target
  range by 25 bp to 3.75%-4.00% on 16 September 2026, its first hike since
  July 2023, on a unanimous vote; the September dot plot showed 16 of 18
  participants expecting at least one more hike in 2026. Inflation has
  re-accelerated on an oil shock tied to the Middle East conflict and
  disruption in the Strait of Hormuz: September headline CPI was 3.7% y/y
  (above the 3.6% consensus) and core 2.6%, while August core PCE eased to
  3.0%. The labour market is soft, with September payrolls of just 29,000
  and unemployment at 4.2%. Third-quarter GDP, due the day after the meeting,
  is expected near or above 3%. Fed leaders John Williams and Philip Jefferson
  signalled no urgency to move again in October, and Warsh declined to
  prejudge either October or December. Heading into the 27-28 October
  meeting, Kalshi priced a hold at about 95% and a 25 bp hike at about 5%;
  CME FedWatch put a December hike near 73%. The committee is split: in July's
  9-3 hold, regional presidents Beth Hammack (Cleveland), Lorie Logan (Dallas)
  and Neel Kashkari (Minneapolis) dissented in favour of a hike; all three are
  2026 voters, alongside Philadelphia's Anna Paulson. Kalshi's individual
  dissent contracts priced Hammack at about 79%, Logan about 68%, Kashkari
  about 35%, and governors Bowman and Waller in the mid-single digits, for an
  expected dissent count of 1.83. Rabobank expected Hammack, Kashkari and Logan
  to repeat their July hawkish dissents. Governor Lisa Cook, whom President
  Trump is again trying to remove, has never dissented since joining in 2022.
