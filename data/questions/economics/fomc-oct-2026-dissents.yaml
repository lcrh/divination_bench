event_date: 2026-10-28
outcome_summary: >-
  The FOMC held the target range at 3.75%-4.00% by a 10-2 vote. The two
  dissenters were Governor Lisa D. Cook and Cleveland Fed President Beth M.
  Hammack, both preferring a 25 bp hike. Cook's dissent was the surprise: it
  was her first since joining the Board in 2022 and some commentators read it
  as linked to her legal fight with the Trump administration. Lorie Logan and
  Neel Kashkari, who had dissented hawkishly in July and were priced as likely
  dissenters, voted with the majority. The statement upgraded growth from
  "solid" to "strong", said inflation "remains elevated", and replaced
  forward-looking hike language with "the accumulation of more information
  will help the Committee determine the policy stance". Nobody dissented in
  favour of a cut. Warsh also announced that from 2027 one of the eight
  meetings will be a strategy-only meeting with no rate vote, and said
  politics played "no role" ahead of the midterms. Markets continued to price
  a December hike as likely.
resolved_answer: >-
  Hold at 3.75%-4.00% by a 10-2 vote; Governor Lisa Cook and Cleveland Fed
  President Beth Hammack dissented in favour of a 25 bp hike (Logan and
  Kashkari did not dissent).
