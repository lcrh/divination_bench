id: bank-of-canada-oct-2026-decision
domain: economics
title: Bank of Canada October 2026 rate decision
question: >-
  What will the Bank of Canada decide about its overnight policy rate, currently
  2.25%, at its announcement on 28 October 2026, and what will it signal about
  the path ahead?
question_type: open
resolution_criteria: >-
  Judged against the Bank of Canada's official 28 October 2026 press release
  and Monetary Policy Report. Core outcome: a 25 bp hike to 2.50%, its first
  change after seven holds and first hike since July 2023. Also check: the
  rationale (reducing the risk that elevated energy prices spill over into
  generalized inflation); cautious guidance that further hikes could be needed
  but the bank would "proceed carefully", meeting by meeting; the inflation
  forecast raised to about 3.5% by end-2026 and 3.1% in 2027 (from 2.0%);
  2026 growth raised to 1.0%; and the rate remaining below the neutral-range
  midpoint.
context_summary: >-
  The Bank of Canada has held its overnight rate at 2.25% for seven straight
  decisions, a level at the low end of its estimated neutral range. An oil
  price surge linked to the war involving Iran has pushed Canadian headline
  inflation back up: September CPI rose to 3.1% y/y from 3.0%, slightly better
  than forecasters expected and just above the 1%-3% target band, driven by a
  6.1% monthly jump in gasoline prices. Inflation excluding energy eased to
  2.2% and the bank's preferred core measures slipped to 1.9% and 1.8%. The
  labour market is weak: Canada lost 68,000 jobs in September and unemployment
  rose to 6.5%. Against that, the bank's consumer survey showed a sharp rise in
  long-term inflation expectations, and about half of firms plan to pass on
  war- and tariff-related cost increases. Governor Tiff Macklem sounded hawkish
  at the IMF meetings, saying that if oil stays near US$100 inflation will
  drift up and the bank must ask whether it needs to "raise interest rates to
  influence the path." Before the CPI release, swaps priced only about a 35%
  chance of a hike; afterwards, pricing jumped to around 80%. Economists were divided:
  in a Reuters poll of 21-23 October, 19 of 34 expected a 25 bp hike to 2.50%,
  a sharp reversal from the prior poll, when 80% expected a hold through 2026.
  Scotiabank, Desjardins and BMO called a hike; RBC, TD and Dominion Lending
  Centres called a hold, citing the weak economy and soft core inflation. On
  Polymarket, a 25 bp hike traded at about 83% and a hold at about 17% the day
  before the decision.
