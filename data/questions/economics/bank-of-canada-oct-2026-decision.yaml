event_date: 2026-10-28
outcome_summary: >-
  The Bank of Canada raised its overnight rate by 25 bp to 2.50%, its first
  rate change in a year and first hike since July 2023 (Bank Rate 2.75%,
  deposit rate 2.45%). Macklem said the increase was "needed to reduce the risk
  that elevated energy prices could spill over and become generalized
  inflation." Guidance was cautious: "There could be a need to increase the
  policy rate further, but given uncertainties, Governing Council agreed to
  proceed carefully," with decisions taken one meeting at a time. The bank
  raised its inflation outlook sharply, expecting CPI around 3.5% by end-2026
  and 3.1% in 2027 (from 2.0% in July), with a return to about 2% by mid-2028.
  It lifted 2026 growth to 1.0% (from 0.7%) and sees about 2% growth in 2027.
  Even after the hike, the rate sits below the 2.75% midpoint of the bank's
  neutral range. The next decision is 9 December. Forecasters who called a
  hold, including RBC, TD and Dominion Lending Centres, were wrong.
resolved_answer: >-
  The Bank of Canada raised its overnight rate 25 bp to 2.50%, its first hike
  since July 2023, citing the risk of energy-driven inflation spreading, and
  said further increases could be needed but it would proceed carefully.
