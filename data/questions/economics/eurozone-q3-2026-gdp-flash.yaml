  as_of: 2026-10-28
backup: true
notes: >-
  Polymarket daily prices from the CLOB price-history API. Outcome
  hinges on a one-tenth margin (1.3% vs the 1.1% consensus) and Irish data
  volatility, so it is noisier than the main questions.
