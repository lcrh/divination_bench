id: eurozone-q3-2026-gdp-flash
domain: economics
title: Euro area Q3 2026 GDP flash estimate (year-on-year)
question: >-
  What year-on-year growth rate will Eurostat's preliminary flash estimate,
  published on 30 October 2026, show for euro area GDP in the third quarter of
  2026?
question_type: multiple_choice
options:
  - "Below 0.0%"
  - "0.0% to 0.3%"
  - "0.4% to 0.7%"
  - "0.8% to 1.1%"
  - "1.2% to 1.5%"
  - "1.6% to 1.9%"
  - "2.0% or more"
resolution_criteria: >-
  Resolves to the bracket containing the seasonally adjusted euro area GDP
  growth rate versus the same quarter of the previous year, as published in
  Eurostat's preliminary flash estimate for Q3 2026 on 30 October 2026.
context_summary: >-
  The euro area economy has been buffeted in 2026 by an energy shock linked to
  the Middle East conflict, drought, rising inflation and higher interest
  rates; the ECB raised its policy rates in September. Quarterly growth has
  been volatile, largely because of Ireland: euro area GDP rose 0.6% q/q in
  Q2, but that figure was
  boosted by a 10.2% q/q jump in Irish GDP driven by multinational-dominated
  sectors; excluding Ireland, Q2 growth was about 0.3%. Year-on-year growth
  was 1.2% in Q2. For Q3 the consensus expects quarterly growth
  of about 0.2%, with Germany, France and Italy each at about 0.1% and Spain at
  0.6%. Continuum Economics expected about 0.3% q/q, and one bank's nowcast
  also pointed to 0.3%, with stable underlying momentum outside Ireland. Survey
  data were mixed: the services PMI rebounded to 53.0 in September and
  unemployment was steady at 6.4%, but industrial production stalled over the
  summer and consumer confidence weakened. On Polymarket on 28 October, the
  year-on-year "0.8%-1.1%" bracket traded at about 72%, "1.2%-1.5%" at about
  21% and "0.4%-0.7%" at about 5%.
context_sources:
  - url: https://continuumeconomics.com/a/b6ccf460/ez-q3-gdp-to-show-ongoing-resilience
    title: EZ Q3 GDP to Show Ongoing Resilience
    publisher: Continuum Economics
    published_date: 2026-10-29
    excerpt: "GDP is expected to grow 0.2% q/q in Q3 following a large quarterly gain of 0.6% in Q2, a figure that had been boosted by Ireland's significant expansion of 10.2% q/q... We expect Q3 growth to be a tad higher than consensus, possibly around 0.3% q/q."
  - url: https://www.fxstreet.com/analysis/q3-growth-in-advanced-economies-solid-despite-shocks-202610231047
    title: "Q3 growth in advanced economies: Solid despite shocks"
    publisher: FXStreet (bank research)
    published_date: 2026-10-23
    excerpt: "Our nowcast points to growth slowing to 0.3% in q/q, though the pace is stable excluding Ireland... The services PMI rebounded sharply in Q3 and sits firmly in expansion territory (53.0 in September)."
event_date: 2026-10-30
outcome_summary: >-
  Eurostat's preliminary flash estimate showed euro area GDP up 0.4% q/q in Q3
  2026, double the 0.2% Reuters-poll consensus, after 0.6% in Q2. Year-on-year
  growth was 1.3%, up from 1.2% in Q2, against expectations that it would cool
  to about 1.1%. EU GDP rose 0.5% q/q and 1.5% y/y. Ireland again led with
  +5.5% q/q, followed by Estonia, Spain and the Netherlands (+0.6% each).
  Germany grew 0.2%, Italy 0.0%, and France contracted 0.1%; Lithuania fell
  1.0%. The year-on-year rate fell in the "1.2%-1.5%" bracket, which
  Polymarket had priced at only about 21% two days before the release. The
  next estimate is due on 13 November 2026.
resolved_answer: "1.2% to 1.5%"
outcome_sources:
  - url: https://ec.europa.eu/eurostat/web/products-euro-indicators/w/2-30102026-ap
    title: GDP up by 0.4% in the euro area and by 0.5% in the EU
    publisher: Eurostat
    published_date: 2026-10-30
    excerpt: "Compared with the same quarter of the previous year, seasonally adjusted GDP increased by 1.3% in the euro area and by 1.5% in the EU in the third quarter of 2026, after +1.2% in the euro area and +1.4% in the EU in the previous quarter."
  - url: https://www.fxstreet.com/news/eurozone-gdp-expands-04-in-q3-beats-02-estimates-202610301002
    title: Eurozone GDP expands 0.4% in Q3, beats 0.2% estimates
    publisher: FXStreet
    published_date: 2026-10-30
    excerpt: "On an annualzied basis, the GDP growth rate remained unexpectedly stronger at 1.3%, while it was expected to cool down to 1.1% from the previous reading of 1.2%."
market:
  platform: polymarket
