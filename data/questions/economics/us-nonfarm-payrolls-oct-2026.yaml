event_date: 2026-11-06
outcome_summary: >-
  The BLS reported that nonfarm payrolls rose by 165,000 in October 2026,
  roughly 100,000 above consensus (Dow Jones 59,000; Reuters 65,000). Prior
  months were revised up by a combined 84,000: August to 186,000 and September
  to 60,000 from 29,000. Unemployment fell to 4.1% (expected 4.2%) as
  participation rose to 61.9%. Average hourly earnings rose 0.4% m/m and 3.1%
  y/y, both above forecasts. Private payrolls rose 159,000 (vs about 64,000
  expected), led by professional and business services (+70,000), healthcare
  (+42,000), transportation and warehousing (+25,000) and manufacturing
  (+19,000). A soft spot was a 339,000 jump in involuntary part-time work,
  which pushed the U-6 rate up to 7.9%. Treasury yields rose (2-year +6 bp to
  about 4.52%), and the market-implied odds of a December Fed hike rose to
  about 78% from 70%.
resolved_answer: "100,000 or more"
