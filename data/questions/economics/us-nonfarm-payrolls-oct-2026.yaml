id: us-nonfarm-payrolls-oct-2026
domain: economics
title: US October 2026 nonfarm payrolls
question: >-
  How many jobs will the US Bureau of Labor Statistics report were added to
  total nonfarm payrolls in October 2026, in its Employment Situation release
  of 6 November 2026?
question_type: multiple_choice
options:
  - "Fewer than -25,000"
  - "-25,000 to 0"
  - "0 to 25,000"
  - "25,000 to 50,000"
  - "50,000 to 75,000"
  - "75,000 to 100,000"
  - "100,000 or more"
resolution_criteria: >-
  Resolves to the bracket containing the headline seasonally adjusted change
  in total nonfarm payroll employment for October 2026 as first published by
  the BLS on 6 November 2026. A value exactly on a boundary resolves to the
  higher bracket.
context_summary: >-
  The US labour market has been sluggish through 2026. Payroll growth from
  January 2025 to September 2026 averaged about 35,000 a month, with seven
  months of outright losses and only one month above 200,000. The September
  report showed just 29,000 jobs against a 90,000 consensus, with
  downward revisions removing 60,000 jobs from July and August; the three-month
  average was about 51,000. Unemployment rose to 4.2% in September, though
  mainly because the labour force grew. The labour force has otherwise been
  shrinking, so economists argue small payroll gains are enough to keep
  unemployment steady. At the same time, the economy has been running hot in
  other respects: third-quarter GDP growth was expected near or above 3%,
  inflation has re-accelerated on an oil shock, and the Federal Reserve raised
  rates in September and held in October, keeping a December hike in play. Reuters noted payrolls tend to underperform when Labor
  Day falls late, as it did this year, which some saw as supporting a bounce in
  October. Ahead of the 6 November release, the Dow Jones consensus was for
  59,000 jobs (WSJ survey also 59,000; Reuters poll 65,000) with unemployment
  steady at 4.2% and average hourly earnings up 0.3% m/m. Kalshi's forecast was
  about 71,000. On Polymarket the day before the release, last-traded prices
  were about 27% for 25-50k, 23% for 50-75k, 17% for 75-100k and 31% for 100k
  or more.
