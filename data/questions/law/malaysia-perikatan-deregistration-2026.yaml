market: null
notes: >-
  No market. The question is framed as of about 14 October, after the High
  Court refused an interim stay. The New Straits Times reported the
  deregistration on the evening of 19 October; most outlets date it 20 October.
  This question is about a regulator and the courts, not about the Melaka vote
  result (polling is on 14 November, outside the window). The Straits Times
  headline says "after failed appeal", but the article describes PN's failed
  show-cause reply. The PN contest under component banners was floated by
  Takiyuddin (FMT, 20 Oct) but never happened.
