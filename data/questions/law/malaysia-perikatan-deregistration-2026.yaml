id: malaysia-perikatan-deregistration-2026
domain: law
title: Fate of Malaysia's opposition coalition Perikatan Nasional under a deregistration threat
question: >-
  Malaysia's Registrar of Societies (RoS) suspended the opposition coalition
  Perikatan Nasional (PN) and gave it 30 days to show cause why it should not
  be deregistered, just as a Melaka state election was called. What will
  happen to PN's legal status, and to its ability to contest the Melaka
  election under its own name and logo, by the end of October 2026?
question_type: open
options: null
resolution_criteria: >-
  Judged on events between 14 October and about 4 November 2026. The judge
  should check, first, whether the RoS actually deregistered PN, and when.
  Second, what the courts did: whether the High Court granted or refused a
  stay of the suspension or deregistration, and whether either side
  appealed. Third, whether PN was able to field candidates under its own name
  and logo at the Melaka nomination day on 31 October, or had to use a
  component party's banner or stay out. Predictions that get both the
  regulator's action and the court outcome right score best.
context_summary: >-
  Perikatan Nasional (PN) is Malaysia's main opposition coalition. Its
  components include PAS, Gerakan, MIPP, Wawasan and Pejuang; PN
  secretary-general Takiyuddin Hassan is also PAS's secretary-general. In
  August 2026 one component, Bersatu, complained to the Registrar of Societies
  (RoS) that it had been excluded from a 16 July PN Supreme Council meeting
  and raised its membership status. On 22 September the RoS issued a notice
  under the Societies Act 1966 giving PN 30 days to explain why its
  registration should not be cancelled, saying PN had breached Clause 7.1 of
  its constitution. On 23 September it suspended all PN activities except
  responding to the notice. The notices coincided with the dissolution of the
  Melaka state assembly ahead of a snap election, with nomination day on
  31 October and polling on 14 November. The suspension barred PN from
  meeting, issuing statements, campaigning or using its name and symbol. PN
  alleged possible bad faith and, on 5 October, filed for judicial review
  against the RoS director-general and Home Minister Saifuddin Nasution
  Ismail. It argued it had not been heard or shown Bersatu's complaint.
  Federal counsel called the challenge premature because the RoS had not yet
  made a final decision. On 13 October High Court judge Azizan Md Arshad
  granted leave for judicial review but refused an immediate interim stay,
  leaving the suspension in force. He set 22 October for a full hearing on a
  stay. PN said it was racing against time before nomination day.
