    title: RoS suspends Perikatan activities, issues show-cause notice over Bersatu complaint
    publisher: Malay Mail
    published_date: 2026-09-24
    excerpt: "The notice, issued under Subsection 13(2) of the Societies Act 1966, requires PN to address concerns within 30 days or face deregistration... both notices were served on consecutive days on September 22 and 23, directly coinciding with the announcement and dissolution of the Melaka State Legislative Assembly."
  - url: https://www.thestar.com.my/news/nation/2026/10/13/high-court-grants-perikatan-leave-to-challenge-ros-suspension-order
    title: High Court grants Perikatan leave to challenge Registrar of Societies suspension order
    publisher: The Star
    published_date: 2026-10-13
    excerpt: "Justice Azizan Md Arshad also did not allow an interim stay of execution of the suspension pending the substantive hearing of the judicial review against the ROS. The judge, however, fixed Oct 22 to hear an inter-parte stay application."
event_date: 2026-10-20
outcome_summary: >-
  PN replied to the RoS on 12 October. On 20 October (announced late on
  19-20 October), two days before the 30-day window would have lapsed, the
  RoS cancelled PN's registration under subparagraph 13(1)(c)(iv) of the
  Societies Act. It said PN's explanation failed to refute the grounds,
  chiefly the exclusion of Bersatu in breach of Clause 7.1. PN considered an
  appeal to the home minister and said it might contest under a component
  party's banner. On 22 October, however, the High Court (Judge Azizan Md
  Arshad) granted PN's stay application, freezing both the suspension and the
  deregistration pending its judicial review. That let PN resume activities
  and contest Melaka under its own name and logo. On 23 October the RoS
  director-general and Home Minister appealed the stay to the Court of Appeal.
  The appellate court twice postponed case management because the appellants
  had not finished filing, so the stay stayed in force and PN fielded
  candidates under its own logo on nomination day, 31 October. On 4 November
  the Court of Appeal fixed 22 February 2027 to hear the RoS appeal. The High
  Court set the judicial review hearing for 7 December 2026.
resolved_answer: >-
  The RoS deregistered PN on 20 October 2026, but on 22 October the High Court
  stayed the deregistration and suspension pending judicial review. The
  government's appeal was not heard in time (it is set for February 2027), so
  PN contested the Melaka election under its own name and logo at the
  31 October nomination.
