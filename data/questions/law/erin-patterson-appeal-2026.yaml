event_date: 2026-10-30
outcome_summary: >-
  On 30 October 2026 the Court of Appeal dismissed Patterson's conviction
  appeal. It granted leave on two grounds but rejected them, and rejected all
  seven grounds overall. On the hotel issue, McLeish said there was "only
  conjecture, guesswork, or surmise" against the jury keeper's assurance of
  no contact. The court then upheld the DPP's sentence appeal, set aside the
  33-year non-parole period as inadequate, and resentenced her to life
  imprisonment with no non-parole period, meaning she will die in prison. The
  judges called the offending "extraordinarily cold and calculated" and "a
  case of such shocking criminality that it is inappropriate to fix a
  non-parole period". They noted she had planned to kill all four guests for
  nearly three weeks. It was among the harshest penalties in Victorian legal
  history. Patterson, 52, watched by video link from the Dame Phyllis Frost
  Centre. Her only remaining avenue is a special leave application to the
  High Court of Australia, due within 28 days.
resolved_answer: "Conviction appeal dismissed; sentence increased (non-parole period lengthened or removed)"
