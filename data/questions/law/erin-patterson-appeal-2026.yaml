id: erin-patterson-appeal-2026
domain: law
title: Outcome of Erin Patterson's mushroom-murder appeals in Victoria's Court of Appeal
question: >-
  How will Victoria's Court of Appeal rule on 30 October 2026 on Erin
  Patterson's appeal against her murder convictions and the prosecution's
  appeal against her sentence?
question_type: multiple_choice
options:
  - "Convictions quashed and acquittal entered"
  - "Convictions quashed and a retrial ordered"
  - "Conviction appeal dismissed; sentence left unchanged (life with 33-year non-parole period)"
  - "Conviction appeal dismissed; sentence increased (non-parole period lengthened or removed)"
resolution_criteria: >-
  Resolves according to the orders of the Court of Appeal of the Supreme
  Court of Victoria handed down on 30 October 2026 in both the conviction
  appeal and the Director of Public Prosecutions' sentence appeal.
context_summary: >-
  In July 2025 a Supreme Court of Victoria jury, sitting in Morwell, found
  Erin Patterson guilty of murdering her former in-laws Don and Gail
  Patterson and Gail's sister Heather Wilkinson, and of attempting to murder
  Heather's husband Ian. She had served them beef Wellingtons laced with
  death cap mushrooms at her Leongatha home in July 2023. In September 2025
  Justice Christopher Beale sentenced her to life with a 33-year non-parole
  period, so she could be released around 2056. He gave her a chance of
  parole partly because of her harsh, near-solitary conditions as a
  notorious prisoner. At a two-day Court of Appeal hearing in August 2026
  (Justices Lesley Taylor, Stephen McLeish and Peter Kidd), her barrister
  Richard Edney argued seven grounds. The main ground was a "catastrophic"
  accommodation mix-up: the sequestered jury had stayed in the same hotel as
  the lead police detective, prosecution solicitors and media. He also argued
  that the Crown's five-day cross-examination was unfair and oppressive and
  that its closing address changed its case on motive. He sought a retrial.
  Director of Public Prosecutions Brendan Kissane KC said letters confirmed
  there was no contact between jurors and others at the hotel. He also
  cross-appealed, saying the sentence was manifestly inadequate and Patterson
  should never be eligible for parole because the murders were in the
  "worst category". The court reserved judgment and on 28 October announced
  it would rule at 10am AEDT on Friday 30 October.
