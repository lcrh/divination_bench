event_date: 2026-11-06
outcome_summary: >-
  On 6 November 2026 the three-judge panel acquitted Lissu of treason. It
  found the prosecution had failed to prove he intended to intimidate or
  overthrow the government. However, it convicted him of incitement, a lesser
  offence, holding that his "No Reforms, No Election" slogan and remarks
  incited the public to disrupt the 2025 elections. He was sentenced to four
  years in prison; he had already spent about 19 months in detention. Lissu
  told the judges they had "manufactured" an offence he was never charged
  with, "on political directives". He said he would seek bail, now possible
  because the conviction was not for treason, and he has leave to appeal to
  the Court of Appeal. If the sentence stands it would bar him from the 2030
  elections. Human Rights Watch and other groups condemned the conviction.
resolved_answer: "Acquitted of treason but convicted of a lesser offence"
