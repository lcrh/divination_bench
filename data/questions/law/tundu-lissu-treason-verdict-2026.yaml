id: tundu-lissu-treason-verdict-2026
domain: law
title: Verdict in Tanzanian opposition leader Tundu Lissu's treason trial
question: >-
  What will Tanzania's High Court decide when it delivers judgment in the
  treason trial of opposition leader Tundu Lissu, scheduled for 6 November
  2026?
question_type: multiple_choice
options:
  - "Convicted of treason"
  - "Acquitted of treason but convicted of a lesser offence"
  - "Acquitted and freed"
  - "Judgment postponed or case otherwise not decided on 6 November"
resolution_criteria: >-
  Resolves according to the judgment delivered by the three-judge High Court
  panel (Dar es Salaam Sub-Registry) on 6 November 2026, as reported by major
  news outlets.
context_summary: >-
  Tundu Lissu, 58, chairman of Tanzania's main opposition party Chadema and a
  former presidential candidate, was arrested on 9 April 2025. This followed a
  3 April 2025 rally in Dar es Salaam launching the campaign "No Reforms, No
  Election". He was charged with treason under Section 39(2)(d) of the Penal
  Code ("showing intent to threaten the government") for allegedly urging the
  public to prevent the October 2025 general election. Treason carries a
  possible death sentence and is not bailable, so he had been held without
  bail ever since. Chadema was shut out of the 2025 election, which President
  Samia Suluhu Hassan's government won amid deadly protests and international
  criticism. Lissu represented himself, saying he had been denied private
  access to his lawyers, and called the case politically motivated. In August
  2026 the court ruled he had a case to answer. The prosecution called 17
  witnesses and the defence 5; Lissu said senior police and military chiefs
  declined to testify for him. Closing submissions ran from 23 to 29
  September. Presiding Judge Dunstan Ndunguru, sitting with Justices James
  Karayemaha and Ferdinand Kiwonde, set judgment for 6 November. He cited the
  volume of evidence and the fact that the charge provision was being
  considered for the first time. Rights groups and the US, which was
  reviewing ties with Tanzania, were watching closely.
