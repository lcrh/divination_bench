id: somalia-supreme-court-term-ruling-2026
domain: law
title: Will Somalia's Supreme Court rule that President Hassan Sheikh Mohamud's term has expired?
question: >-
  Will Somalia's Supreme Court, before 1 December 2026, rule that President
  Hassan Sheikh Mohamud's constitutional term has already expired, meaning
  the 2026 constitutional amendments do not extend his mandate to 2027?
question_type: binary
options: ["Yes", "No"]
resolution_criteria: >-
  Resolves Yes if, between 4 November and 30 November 2026, Somalia's Supreme
  Court (acting as constitutional court) issues a ruling holding that the
  President's term ended in 2026 or that the five-year term extension does
  not apply to him. Resolves No if the court upholds the extension, dismisses
  the petition entirely, or issues no such ruling in that period.
context_summary: >-
  In March 2026 Somalia's federal parliament approved a revised constitution,
  which President Hassan Sheikh Mohamud signed on 8 March. It lengthened
  presidential and parliamentary terms from four to five years. The
  government said this let Mohamud, whose four-year term began in May 2022,
  stay until May 2027, and it was pursuing elections under its own control.
  Opposition leaders said his mandate had expired in May 2026. The opposition
  and several federal member states denounced the constitutional process as
  unilateral. In October former president Sharif Sheikh Ahmed petitioned the
  Supreme Court, which has constitutional-court powers until a Constitutional
  Court exists, to overturn the amendments and the decisions taken under
  them. The court took up the petition and ordered the government to submit
  its defence. Under Chief Justice Bashe Yusuf Ahmed the court had recently
  shown independence by ordering a rerun of Galmudug's regional elections. On
  4 November Mohamud abruptly dismissed Bashe, citing unspecified complaints
  from judges and legal professionals. He reinstated Ibrahim Idle Suleiman, a
  former chief justice who was a ruling-party member, close associate and
  former legal adviser to the president. The 2026 constitution requires the
  Supreme Judicial Council and both houses of parliament to approve such a
  removal, and the presidency cited neither. Critics said the move was meant
  to forestall an imminent adverse ruling, and it was unclear whether the
  court would rule, or whether Suleiman would take control first.
