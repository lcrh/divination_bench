event_date: 2026-11-05
outcome_summary: >-
  Yes. On 5 November 2026, a day after the dismissal, the Supreme Court first
  declared Bashe's removal "null and void" as an attempt to obstruct the
  case. Its five-judge Constitutional Division, chaired by Justice Salah
  Sheikh Ibrahim Dhiblawe, then ruled on Sharif's petition. It dismissed his
  challenge to the amendment process for lack of standing. But it held that
  longer terms could apply to sitting officeholders only if the constitution
  said so explicitly, and the text was silent. The terms of both houses of
  parliament and the government therefore expired on 14 April 2026, and
  Mohamud's on 15 May 2026. Acts taken under their powers after those dates
  were declared "unconstitutional, unlawful and null and void". The
  government may act only as a caretaker handling routine affairs. The court
  gave stakeholders 30 days to agree an electoral framework and ordered
  elections within 90 days. Security forces were reported at the court, and
  the judges reportedly sheltered at Sharif's home. By the next day the
  presidency had not responded.
resolved_answer: "Yes"
