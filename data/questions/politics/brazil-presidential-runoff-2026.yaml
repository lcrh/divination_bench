event_date: 2026-10-25
outcome_summary: >-
  Lula won the runoff in a come-from-behind victory. With 100% of ballots
  counted, the TSE reported Lula 51.79% (64,256,232 votes) to Flávio
  Bolsonaro's 48.21% (59,826,041), a margin of about 4.43 million votes (3.58
  points). Turnout was about 80.8%. Lula became the first president since the
  return to civilian rule in 1985 to win after losing the first round, and the
  first Brazilian to secure a fourth term (to 2030). The count was tense: at one
  point the official tally had Flávio narrowly ahead before Lula overtook him.
  Flávio Bolsonaro refused to recognise the result and called for it to be
  annulled; TSE president Kássio Nunes Marques (a Jair Bolsonaro appointee)
  confirmed Lula's victory. World leaders congratulated Lula. The result was a
  major upset relative to prediction markets, which had Flávio at roughly
  75-80% until election day.
resolved_answer: Luiz Inácio Lula da Silva
