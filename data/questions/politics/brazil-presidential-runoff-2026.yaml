id: brazil-presidential-runoff-2026
domain: politics
title: Brazil presidential runoff, 25 October 2026 (Lula vs Flávio Bolsonaro)
question: >-
  Who will win Brazil's presidential runoff election on 25 October 2026 between
  incumbent President Luiz Inácio Lula da Silva and Senator Flávio Bolsonaro?
question_type: multiple_choice
options: ["Luiz Inácio Lula da Silva", "Flávio Bolsonaro"]
resolution_criteria: >-
  Resolves to the candidate declared winner of the 25 October 2026 second round
  by Brazil's Superior Electoral Court (TSE), based on valid votes.
context_summary: >-
  Brazil held the first round of its 2026 presidential election on 4 October.
  In a result that both pollsters and prediction markets had failed to
  anticipate, Senator Flávio Bolsonaro of the Liberal Party (PL), eldest son of
  the convicted and ineligible former president Jair Bolsonaro, finished first
  with about 47.0% of valid votes, ahead of the left-wing incumbent Luiz Inácio
  Lula da Silva (Workers' Party, PT) on about 45.2%. Because nobody passed 50%,
  the two met in a runoff on 25 October. Flávio collected endorsements from
  most right-wing and centre-right figures, giving him an apparent advantage in
  consolidating eliminated candidates' voters. Lula, 80, was seeking a record
  fourth term; no Brazilian president since 1985 had won after trailing in the
  first round. Around 33 million registered voters abstained in round one, and
  Lula's campaign focused on turnout. Final-week polls showed a statistical tie
  with Flávio marginally ahead: Quaest (released 21 Oct, after a televised
  debate) had Flávio 45%, Lula 44% (valid votes 50.6% to 49.4%); Datafolha (22
  Oct) had 47% to 46%, a 50-50 tie in valid votes; PoderData 51-49 and
  RealTime Big Data 52-48 in valid votes for Flávio. Prediction markets were far
  more confident than polls: after the first round Kalshi and Polymarket gave
  Flávio roughly 78-80% and Lula about 20-25%.
