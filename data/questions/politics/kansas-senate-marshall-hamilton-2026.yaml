id: kansas-senate-marshall-hamilton-2026
domain: politics
title: Kansas US Senate race 2026 — Roger Marshall vs Adam Hamilton
question: >-
  Will incumbent Republican Senator Roger Marshall win re-election in Kansas on
  3 November 2026 against Democrat Adam Hamilton?
question_type: binary
options: ["Yes", "No"]
resolution_criteria: >-
  Resolves Yes if Roger Marshall wins the 3 November 2026 Kansas US Senate
  general election per official results / AP call; No if Adam Hamilton (or
  anyone else) wins.
context_summary: >-
  Republican Roger Marshall, a physician first elected to the Senate in 2020
  after representing Kansas in the House since 2017, sought a second term
  against Democrat Adam Hamilton, 62, the founding pastor of the largest United
  Methodist church in the US and a well-known author with wide name
  recognition. Kansas had not elected a Democrat to the US Senate since 1932.
  Hamilton ran on an affordability agenda; Marshall faced criticism over
  reports that his former medical practice had sued hundreds of patients over
  unpaid bills. The national environment was poor for Republicans, with
  Trump's approval in Kansas at 45% in one poll. Polls showed a tight race:
  Free State Research (5–10 Oct) had Hamilton 47%, Marshall 43%; InsiderAdvantage
  in early October had Hamilton 47.5 to 46.7; Emerson's final poll (26–28 Oct)
  had Hamilton 49-45 with Libertarian David Graham at 3%, and early voters
  breaking heavily for Hamilton while Election Day voters leaned Marshall.
  Kalshi traders still favoured Marshall at 60% to Hamilton's 40% on 28
  October (Hamilton had been 17% in early September), with a margin forecast
  of Marshall +1.3; Kalshi also gave Democrats 64% to win the Senate overall.
