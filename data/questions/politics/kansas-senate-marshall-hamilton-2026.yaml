event_date: 2026-11-03
outcome_summary: >-
  Adam Hamilton defeated Roger Marshall, becoming the first Democrat elected
  to the US Senate from Kansas since 1932. Results (~99% counted): Hamilton (D)
  561,148 votes (51.0%), Marshall (R) 505,559 (46.0%), Libertarian David Graham
  33,396 (3.0%) — a margin of about 55,600 votes (5 points). Decision Desk HQ
  called it at 10:48 pm ET and AP at 11:24 pm ET on election night. Hamilton's
  early lead in the count (27.9 points at 35% counted) narrowed steadily as
  Election Day votes were tallied, but held. The 5-point margin was slightly
  larger than final polls such as Emerson's (+4). Hamilton gave a
  sermon-style victory speech in Overland Park. The flip was one of several
  Democratic Senate upsets (with Texas and South Carolina) that helped
  Democrats win control of the Senate.
resolved_answer: "No"
