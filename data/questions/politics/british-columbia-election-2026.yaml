id: british-columbia-election-2026
domain: politics
title: Outcome of British Columbia's 24 October 2026 snap provincial election
question: >-
  What will be the outcome of British Columbia's snap provincial general
  election on 24 October 2026? Which party will form government, with roughly
  how many of the 93 seats, and what will happen to Premier David Eby?
question_type: open
resolution_criteria: >-
  Judged against Elections BC results (election-night preliminary count and the
  final count completed in early November): seat totals per party, whether a
  majority (47+ seats) was won, popular vote shares, and the immediate fate of
  the party leaders.
context_summary: >-
  Premier David Eby of the BC New Democratic Party, who held a slim
  legislative majority after the 2024 election, advised the lieutenant
  governor to dissolve the legislature on 22 September 2026, two years before
  the fixed election date. The call came two days after Conservative leader
  Kerry-Lynne Findlay resigned amid party turmoil and defections; her
  predecessor John Rustad had quit in December 2025. Observers widely
  criticised the snap call as opportunistic. The Conservatives largely united
  behind newly appointed interim leader Lorne Doerkson, a little-known MLA.
  Splinter parties OneBC (Dallas Brodie) and CentreBC (Elenore Sturko), led by
  ex-Conservative MLAs, also ran, and the BC Greens were led by Emily Lowan.
  Key issues: cost of living, housing, US tariffs, public safety, DRIPA and
  government spending. Polls in September showed the NDP ahead, but the
  Conservatives moved into a consistent lead during the campaign. Final polls
  had the Conservatives at 44% vs NDP 39% and Greens 12-13% (Ipsos, Léger,
  Research Co.), with Mainstreet and Pallas at +6 and Angus Reid at +3. Ipsos
  said Doerkson was "a solid favourite" though margins left room for doubt;
  Eby still led as preferred premier (30% vs 23%). The 338-style polling model
  at Canadian Polling projected an average of 57 Conservative seats (range
  46-68), NDP 34 (23-45) and Greens about 2.
