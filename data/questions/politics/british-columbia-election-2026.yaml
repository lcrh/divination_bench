event_date: 2026-10-24
outcome_summary: >-
  The BC Conservatives won a majority government, their first since 1928 and
  the first time in Canadian history a party under an interim leader won an
  election. Election night: Conservatives 63, NDP 28, Greens 2. After the final
  count (completed 6 November) the Conservatives gained one seat: final
  result Conservatives 64 seats (47.97%, 909,153 votes), NDP 27 (37.35%),
  Greens 2 (11.12%); OneBC and CentreBC won no seats and their leaders Brodie
  and Sturko lost by large margins. The NDP suffered its worst result since
  2001, ending nine years in government. Eby held his Vancouver–Point Grey
  seat by only 667 votes but resigned as NDP leader on election night. Lorne
  Doerkson won Cariboo-Chilcotin with 76.7% and became premier-designate;
  Green leader Emily Lowan won Saanich North and the Islands.
resolved_answer: >-
  Conservative majority under interim leader Lorne Doerkson: 63 seats on
  election night, 64 of 93 after the final count (NDP 27, Greens 2; ~48% vs
  ~37% of the vote). Eby kept his seat narrowly but resigned as NDP leader.
