event_date: 2026-10-11
outcome_summary: >-
  On 11 October 2026 President Zardari, on Prime Minister Shehbaz Sharif's
  advice, proclaimed an emergency (Article 232) and governor's rule (Article
  234) in KP. The PTI provincial government was suspended, and Afridi and his
  ministers ceased to hold office. Governor Kundi took charge with an
  11-member technocratic advisory council, initially for six months. The
  Interior Ministry authorised the army to deploy in aid of civil power
  (Article 245). Afridi was taken into "preventive custody" that day, along
  with cabinet members, assembly speaker Babar Saleem Swati and MNA Junaid
  Akbar. Police said 278 PTI members were detained, and Khan's three sisters
  were reportedly also held. The PTI called 11 October a "black day", vowed to
  continue the march and on 14 October challenged the proclamation in the
  Peshawar High Court. Both houses of Parliament endorsed the emergency on
  14 October, and a joint sitting approved the emergency and governor's rule on
  15 October amid opposition protest.
resolved_answer: >-
  On 11 October Islamabad imposed an emergency and governor's rule in KP,
  suspending the PTI government. It put Governor Kundi and an appointed
  advisory council in charge, deployed the army, and detained Afridi, his
  ministers and about 278 PTI members. Parliament endorsed the measures on
  14-15 October, and the PTI challenged them in court.
