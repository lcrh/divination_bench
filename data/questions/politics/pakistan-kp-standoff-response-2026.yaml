notes: >-
  No market. The context is fair rather than neutral: officials openly floated
  governor's rule, so the main uncertainty was whether and when Islamabad would
  act, and how harshly (the detention of the chief minister himself was not
  widely forecast). The advisory council, Article 245 army deployment and
  six-month horizon come from The News (11 Oct). The detention of Khan's
  sisters comes from The National (13 Oct, citing Reuters). The Express
  Tribune and Pakistan Today excerpts were captured via the search tool
  because direct page fetches timed out.
