event_date: 2026-10-05
outcome_summary: >-
  The PQ won but fell short of a majority, forming a minority government.
  Élections Québec results: PQ 60 seats (28.02% of the vote), Quebec Liberal
  Party 39 (official opposition), Conservative Party of Quebec 19 (its first
  seats, earning official party status), Québec solidaire 9, and the
  outgoing CAQ zero seats. Turnout was 66.93%. Popular vote was roughly PQ 28%,
  PLQ 24%, PCQ 21%, CAQ 13%, QS 12%, close to Léger's final poll. St-Pierre
  Plamondon became premier, the PQ's first return to power since 2012–14,
  pledged to be "premier for all Quebecers" and to work with other parties on
  the budget, while maintaining his referendum commitment (which in a
  minority legislature needs another party's votes).
resolved_answer: "No"
