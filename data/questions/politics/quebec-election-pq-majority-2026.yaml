id: quebec-election-pq-majority-2026
domain: politics
title: Quebec general election 2026 — will the Parti Québécois win a majority?
question: >-
  Will the Parti Québécois win a majority (at least 64 of 127 seats) in
  Quebec's general election on 5 October 2026?
question_type: binary
options: ["Yes", "No"]
resolution_criteria: >-
  Resolves Yes if the Parti Québécois wins 64 or more of the 127 seats in the
  National Assembly according to Élections Québec results; No otherwise.
context_summary: >-
  Quebec voted on 5 October 2026 for its 127-seat National Assembly (64 for a
  majority). The Coalition Avenir Québec, in power since 2018 and now led by
  Christine Fréchette, collapsed during the 39-day campaign from about 24% to
  14% according to Léger, and 77% of Quebecers said they wanted a change of
  government. The sovereigntist Parti Québécois under Paul St-Pierre
  Plamondon had led polls for about three years and won four consecutive
  by-elections; he promised another referendum on independence. Léger's final
  poll (fieldwork 30 Sept–1 Oct, published 3 Oct) had the PQ at 29%, the
  Liberals under Charles Milliard at 25%, Éric Duhaime's Conservatives at 20%,
  the CAQ at 14% and Québec solidaire at 11%; among francophones the PQ led by
  16 points. Jean-Marc Léger called it the tightest election he had ever
  measured. With the vote split five ways, the seat outcome was highly
  uncertain: the Qc125 model put the PQ between 52 and 73 seats with a 38%
  chance of a majority, and Poliwave put the chance at 49%. The Conservatives,
  projected at 11-26 seats, sought the balance of power and opposed a third
  referendum.
