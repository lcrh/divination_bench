event_date: 2026-10-27
outcome_summary: >-
  No bloc won a majority, but Likud outperformed the polls to finish clearly
  first. Final official results (turnout ~78%, the highest in decades): Likud
  27 seats (20.5%), Yashar! 21, Together (Bennett) 12, Joint List 11, Democrats
  8, Ra'am 8, Yisrael Beiteinu 7, Jewish Power 7, United Torah Judaism 7, Shas
  6, Religious Zionism–Zehut 6. The Hendel–Zelekha Reservists list (2.7%) and
  Ofer Winter's People of Israel (1.7%) missed the threshold. Netanyahu's bloc
  won 53 seats (down from 68 at its peak), Eisenkot's bloc 48, and Arab-led
  parties a record 19, making them pivotal. Likud alleged Qatari interference
  and fraud; the Central Elections Committee certified the results on 4
  November after finding no irregularities that changed the outcome. Despite
  Likud being largest, President Herzog gave the first mandate to form a
  government to Eisenkot (backed by 67 MKs' recommendations vs 46 for
  Netanyahu), with 28 days plus a possible 14-day extension.
resolved_answer: >-
  Hung Knesset: Likud largest party with 27 seats (Yashar! 21, Together 12);
  Netanyahu's bloc 53, Eisenkot's bloc 48, Arab-led parties a record 19; no bloc
  reached 61. Herzog then gave Eisenkot the first mandate.
