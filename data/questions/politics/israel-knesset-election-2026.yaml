id: israel-knesset-election-2026
domain: politics
title: Outcome of Israel's 27 October 2026 Knesset election
question: >-
  What will be the outcome of Israel's legislative election on 27 October 2026?
  Which party will be largest, how many seats will Benjamin Netanyahu's bloc and
  Gadi Eisenkot's opposition bloc win, and will either reach a 61-seat majority?
question_type: open
resolution_criteria: >-
  Judged against the final official results certified by Israel's Central
  Elections Committee for the 26th Knesset (party seat totals and bloc
  arithmetic), plus the immediate post-election developments (e.g. who receives
  the first mandate to form a government).
context_summary: >-
  Israelis voted on 27 October 2026 for the 26th Knesset (120 seats, 61 needed
  for a majority, 3.25% threshold). Prime Minister Benjamin Netanyahu's Likud
  led a bloc with Jewish Power (Ben-Gvir), Religious Zionism–Zehut (Smotrich),
  Shas and United Torah Judaism; his coalition had controlled up to 68 seats in
  the outgoing Knesset. The main challenger was former IDF chief of staff Gadi
  Eisenkot, whose new Yashar! party headed a "change" bloc including Naftali
  Bennett's Together (B'Yachad), Avigdor Lieberman's Yisrael Beiteinu and Yair
  Golan's Democrats. Arab-led lists (the Hadash–Ta'al–Balad Joint List and
  Ra'am) were outside both blocs; most Jewish opposition parties pledged not to
  govern with them. Several small lists (Ofer Winter's People of Israel, the
  Hendel–Zelekha Reservists/Economic list) hovered near the threshold. US
  President Trump endorsed Netanyahu during the campaign. In the last legal
  polls (published Friday 23 October), Channel 12 and KAN both had Yashar
  first with 22 seats, Likud second with 20 and Bennett on 14, with
  Eisenkot's bloc at 52 and Netanyahu's at 50; Maariv had 54 vs 48 and Channel
  13 54 vs 50, with Arab parties around 14. A Times of Israel poll had the two
  blocs tied at 51. The To 120 forecast gave Netanyahu's bloc ~54 expected
  seats and only ~5% chance of 61+. Prediction markets mostly favoured
  Eisenkot to become the next prime minister.
