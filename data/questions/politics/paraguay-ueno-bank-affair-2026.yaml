event_date: 2026-11-06
outcome_summary: >-
  Ueno collapsed within a week. On Tuesday 3 November the central bank put it
  into resolution, the regulator's strongest step short of immediate
  liquidation, after finding that it had breached minimum solvency
  requirements. The
  accounts of nearly 3 million customers were frozen while they were moved to
  other banks. Central bank president Carlos Carvallo resigned on 3 November.
  Prosecutors issued arrest warrants for eight ueno executives, and protesters
  demanded Peña's resignation. On Thursday 5 November Peña announced his
  resignation, just as the lower house voted to open an impeachment trial. A
  special session called to handle the resignation was adjourned in favour of
  continuing with impeachment. On Friday 6 November the Senate removed him from office, and
  Vice President Pedro Alliana, against whom the Colorado Party had dropped
  impeachment proceedings, was sworn in as president. Peña was arrested. On
  7 November prosecutors charged him with breach of trust and administration
  for personal gain, and a judge ordered pretrial detention at a military
  facility. Carvallo was also charged and detained. By 7 November about
  $160 million had been paid to some 1.2 million savers under the deposit
  guarantee. Reuters called it Paraguay's deepest political crisis in more
  than a decade.
resolved_answer: >-
  Ueno was put into resolution on 3 November 2026 and millions of accounts were
  frozen. Central bank chief Carvallo resigned. President Peña tried to resign
  on 5 November, but the Senate impeached and removed him on 6 November and
  Vice President Pedro Alliana took over. Peña was then arrested, charged and
  held in pretrial detention.
