id: paraguay-ueno-bank-affair-2026
domain: politics
title: How Paraguay's ueno bank affair plays out in early November 2026
question: >-
  In October 2026 Paraguay's fast-growing digital bank ueno, which has
  political ties to President Santiago Peña and to the central bank's
  president, came under regulatory scrutiny over loans to related companies.
  What will happen with the ueno affair by 7 November 2026, for the bank
  itself, for the central bank's leadership and for President Peña?
question_type: open
options: null
resolution_criteria: >-
  Judged on events up to 7 November 2026. The judge should check three things.
  First, ueno's fate: whether it recapitalised and carried on, was put under
  intervention or resolution, or failed, and whether customers' accounts were
  frozen. Second, whether central bank president Carlos Carvallo stayed or
  left. Third, President Peña's political fate: whether he stayed in office,
  faced impeachment, resigned or was removed, and whether he faced criminal
  proceedings. A prediction scores well if it gets the scale right (a contained
  regulatory episode versus a bank collapse and a presidential crisis) and the
  key outcomes for Peña.
context_summary: >-
  Ueno, launched in 2021 by Paraguay's Grupo Vázquez, had grown from a niche
  fintech into one of the country's four domestic systemically important
  banks. It said it had about 3 million customers, in a country of 6.5
  million people, and managed roughly $800-850 million in public funds,
  including pension-related money. In 2026 leaked regulatory documents
  suggested excessive lending to companies linked to Grupo Vázquez, and the
  central bank opened a preliminary administrative proceeding, which ueno said
  was not a finding of wrongdoing. The case was politically sensitive. Central
  bank president Carlos Carvallo had been ueno's president until August 2023,
  though the central bank said he had recused himself. President Santiago
  Peña, an economist elected in 2023 for the ruling Colorado Party, had been a
  business partner of Grupo Vázquez until March 2025. In October, senators from
  both the ruling party and the opposition demanded that the central bank's
  leadership be replaced, and the banking association called the central
  bank's report to the Senate "incomplete". Peña refused to change the central
  bank leadership, citing its autonomy, and called the affair the "overflow" of
  a technical matter into politics. On 16 October Fitch kept ueno's rating at
  'BB' but moved the outlook to negative, citing rapid balance-sheet growth and
  high intangible assets that left limited capital headroom. Ueno's 2031
  global bonds fell to about 87 cents on the dollar, and a board member
  promised good news on a capital injection "in the coming days". Paraguay
  had recently won investment-grade ratings, and authorities repeatedly tried
  to calm markets. An internal Colorado Party contest over the 2028
  presidential nomination added to the pressure.
