notes: >-
  No market. The question is framed as of about 31 October, before the
  resolution. The La República piece is dated 31 October but appears to
  reprint an interview from about a week earlier ("Fitch last week").
  Wikipedia's Current events portal says the Senate vote to remove Peña was
  unanimous (AFP) and that he was placed under house arrest (UPI) before the
  pretrial detention order. Reuters (8 Nov) reports detention at a military
  facility. The BBC article's date (5 Nov) is inferred from its "3 days ago"
  stamp on 8 Nov.
