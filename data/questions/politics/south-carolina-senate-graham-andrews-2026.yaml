event_date: 2026-11-03
outcome_summary: >-
  Annie Andrews won in what USA Today called arguably the biggest upset of the
  2026 midterms. Results (99% counted): Andrews (D) 1,043,719 votes (51.1%),
  Darline Graham (R) 951,904 (46.6%), Libertarian Kasie Whitener 1.2%,
  Constitution Party's Mark Hackett 0.8% — a margin of about 91,800 votes
  (~4.5 points). Decision Desk HQ and NBC called the race less than three
  hours after polls closed. Andrews became the first Democrat elected to the
  Senate from South Carolina since 1998, flipping the seat. The loss was a
  blow to Trump, who had thrown his full weight behind Graham; it formed part
  of a Democratic wave that won control of both chambers of Congress.
resolved_answer: "No"
