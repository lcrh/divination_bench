id: south-carolina-senate-graham-andrews-2026
domain: politics
title: South Carolina US Senate race 2026 — Darline Graham vs Annie Andrews
question: >-
  Will incumbent Republican Senator Darline Graham win the US Senate election in
  South Carolina on 3 November 2026 against Democrat Annie Andrews?
question_type: binary
options: ["Yes", "No"]
resolution_criteria: >-
  Resolves Yes if Darline Graham wins the 3 November 2026 South Carolina US
  Senate general election per official results / major-network calls; No if
  Annie Andrews (or anyone else) wins.
context_summary: >-
  After Senator Lindsey Graham's sudden death in July 2026, his sister Darline
  Graham (also known as Darline Graham Nordone) was appointed to serve out his
  term and became the Republican nominee, handpicked and strongly backed by
  President Trump. Her Democratic opponent was Annie Andrews, a 45-year-old
  pediatrician campaigning on healthcare access, affordability and
  anti-corruption. South Carolina had not elected a Democrat to the Senate
  since 1998 and Trump carried it by nearly 18 points in 2024, but the
  national environment strongly favoured Democrats in 2026 and Republicans
  were reported to be failing to unify behind Graham. Polls tightened in the
  final weeks: NYT/Siena (19–26 Oct) had a 48-48 tie; Targoz for the SC Policy
  Council (16–25 Oct) Graham 47-46; Trafalgar (16–18 Oct) Graham 49-46; The
  Citadel Graham +4; East Carolina University (through 29 Oct) Graham 51-47; a
  Democratic-aligned internal poll had Andrews up 48-43. Polling averages
  showed Graham ahead by roughly 1.5–2.7 points; ratings moved from Lean R to
  Tilt R. Prediction markets remained confident in Graham: on 30 October
  Polymarket priced her at 76% (Andrews 25%) and Kalshi at 73¢ (Andrews 28¢),
  though Andrews had risen from about 12–13 cents in early October.
