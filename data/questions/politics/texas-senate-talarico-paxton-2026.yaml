id: texas-senate-talarico-paxton-2026
domain: politics
title: Texas US Senate race 2026 — Talarico vs Paxton
question: >-
  Will Democrat James Talarico defeat Republican Ken Paxton in the US Senate
  election in Texas on 3 November 2026?
question_type: binary
options: ["Yes", "No"]
resolution_criteria: >-
  Resolves Yes if James Talarico wins the 3 November 2026 Texas US Senate
  general election per official results / AP call; No if Ken Paxton (or anyone
  else) wins.
context_summary: >-
  Texas's 2026 Senate race pitted Republican Ken Paxton, the state's
  controversial attorney general, against Democrat James Talarico, a
  37-year-old state legislator and former middle-school teacher. No Democrat
  had won statewide office in Texas in more than 30 years, and Donald Trump
  carried the state by double digits in 2024. The 2026 midterm environment
  was poor for Republicans nationally. Polls were close: a Fox News survey
  (15–19 Oct) had a 49-49 tie, the University of Houston Hobby School had
  Talarico ahead 48-46 among likely voters, and Emerson (17–19 Oct) also found
  a two-point Talarico edge; the RealClearPolitics average showed Talarico
  +1.8. Early voting was at record levels: about 4.54 million Texans had voted
  by 26 October, up 74% from the same point in 2022, with voters with a
  Democratic primary history slightly outnumbering Republican ones. Trump made
  three visits to Texas in October to rally for Paxton, joined on the trail by
  Governor Greg Abbott and Senator Ted Cruz. Prediction markets had swung from
  Paxton near 80% in late 2025 to Talarico as a modest favourite: on 27
  October both Polymarket and Kalshi priced Talarico at 66% and Paxton at
  35-36%, with Kalshi's margin forecast at Talarico +2.1.
