event_date: 2026-10-25
outcome_summary: >-
  The Student List won decisively, ending 14 years of SNS rule. Vučić conceded
  on election night at 21:31. After a repeat vote at 53 polling stations on 1
  November, RIK's final results (5 November) gave the Student List 2,354,417
  votes (~53%) and 140 of 250 seats, an outright majority; "Aleksandar Vučić –
  United Serbia" got 1,731,323 votes (~39%) and 103 seats. Dačić's SPS list
  (~2.2%), European Serbia and Authentic Right all missed the threshold; the
  remaining seven seats went to minority lists (Hungarians 2, Albanian
  Coalition 2, SDP–CDP 1, SDA Sandžak 1, Zukorlić's SPP 1). Turnout was
  68.9%, about 10 points higher than 2023. The Student List won around
  two-thirds of diaspora votes. Aftermath: public-broadcaster executives at
  RTS and RTV resigned, and prosecutors arrested several SNS-linked officials
  and businesspeople.
resolved_answer: Student List – Students Win
