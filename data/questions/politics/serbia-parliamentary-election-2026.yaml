id: serbia-parliamentary-election-2026
domain: politics
title: Serbia snap parliamentary election, 25 October 2026
question: >-
  Which electoral list will win the most seats in Serbia's National Assembly in
  the snap parliamentary election of 25 October 2026?
question_type: multiple_choice
options: ["Student List – Students Win", "Aleksandar Vučić – United Serbia", "Another list"]
resolution_criteria: >-
  Resolves to the electoral list allocated the most of the 250 seats according
  to the Republic Electoral Commission (RIK) final results.
context_summary: >-
  Serbia held early parliamentary elections on 25 October 2026 for the
  250-seat National Assembly (3% threshold, waived for national-minority
  lists). They followed nearly two years of student-led anti-corruption
  protests triggered by the November 2024 Novi Sad railway-station canopy
  collapse that killed 16 people. Aleksandar Vučić dissolved parliament on 9
  September, then resigned as president on 27 September to head the ruling
  Serbian Progressive Party's list, "Aleksandar Vučić – United Serbia", as its
  prime-ministerial candidate; SNS had governed since 2012. The protest
  movement ran as the "Student List – Students Win", headed by Ilija
  Srdanović and endorsed by most of the opposition, several parties
  withdrawing their own lists in its favour. Other lists included the SPS-led
  "Ivica Dačić – Factor of Stability!", "European Serbia" and the nationalist
  "Authentic Right". The campaign featured accusations of misuse of public
  resources, vote-buying and pressure on public-sector workers; the government
  made a one-off payment of almost €1 billion to adult citizens. Polls were
  split: NSPM (published 20 Oct; fieldwork 25 Sep–5 Oct) had the Student List
  narrowly ahead, 44.5% to 42.7%, the first opposition lead in over a decade,
  while Ipsos's final estimate for the ruling list (fieldwork 20–22 Oct) had
  United Serbia at 47.4% and the Student List at 40.0%. On Polymarket, the
  Student List was priced at about 32% to win the most seats a week before the
  vote and about 28% a day before.
