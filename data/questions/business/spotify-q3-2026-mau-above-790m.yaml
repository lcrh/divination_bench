event_date: 2026-10-22
outcome_summary: >-
  No. Spotify reported 788 million MAUs for Q3 2026, exactly in line with
  guidance: 11 million net additions, up 11% y/y from 713 million and up from
  777 million in Q2. Ad-supported MAUs were 499 million. Premium subscribers
  were 306 million, 1 million above the 305 million guidance (+6 million net
  additions). Revenue was EUR 4.97 billion (+16% reported, +14% at constant
  currency), in line with guidance and slightly below some Street estimates.
  Gross margin was 33.0% (guidance 32.9%) and operating income EUR 672 million
  (guidance EUR 670 million). For Q4 2026, Spotify guided to 818 million MAUs
  (+30 million), 316 million subscribers, revenue of EUR 5.2 billion and
  operating income of EUR 820 million. Polymarket's 780M strike resolved Yes
  and the 790M strike resolved No.
resolved_answer: "No"
