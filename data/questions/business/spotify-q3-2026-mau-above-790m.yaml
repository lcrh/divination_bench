id: spotify-q3-2026-mau-above-790m
domain: business
title: Will Spotify report more than 790 million MAUs for Q3 2026?
question: >-
  When Spotify reports its third-quarter 2026 results on 22 October 2026, will
  it report total monthly active users (MAUs) above 790 million?
question_type: binary
options: ["Yes", "No"]
resolution_criteria: >-
  Resolves Yes if Spotify's official Q3 2026 earnings materials report total
  MAUs strictly above 790 million; otherwise No. Later revisions are ignored.
  This matches the 790M strike of Polymarket's "Spotify Monthly Active Users
  above __ in Q3?" market.
context_summary: >-
  Spotify, the world's largest audio-streaming service, reports Q3 2026
  results on 22 October 2026. In Q2 2026 (reported 4 August) it hit 300
  million Premium subscribers and 777 million MAUs, up 12% y/y. MAU net
  additions of 16 million were 1 million below guidance of 17 million, while
  subscribers beat guidance by 1 million. For Q3, Spotify guided to 788
  million total MAUs (about 11 million net additions), 305 million Premium
  subscribers (+5 million), revenue of about EUR 5.0 billion, gross margin of
  32.9% and operating income of EUR 670 million. Management said MAU growth
  would be slower because of product changes in emerging markets that put
  monetisation ahead of user growth. Spotify usually lands close to its MAU
  guidance, missing or beating it by small margins; Q2 came in 1 million
  short. Clearing the 790 million threshold requires beating guidance by more
  than 2 million users. On Polymarket, the "above 780M" strike traded at about 92% and
  "above 790M" fluctuated between about 50% and 74% in the week before
  results, at about 53%-63% on 21 October.
