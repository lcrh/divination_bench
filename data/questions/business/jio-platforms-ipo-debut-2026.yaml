event_date: 2026-10-28
outcome_summary: >-
  Jio Platforms listed at Rs 1,358 on both the NSE and BSE, a 21.36% premium,
  almost exactly what the grey market implied. It then extended gains through
  the session to close at Rs 1,419 on the NSE, up Rs 300 or 26.81% from the
  issue price. That valued the company at about Rs 13.05 lakh crore, up from Rs 10.30 lakh crore at the issue price, adding about
  Rs 2.75 lakh crore of value. Jio became India's second most valuable listed
  company, behind its parent Reliance Industries (about Rs 15.67 lakh crore;
  RIL shares fell 3.46% that day) and ahead of Bharti Airtel (about Rs 12.16
  lakh crore). Nomura initiated coverage with a Buy rating and a Rs 1,340
  target.
resolved_answer: "25% to 35% above"
