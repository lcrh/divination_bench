id: jio-platforms-ipo-debut-2026
domain: business
title: Jio Platforms first-day trading after India's record IPO
question: >-
  Jio Platforms, priced at Rs 1,119 per share in India's largest-ever IPO, debuts
  on the NSE and BSE on 28 October 2026. Where will its shares close on the
  first trading day, relative to the Rs 1,119 issue price?
question_type: multiple_choice
options:
  - "Below the issue price"
  - "0% to 15% above"
  - "15% to 25% above"
  - "25% to 35% above"
  - "More than 35% above"
resolution_criteria: >-
  Resolves to the bracket containing the percentage difference between Jio
  Platforms' NSE closing price on 28 October 2026 and the Rs 1,119 issue price.
context_summary: >-
  Jio Platforms, the telecom and digital-services arm of Mukesh Ambani's
  Reliance Industries, backed by Meta and Google, raised about Rs 30,213 crore
  ($3.2 billion) in India's largest-ever IPO, overtaking Hyundai Motor India's
  Rs 27,870 crore issue in 2024. The price band was Rs 1,065-1,119 and the
  issue was priced at the top, Rs 1,119. It was entirely a fresh issue of
  about 270 million shares. Demand was very strong: the book was fully covered
  within 95 minutes of opening on 21 October and closed on 23 October
  subscribed 22.19 times overall. Qualified institutional buyers subscribed
  70.55 times, non-institutional investors about 14 times, and retail 2.72
  times, with a record of more than 10 million applications. Allotment was
  finalised on 26 October, and listing is set for 10 a.m. on 28 October. In
  the unofficial grey market, the premium (GMP) was Rs 273 on 20 October,
  eased to about Rs 240 on 22 October, and was about Rs 244-254 on 27
  October. That implies an estimated listing price of about Rs 1,363-1,373, a
  21.8%-22.7% premium to the issue price. Parent Reliance Industries is
  India's most valuable listed company, and Bharti Airtel is the main listed
  telecom rival.
