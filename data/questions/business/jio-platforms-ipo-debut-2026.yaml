notes: >-
  No prediction market; the grey-market premium (about 22%) serves as
  the pre-event expectation. The listing price matched the GMP; the close
  ended one bracket above the GMP-implied level. NDTV Profit cited a 12.45x
  subscription figure that conflicts with the 22.19x final figure reported
  elsewhere; 22.19x is used.
