id: grab-foodpanda-taiwan-ftc-2026
domain: business
title: Fate of Grab's US$600m takeover of foodpanda Taiwan at Taiwan's Fair Trade Commission
question: >-
  Singapore's Grab has agreed to buy Delivery Hero's foodpanda business in
  Taiwan for US$600 million, pending review by Taiwan's Fair Trade
  Commission, whose extended deadline is 27 October 2026. What will happen to
  the deal in the regulator's review, and why?
question_type: open
options: null
resolution_criteria: >-
  Judged on the Fair Trade Commission's decision on or before 27 October
  2026. Check what it decided (unconditional clearance, clearance with
  conditions, prohibition, or a further delay or withdrawal), the date and
  commissioners' vote if known, the main reasons it gave, how it treated
  any remedies Grab offered, and the immediate reactions of Grab and Delivery
  Hero. A prediction scores well if it gets the decision right and names the
  central concern behind it.
context_summary: >-
  Taiwan's food delivery market is a duopoly of foodpanda (owned by Germany's
  Delivery Hero) and Uber Eats. It handles about 427 million orders a year,
  worth roughly NT$135 billion. In December 2024 the Fair Trade Commission
  (FTC) blocked Uber's attempt to buy foodpanda Taiwan, which would have given
  it more than 90% of the market. In March 2026 Delivery Hero agreed to sell
  the business to Singapore's Grab for US$600 million in cash. It would be
  Grab's first market outside Southeast Asia, and Grab does not currently
  operate in Taiwan. The complication is that Uber owns about 13% of Grab
  (only about 3.7% of voting rights under Grab's dual-class structure).
  According to Grab, an Uber representative left its board in July 2026.
  In July Uber also made a takeover offer for Delivery Hero itself, though
  the published scope did not include foodpanda Taiwan. The FTC accepted
  Grab's complete filing on 16 June. On 22 July it extended its review by 60
  working days to 27 October, saying it needed to analyse whether Uber's
  shareholding would weaken competition between Grab and Uber Eats. In
  August it said it had taken no position in advance. Legislators, civic
  groups and the New Power Party urged a rejection, some also raising
  data-security worries. Grab issued statements stressing its independence,
  saying Taiwan data would not be stored in mainland China. Supporters of
  conditional approval warned that if the deal failed, foodpanda could
  weaken and Uber Eats could end up dominating the market.
