notes: >-
  No market found. Uber's voting share is given as 3.7% in the FTC's July
  notice and 3.9% in its October decision; equity is 13% (July) and 13.1%
  (October). Fortune (not cited) reported that the Uber board member who left
  in July was CEO Dara Khosrowshahi. Note that
  the decision came on 21 October, before the 27 October deadline; a
  prediction that only gives the deadline date should not be penalised for
  timing.
