event_date: 2026-10-21
outcome_summary: >-
  On 21 October 2026, six days before its deadline, the FTC prohibited the
  acquisition under Article 13(1) of the Fair Trade Act. Three commissioners
  voted to block it, one favoured approval with conditions, and one recused.
  The FTC said Uber's 13.1% stake in Grab, the long board service of Uber's
  CEO at Grab, and the two companies' past cooperation (including Grab's 2018
  takeover of Uber's Southeast Asia business) would weaken both firms'
  incentive to compete. This risked coordination in a highly concentrated
  market with high barriers to entry. Grab had offered to dilute Uber's
  stake, bar Uber people from its board and limit information sharing. The
  FTC said those measures could not be enforced reliably and were not
  enough, and that Uber would need to cut its stake much further or sell it
  entirely. It said Grab could file again. Grab said it was "disappointed" and
  would focus on Southeast Asia, without saying whether it would try again.
  Delivery Hero said its right to appeal was unaffected and that it had deal
  protections including a break fee. Delivery-worker unions welcomed the
  ruling.
resolved_answer: >-
  Taiwan's FTC blocked the deal outright on 21 October 2026 (3 votes to 1,
  one recusal). It said Uber's 13.1% stake in Grab and the two companies'
  close ties would dull competition with Uber Eats, and it rejected Grab's
  offered remedies as insufficient.
