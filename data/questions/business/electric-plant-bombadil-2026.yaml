id: electric-plant-bombadil-2026
domain: business
title: What is Bombadil, unveiled by Electric Plant Company?
question: >-
  On 20 October 2026 the San Francisco start-up Electric Plant Company came out
  of stealth and unveiled something called "Bombadil". What is Bombadil, and
  what does it do?
question_type: open
options: null
resolution_criteria: >-
  Judged on how accurately and specifically the answer describes Bombadil: what
  kind of thing it is (product type / technology), what input it works from,
  what it outputs or measures, and who it is for. A top answer identifies the
  core technology and data source precisely. Vague answers ("some kind of AI
  product for plants") get limited credit. Further correct specifics (for
  example any associated hardware, scale figures, or the size of the funding
  round) add precision.
context_summary: >-
  Electric Plant Company is a San Francisco start-up co-founded in 2023 by CEO
  Justin Mast and chief scientist Lee von Kraus. Mast previously founded
  Bloomscape, an online garden centre that shipped full-grown houseplants
  across the US, and comes from a family of commercial greenhouse operators.
  Von Kraus is a neuroscientist who has worked with DARPA and NASA and
  co-founded Halo Neuroscience. The company had operated mostly out of public
  view. On 20 October 2026 it formally emerged from stealth, announcing seed
  funding and the debut of "Bombadil", named after the Tolkien character. Its
  press materials described it as a first of its kind.
context_sources:
  - url: https://mastj.substack.com/p/we-are-planetary-gardeners
    title: "We Are Planetary Gardeners: A Techno-Biophilic Vision"
    publisher: Justin's Substack (Justin Mast)
    published_date: 2025-02-24
    excerpt: "In April 2023, a mutual investor introduced me to my co-founder. Lee von Kraus is a contrarian scientist... collaborations with DARPA and NASA... Prior to The Electric Plant Company, I started Bloomscape, an online garden center that shipped full-grown houseplants around the country."
event_date: 2026-10-20
outcome_summary: >-
  Bombadil is an AI foundation model for plant electrophysiology, which Electric
  Plant Company called the first of its kind. It reads a plant's health and
  physiological state directly from the plant's own electrical signals, rather
  than inferring it from soil, weather or visual inspection. It is a
  Transformer, pretrained self-supervised (without labels) on more than 4
  million hours of electrical recordings from over 1,400 plants across about
  100 species (125+ by launch) in ten environments. The company says its corpus
  has since grown to 7 million hours. Its first readout head estimates seven
  physiological stress markers, including photosystem II efficiency, leaf
  temperature relative to the air, and the Crop Water Stress Index. It also
  works on species it never saw in training. The signals come from "Bud", a
  low-cost sensor costing tens of dollars that is screwed into the plant's
  cambium and streams microvolt signals to the cloud. Target users are growers,
  orchards, agribusiness, forestry and plant-care operators, and Mast claimed
  water savings of 20% or more. The company announced an $11.2M seed round led
  by Onto Ventures and Climactic, and released a technical white paper.
resolved_answer: >-
  Bombadil is Electric Plant Company's AI foundation model for plant
  electrophysiology. Fed by the company's low-cost "Bud" sensor, it decodes the
  electrical signals inside living plants to estimate their health and stress
  in real time, across about 100+ species. It was trained on more than 4
  million hours of recordings and launched alongside an $11.2M seed round.
