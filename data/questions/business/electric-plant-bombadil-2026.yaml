notes: >-
  The white paper carries the date 19 Oct 2026, but the public launch (press
  release, TechCrunch, founder's post) was 20 Oct 2026, which is used as the
  event_date. The context source is a Feb 2025 founder essay that already
  discussed plants' electrical signalling and the company's mission. The
  context summary deliberately leaves out that mission so the answer is not
  given away. The company name, the Bloomscape background and the Tolkien
  nature-spirit name still hint at plants. A strong answer must add the
  foundation-model and electrophysiology specifics. Species counts vary by
  source (100 in the press release and white paper, 125+ on TechCrunch and the
  FAQ).
