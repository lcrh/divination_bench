id: apple-largest-company-end-oct-2026
domain: business
title: Will Apple overtake Nvidia as the world's most valuable company at the end of October 2026?
question: >-
  At the market close on Friday 30 October 2026, the last trading day of
  October, will Apple be the world's largest publicly traded company by market
  capitalisation, ahead of Nvidia?
question_type: binary
options: ["Yes", "No"]
resolution_criteria: >-
  Resolves Yes if, at the close of US trading on 30 October 2026, Apple's
  market capitalisation exceeds that of every other listed company (in
  practice, Nvidia), according to a consensus of credible financial reporting.
  Otherwise No. This matches Polymarket's "Largest Company end of October
  2026?" market.
context_summary: >-
  Nvidia has been the world's most valuable company almost continuously since
  June 2025 and became the first company worth $5 trillion. In 2026, however,
  investors have grown anxious about hyperscalers' huge AI capital spending
  and whether it will pay off, while Apple, which has kept capex low, has been
  the best-performing "Magnificent Seven" stock, up about 27%-28% this year.
  Apple closed above $5 trillion for the first time in mid-October. Its first
  foldable phone, the $1,999 iPhone Duo, launched globally on 23 October after
  pre-orders sold out, and that morning Apple briefly passed Nvidia intraday
  (about $5.11-5.13 trillion vs $5.09-5.10 trillion) before Nvidia moved back
  ahead. Apple's only previous spell on top this year was briefly in July.
  Nvidia fell about 7% in October through 23 October on concerns about the AI
  financing environment, after Meta's 21 October earnings raised capex
  guidance and showed negative free cash flow. At
  the close on Monday 26 October, Nvidia was worth about $5.21 trillion and
  Apple about $5.02 trillion, a gap of roughly $190 billion (under 4%). Key
  events before the 30 October close are the Fed decision and Alphabet and
  Microsoft earnings (28 October, after the bell) and Amazon and Intel
  earnings (29 October). Apple reports fiscal Q4 results on 2 November, after
  the deadline. On Polymarket on 28 October,
  Nvidia was priced at about 93% to be the largest company at month-end and
  Apple at about 7%.
