event_date: 2026-10-30
outcome_summary: >-
  Yes. Apple closed Friday 30 October 2026 as the world's most valuable
  company, with a market capitalisation of about $5.03 trillion against
  Nvidia's $4.93 trillion. Apple's shares actually fell 1.2% that day, but
  Nvidia sank 4.2% (to about $204.64) in a broad tech selloff, as
  disappointing results from Alphabet (whose shares fell about 13% on 29
  October, their worst day ever), Amazon and Intel deepened worries about AI
  spending. The Nasdaq fell 2.9% that Friday. It was the first time Apple had
  overtaken Nvidia at a close since late July. Nvidia lost about $835 billion
  in market value over October, its worst month in a year. The lead did not
  last: Nvidia regained the top spot on 3 November after Apple's 2 November
  fiscal Q4 report, which beat on revenue and EPS, but its gross-margin
  guidance of 45%-46% sent the shares lower.
resolved_answer: "Yes"
