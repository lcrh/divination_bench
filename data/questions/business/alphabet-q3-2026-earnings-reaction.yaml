event_date: 2026-10-29
outcome_summary: >-
  GOOGL fell 12.6% on 29 October 2026 to $283.82, Alphabet's worst one-day drop
  since its 2004 IPO, beating the previous record of -11.6% in March 2020. The
  move wiped out about $480-500 billion of market value, the second-largest
  one-day loss in US market history after Nvidia's in January 2025, and pulled
  the Nasdaq down 1.4%. Alphabet's Q3 revenue was $127.58 billion (+25% y/y),
  slightly below the roughly $127.97 billion consensus. Search and other revenue
  grew only 12% to $63.35 billion, against expectations of about 15% (down
  from 17% in Q2), and an executive acknowledged that Google's own AI Mode
  shows fewer ads. Google Cloud revenue more than doubled (+103%) to $30.71
  billion. Quarterly capex was $51.4 billion, and free cash flow was negative
  $9.07 billion versus about -$2.7 billion expected. Full-year capex guidance
  was kept at $195-205 billion, with spending set to rise again in 2027. Net
  income fell to $26.17 billion, partly due to a paper loss on Alphabet's
  SpaceX stake. The move was more than double the roughly 6% implied by
  options.
resolved_answer: "Down more than 10%"
