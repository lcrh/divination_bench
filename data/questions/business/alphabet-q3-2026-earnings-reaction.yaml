id: alphabet-q3-2026-earnings-reaction
domain: business
title: Alphabet share-price reaction to Q3 2026 earnings
question: >-
  Alphabet reports third-quarter 2026 results after the US market close on
  Wednesday 28 October 2026. By how much will Alphabet's Class A shares (GOOGL)
  move on Thursday 29 October, from the 28 October close to the 29 October
  close?
question_type: multiple_choice
options:
  - "Up more than 6%"
  - "Up 0% to 6%"
  - "Down 0% to 6%"
  - "Down 6% to 10%"
  - "Down more than 10%"
resolution_criteria: >-
  Resolves to the bracket containing the percentage change in GOOGL's regular
  session closing price on 29 October 2026 versus its 28 October 2026 close,
  as widely reported by financial media.
context_summary: >-
  Alphabet heads into its Q3 2026 report on 28 October with the stock near
  $320-324, up only about 4% for the year and almost 20% below its May record,
  close to technical bear-market territory, as investors worry about AI
  spending across Big Tech. A week earlier, Meta fell sharply after raising
  2026 capex guidance to $135-145 billion and reporting negative free cash
  flow, and Meta's credit-default-swap spreads hit record highs. Alphabet's
  full-year capex guidance is $195-205 billion. Consensus (Visible Alpha /
  FactSet) expects revenue of about $127.9 billion (+25% y/y), Google Cloud
  revenue of about $29.2 billion (nearly double a year earlier), and EPS of
  roughly $2.94-3.03. Analysts are focused on whether search advertising is
  being cannibalised by AI agents and Google's own AI Mode; Citizens trimmed
  its target to $450 while staying at Buy, and nearly every analyst rates the
  stock Buy, with average targets around $428 (about 33% upside). Options
  imply a post-earnings move of about 5.8%-6.1% in either direction, more than
  double Alphabet's median reaction of about 2.6%-2.7% over the past eight
  quarters. Its last four earnings-day moves were -7.13%, +9.96%, -0.54% and
  +2.52%. Options flow on 27-28 October was mixed: heavy call buying (including
  a bet on a jump to $365) alongside large put trades. Microsoft also reports
  after the close on 28 October, the Fed announces its decision that afternoon,
  and Amazon reports on 29 October.
