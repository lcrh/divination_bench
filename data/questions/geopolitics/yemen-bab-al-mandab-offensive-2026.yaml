outcome_summary: >-
  The offensive came quickly and was broad. On 4-5 October Presidential
  Leadership Council chair Rashad al-Alimi announced "Operation Dawn of Yemen"
  from Riyadh. It aimed to retake all Houthi territory, including Sanaa, with
  round-the-clock Saudi air support. On 5 October government forces (Giants
  Brigades, National Shield, Tihama Resistance) claimed to have "secured" Bab
  al-Mandab, taken the Dhubab airfield and captured Mocha. Other sources said
  they had only reached Mocha's outskirts, and the Houthis denied losing
  anything. The same day Saudi Arabia, Turkey and Pakistan agreed to deploy
  forces to Saudi Arabia under their Mecca defence pact. The Houthis hit back
  with missiles and drones on Riyadh airport, Aramco sites and other Saudi
  targets; a 10 October strike on Riyadh's King Khalid airport killed 12-13
  people, and the airport was closed for about two weeks. The front then bogged down. By
  mid-October the Houthis had reportedly retaken the Dhubab airfield and were
  pressing Taiz. On 20 October government sources said there had been "little
  headway", with Mocha and Perim still in Houthi hands. By 5 November analysts
  described a war of attrition. The government claimed heavy Houthi losses
  (16,100 killed or wounded) and some positions near Bab al-Mandab and
  al-Hazm, while the Houthis gained ground in Taiz and Lahij. A Houthi missile
  strike killed about 70 recruits in Shabwah. No ceasefire or talks emerged.
resolved_answer: >-
  Saudi-backed Yemeni forces launched a broad "Operation Dawn of Yemen" on
  5 October and initially claimed to have secured Bab al-Mandab. The advance
  stalled: Mocha and Perim stayed in Houthi hands, the Houthis made gains around
  Taiz and escalated missile strikes on Saudi airports and oil sites, and by
  early November the fighting was a war of attrition with no ceasefire.
market: null
notes: >-
  No market. Control of Dhubab and of the coast near Bab al-Mandab was disputed
  throughout. The government said it had retaken Dhubab district, while the
  Houthis and Xinhua's government source said Mocha and Perim stayed under
  Houthi control. A judge should accept "contested / partial gains" framings.
  The 10 October Riyadh airport death toll (12, later 13) and the roughly
  two-week closure come from Wikipedia's October 2026 Current events portal (citing
  WSJ, Reuters and AFP). The claim that the Houthis retook the Dhubab airfield
  around 14 October comes from Al-Binaa's assessment of footage and is not
  independently confirmed.
