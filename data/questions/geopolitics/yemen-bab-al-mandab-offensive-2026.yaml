id: yemen-bab-al-mandab-offensive-2026
domain: geopolitics
title: What comes of Saudi Arabia's planned push to break the Houthi hold on Bab al-Mandab
question: >-
  In September 2026 Yemen's Houthis seized the coast around the Bab al-Mandab
  Strait, including Mocha and Perim (Mayun) Island. In early October Saudi
  Arabia was reported to be preparing a ground offensive by Yemeni government
  forces, backed by Saudi air power, to reverse those gains. What will happen
  in Yemen's war, and with the Houthi hold on Bab al-Mandab, over the following
  month (to early November 2026)?
question_type: open
options: null
resolution_criteria: >-
  Judged on events between 3 October and 5 November 2026. The judge should
  check whether a Saudi-backed offensive was launched, and roughly when; its
  scope (a narrow coastal push or a multi-front campaign aimed at Sanaa); and
  how much ground it actually took. That includes whether Mocha, the Dhubab
  area and Perim Island were retaken and held. The judge should also check
  whether the Houthis escalated attacks on Saudi Arabia, whether outside allies
  such as Pakistan and Turkey deployed forces, and whether any ceasefire or
  talks emerged.
context_summary: >-
  A truce in Yemen's civil war had largely held since 2022. It unravelled in
  2026 as a spillover from the US-Israel war on Iran, which had effectively
  closed the Strait of Hormuz since March. The Houthis declared a "maritime
  embargo" on Saudi Arabia and fired missiles and drones at Saudi airports,
  oil facilities and tankers. In a lightning offensive in September they took
  the Red Sea port of Mocha (10 September), the Hanish islands, the coastal
  town of Dhubab and, on 11 September, Perim (Mayun) Island in the middle of
  the Bab al-Mandab Strait, as Saudi-backed government forces withdrew. Saudi
  Arabia had come to rely on the Red Sea route for oil exports, so the seizure
  pushed up oil prices. The Houthis said only Saudi-linked ships would be
  targeted. The UAE had withdrawn from Yemen, and analysts cited poor
  coordination among government forces. On 2 October Reuters reported that
  Riyadh was planning an offensive led by Yemeni ground forces and supported
  by Saudi air strikes. Officials described two options: a narrow push around
  Bab al-Mandab, or synchronised attacks on several fronts (Al-Bayda, Marib,
  Taiz, Al-Jawf) involving more than 100,000 troops. Estimates of timing ranged
  from within a week to after the US midterms in early November. Riyadh
  reportedly would not negotiate while the Houthis held the strait. Pakistan
  had sent equipment and advisers and had 30,000-40,000 troops in Saudi
  Arabia, and France was sending air defences to Yanbu. A former US ambassador
  expected a limited operation. Analysts said success depended on fractured
  Yemeni ground forces.
