    title: Hungary gives green light to opening of Clusters 2 and 3 for Ukraine
    publisher: European Pravda
    published_date: 2026-10-07
    excerpt: "Once the EU negotiating position has been approved, a Ukraine-EU intergovernmental conference could be held the following day, 13 October, at which Clusters 2 and 3 could be formally opened... A bill on education in national minority languages was registered in the Verkhovna Rada on 1 October."
event_date: 2026-10-13
outcome_summary: >-
  4. On 12 October the Rada passed bill No. 16119 (273 votes at first reading,
  266 in the final vote), and Zelensky signed it the same day. Hungarian
  Foreign Minister Anita Orbán confirmed it met Budapest's condition. On 13
  October the 4th EU-Ukraine Accession Conference in Luxembourg, chaired by
  the Irish presidency with Commissioner Marta Kos, formally opened cluster 2
  (internal market) and cluster 3 (competitiveness and inclusive growth),
  covering 17 chapters. That brought Ukraine to four of six clusters. The
  European Council endorsed the step on 16 October, and Zelensky and Magyar
  held their first bilateral meeting in Brussels that day. But at EU working
  party meetings on 20 and 27 October, Hungary refused to approve screening
  results for clusters 4 and 5, so they did not advance in October. Ukraine's
  EU envoy said Budapest had no new substantive objections and hoped they
  would open by year-end.
resolved_answer: "4"
