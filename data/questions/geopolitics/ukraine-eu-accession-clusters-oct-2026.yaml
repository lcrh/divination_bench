    excerpt: "Hungary has cleared the way for the EU to open two more negotiating clusters with Ukraine, signalling that Budapest is ready to lift its veto if Kyiv passes a minority-rights law next week... The process could still be derailed, however. Ukraine's parliament has yet to approve the minority law, amid difficulties in securing stable majorities in the Rada."
