event_date: 2026-10-23
outcome_summary: >-
  On 23 October 2026 the White House announced that First Lady Melania
  Trump, acting as "Exclusive Intermediary", had secured a Russia-Ukraine
  ceasefire localized to the Russian-occupied, besieged city of Oleshky
  (Kherson region). The purpose was to deliver humanitarian aid and evacuate
  civilians; about 1,700-2,000 people remained there. Both sides confirmed it.
  Russia's chief of general staff Valery Gerasimov ordered a "regime of
  silence" on the Kherson axis. Ukrainian ombudsman Dmytro Lubinets and his
  Russian counterpart Yana Lantratova, heads of the two negotiating teams,
  fixed the start time in an online meeting on 24 October. The truce ran from
  03:00 Kyiv time on 27 October to the end of 1 November and was described as
  the longest and most widespread since 2022, covering the whole Kherson
  frontline. Routes were demined. On 30 October a convoy of 25 buses evacuated
  several hundred residents, some to Ukraine via Belarus and some to Russia.
  Both sides said the ceasefire held. Fighting continued elsewhere, and
  broader trilateral talks were still pending for November.
resolved_answer: >-
  A US-brokered (via Melania Trump), humanitarian ceasefire localized to
  occupied Oleshky and the Kherson front, announced 23 October and confirmed
  by both sides, held from 27 October to 1 November and allowed hundreds of
  civilians to be evacuated; fighting continued elsewhere and wider talks
  remained pending.
