notes: >-
  The market is a proxy: "Will Russia and Ukraine hold any diplomatic meeting by October 31,
  2026?" (mediated meetings count). It traded at 0.185 at 12:00 UTC on 21 Oct, 0.24 on 22 Oct,
  then jumped to 0.99 on 23 Oct after the Oleshky announcement. The BBC published_date is
  approximate (the article reports evacuees arriving "on Saturday", i.e. 31 Oct).
  The market probability refers to that closed proxy (and to the former yes/no
  ceasefire framing); the question is now open.
