event_date: 2026-10-28
outcome_summary: >-
  Fewer than 135. On 28 October 2026 the General Assembly adopted the
  resolution, the 34th such call, by 130 votes in favour, 17 against and 25
  abstentions. That was a drop of 35 "yes" votes from 2025 and, per UN News,
  the weakest backing in two decades. The number of "no" votes more than
  doubled (from 7 to 17), and abstentions rose from 12 to 25. The abstainers
  included major economies that had previously voted yes, such as Germany,
  Italy and South Korea. During the debate on 27 October Cuban Foreign
  Minister Rodríguez interrupted Ambassador Waltz on a point of order, and US
  and Cuban officials reportedly shouted at and shoved each other. Waltz then
  announced the expulsion of a Cuban mission diplomat for "assaulting an
  American diplomat". He hailed a "tripling" of countries that had shifted
  and predicted the trend would grow. Rodríguez said the US was "once again
  isolated". India and most of the Global South still voted in favour.
resolved_answer: Fewer than 135
