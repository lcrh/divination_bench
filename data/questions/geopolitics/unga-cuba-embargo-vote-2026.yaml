id: unga-cuba-embargo-vote-2026
domain: geopolitics
title: Support for the UN General Assembly's 2026 resolution against the US embargo on Cuba
question: >-
  At the UN General Assembly's annual vote on the resolution calling for an
  end to the US embargo against Cuba (expected 27-28 October 2026), how many
  member states will vote in favour?
question_type: multiple_choice
options: ["165 or more", "150-164", "135-149", "Fewer than 135"]
resolution_criteria: >-
  Resolves to the bin containing the number of "in favour" votes in the
  recorded vote on the 2026 resolution "Necessity of ending the economic,
  commercial and financial embargo imposed by the United States of America
  against Cuba", as reported by UN Meetings Coverage.
context_summary: >-
  Since 1992 the UN General Assembly has adopted, almost every year, a
  non-binding resolution demanding an end to the US embargo on Cuba, usually
  near-unanimously. In 2024 the vote was 187 in favour, 2 against (US,
  Israel) and 1 abstention. In October 2025, after US lobbying that included
  Ukrainian claims that thousands of Cubans were fighting for Russia, support
  fell to 165 in favour, 7 against (US, Israel, Argentina, Hungary, North
  Macedonia, Paraguay, Ukraine) and 12 abstentions (mostly Central/Eastern
  European states plus Costa Rica, Ecuador and Morocco). In 2026 the Trump
  administration ran a much more aggressive campaign led by Secretary of
  State Marco Rubio and UN Ambassador Mike Waltz. On 21 October Cuban Foreign
  Minister Bruno Rodríguez accused Washington of threatening countries with
  tariffs, visa denials for officials and their families, suspension of
  cooperation programmes, and support for opposition parties in elections if
  they did not change their votes. He also said the US was urging countries to
  abstain or skip the vote. Waltz confirmed he had asked "many of our European
  colleagues" to reconsider their support. US-Cuban tensions were high: the
  Trump administration was openly calling for regime change and had added new
  economic restrictions on the island. The vote was scheduled for 27 or 28
  October.
