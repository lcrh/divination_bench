event_date: 2026-10-04
outcome_summary: >-
  The rebel offensive was quickly reversed. Federal forces and pro-government
  militias pushed the rebels back from Afar and Amhara in late September and
  counterattacked into Tigray along several axes. On about 1 October Ethiopia
  closed its embassy in Asmara and expelled Eritrean diplomats, accusing
  Eritrea of backing the rebels. Eritrea then severed diplomatic ties. On 3-4
  October the TPLF withdrew from Mekelle, saying its regional government would
  operate "from somewhere else". The pro-government Tigray Peace Force and the
  federal army entered the city and retook its airport, a major blow to the
  alliance. Eritrean troops then entered northern Tigray around 7 October in
  support of the rebels. Ethiopian drone strikes hit them, and many pulled
  back, though some stayed near the border, for example around Zalambessa.
  Federal forces retook Adigrat (10 October) and Adwa (11 October). There was
  no ceasefire. On 16 October Abiy's government declared the TPLF defeated and
  installed a six-month federal caretaker administration for Tigray, staffed
  mostly by former TPLF figures allied with Getachew Reda, with regional
  elections promised within six months.
resolved_answer: >-
  Federal forces counterattacked and recaptured Mekelle on 3-4 October 2026
  after the TPLF withdrew, then pushed north to Adigrat and Adwa. Eritrean
  troops briefly entered Tigray before Ethiopian drone strikes drove most of
  them back. Ethiopia and Eritrea cut diplomatic ties, and on 16 October Abiy
  installed a six-month federal caretaker government in Tigray.
