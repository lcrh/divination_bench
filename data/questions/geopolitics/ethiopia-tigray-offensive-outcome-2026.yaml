id: ethiopia-tigray-offensive-outcome-2026
domain: geopolitics
title: How Ethiopia's new war with the TPLF-led rebel alliance unfolds in its first weeks
question: >-
  On 23 September 2026 Tigrayan forces, leading a new seven-group rebel alliance
  that aims to topple Prime Minister Abiy Ahmed, launched a major offensive
  against Ethiopia's federal government. What will happen in this war over the
  following three weeks, up to mid-October 2026?
question_type: open
options: null
resolution_criteria: >-
  Judged on the military and political situation in northern Ethiopia between
  27 September and about 16 October 2026. The core question is which side
  gained ground: did the rebels expand their offensive, did it stall into a
  stalemate, or did federal forces push into Tigray? The judge should also
  check who controlled Mekelle, the Tigray capital, and whether it changed
  hands. Further checkable details are whether Eritrea became directly involved
  and whether Ethiopia–Eritrea relations changed, whether any ceasefire or
  African Union-mediated talks took hold, and whether Addis Ababa took any
  political steps regarding Tigray's administration.
context_summary: >-
  On 20 September 2026 seven Ethiopian armed groups announced an alliance to
  overthrow Prime Minister Abiy Ahmed's government. The Ethiopian Peoples'
  Forces Alliance for Survival includes the Tigray People's Liberation Front
  (TPLF), the Amhara Fano National Movement and the Oromo Liberation Army.
  Fano had fought alongside the federal army against the TPLF in the 2020-22
  war, which ended with the 2022 Pretoria agreement. On 23 September Tigray's
  TPLF-led regional government said it had entered a "defensive war". Its
  forces seized the airports of Mekelle, Axum and Shire, Ethiopian Airlines
  suspended flights, and fighting spread into the neighbouring Afar and Amhara
  regions, including around the border town of Abala and near Lalibela. Each
  side blamed the other for starting it. The army claimed to have killed more
  than 270 rebels on one front. Addis Ababa accused Eritrea of financing the
  alliance, which Eritrea denied. Relations between the two neighbours had
  soured over Abiy's push for Red Sea port access. Analysts warned of a
  regional war overlapping with Sudan's conflict. One risk analyst said the
  federal government was tactically stronger than in 2020 because of its
  drone stocks and divisions within the TPLF. About 750,000 Tigrayans were
  still displaced from the last war. The African Union called the airport
  seizures inconsistent with the Pretoria deal, urged an immediate halt and
  asked former Nigerian president Olusegun Obasanjo to engage the parties.
  Analysts said the conflict had not yet become a full-scale civil war.
