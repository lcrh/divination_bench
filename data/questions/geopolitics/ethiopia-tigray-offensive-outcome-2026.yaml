notes: >-
  No market. The dates of town recaptures (Adigrat 10 Oct, Adwa 11 Oct) and of
  the embassy closure (1 Oct) come from Wikipedia's "2026 Ethiopian offensive"
  page, which cites Reuters, AFP and ACLED. The Critical Threats brief of
  16 Oct describes the caretaker appointees as linked to Getachew Reda's Simret
  party and the Tigray Peace Forces. Low-level fighting and Fano activity in
  Amhara continued after Mekelle fell, so "war over" is not strictly accurate.
