event_date: 2026-10-28
outcome_summary: >-
  Bukele escalated dramatically. On 21 October he launched a military rescue
  operation and threatened on X, in Haitian Creole, to destroy Haiti's gangs
  "as in El Salvador" unless the men were released. On 22 October about 100
  special forces soldiers were sent, followed by flights of troops and
  equipment. On 28 October, after a phone call between Bukele and Haitian
  Prime Minister Alix Didier Fils-Aimé, El Salvador's foreign ministry
  announced a "robust deployment" of more than 2,000 soldiers. It was the
  country's largest foreign deployment in decades. The aim was to find the
  four men and also to keep "supporting anti-gang security efforts" in Haiti.
  It was unclear whether the troops would serve under the GSF or separately.
  Earlier that week Haiti had handed over four bodies said to be the missing
  men, but Bukele rejected them: one was a child and another wore a different
  country's uniform. On 2 November Salvadoran, Haitian and GSF troops began an
  offensive in the Plain of the Cul-de-Sac. By early November the burned
  vehicle had been found but there was no sign of the four men. The same week
  Haiti postponed its elections to 2027.
resolved_answer: >-
  El Salvador deployed more than 2,000 troops to Haiti (announced 28 October),
  its largest foreign deployment in decades, for a rescue mission and broader
  anti-gang operations. The four men had not been found by early November.
