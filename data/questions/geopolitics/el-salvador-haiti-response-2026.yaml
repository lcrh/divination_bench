id: el-salvador-haiti-response-2026
domain: geopolitics
title: El Salvador's response to the disappearance of four of its soldiers in Haiti
question: >-
  Four Salvadoran air force technicians serving with the UN-backed Gang
  Suppression Force in Haiti went missing after a gang ambush on 18 October
  2026. What will El Salvador do in response by the end of October 2026?
question_type: open
options: null
resolution_criteria: >-
  Judged on El Salvador's main concrete response between 20 and 31 October
  2026: the scale and nature of any military deployment, diplomatic steps
  towards Haiti or the UN, and whether the four men are recovered. A
  prediction scores well if it gets the scale (token, modest, or large) and
  nature (rescue/search effort, broader anti-gang operations, or withdrawal)
  of El Salvador's action right.
context_summary: >-
  On Sunday 18 October 2026 heavily armed gangs ambushed an armoured vehicle
  of El Salvador's "Liberty II" contingent of the Gang Suppression Force
  (GSF) in Santo, Croix-des-Bouquets, about 12 km north-east of
  Port-au-Prince. The area is controlled by the 400 Mawozo and Chen Mechan
  gangs. The vehicle was hit by "hundreds of bullets and explosives" and set
  on fire. The four aviation technicians aboard escaped but then lost contact
  and were missing. Salvadoran helicopters sent to help came under fire, and
  repeated attempts to reach the area by land and air failed because of
  heavy fighting. It was the first major attack and the first major
  battlefield loss for the GSF, the multinational force authorised by the UN
  Security Council to help Haiti's police fight gangs. Other GSF contingents
  come from Mongolia, Guatemala, Jamaica, Sri Lanka, Chad and elsewhere. The
  force was trying to recruit more troops while gang violence had displaced
  nearly 1.5 million Haitians. El Salvador's president, Nayib Bukele, is
  known for his mass-incarceration crackdown on gangs at home. El Salvador
  had contributed troops and air crews, including helicopters, to the GSF. US Ambassador Mike Waltz raised the
  ambush at the UN Security Council on 19 October. No gang had claimed
  responsibility, and the fate of the four men was unknown.
