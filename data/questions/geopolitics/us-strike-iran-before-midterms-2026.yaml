notes: >-
  The market's own outcomes are inverted: "ceasefire continues" (= No here) traded at 0.945 at
  12:00 UTC on 1 Nov, 0.82 on 26 Oct and ~0.75-0.80 in mid-October (Polymarket CLOB price
  history). The outcome is a low-probability upset, below the ideal 10-90% band, although
  the strike was small and described as defensive.
