id: us-strike-iran-before-midterms-2026
domain: geopolitics
title: Will the US strike Iran before the 3 November 2026 midterm elections?
question: >-
  Will the United States carry out an air or missile strike that hits Iranian
  territory at any point before the end of 3 November 2026 (US midterm
  Election Day)?
question_type: binary
options: ["Yes", "No"]
resolution_criteria: >-
  Resolves Yes if, between 2 October and 3 November 2026 (11:59 PM ET), the
  United States carries out a publicly reported or acknowledged air strike or
  surface-to-surface missile strike, initiated by US forces, that directly hits
  Iranian territory (including Iranian islands). Intercepted munitions, cyber
  operations, naval gunfire and threats do not count. This mirrors the
  Polymarket market "US-Iran ceasefire continues through the midterms?", which
  resolves No (i.e. this question resolves Yes) on such a strike.
context_summary: >-
  The US-Israel war with Iran, which began in early 2026, had settled into an
  uneasy ceasefire, but not a settlement. Iran's Revolutionary Guard was still
  disrupting traffic through the Strait of Hormuz, the US maintained a naval
  presence and blockade in the Gulf, and oil prices were high (Brent was above
  $105 in early October). Washington and Tehran were holding indirect talks
  through Qatar on ending the war and reopening the strait. A preliminary deal
  in June had collapsed. On 7 October The Atlantic reported that President
  Trump had asked the Pentagon for strike options to use before the midterms.
  The next day Trump posted on Truth Social: "we will not be attacking Iran at
  any time prior to the midterm elections to be held in the United States on
  November 3rd", citing "productive discussions". He left open renewed strikes
  after the vote. Analysts tied the pledge to the war's unpopularity and to
  high fuel prices hurting Republican candidates. They also noted that Iran
  could escalate in the meantime, and that Trump had admitted using public
  statements to keep adversaries off guard. On Polymarket,
  "US-Iran ceasefire continues through the midterms?" (i.e. no US strike on
  Iran by 3 November) traded around 72-80% in mid-October and about 94-95% on
  1 November.
